apiVersion: apps/v1
kind: Deployment
metadata:
  name: ourslngagent
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ourslngagent
  template:
    metadata:
      labels:
        app: ourslngagent
    spec:
      containers:
        - name: bot
          image: ourslngagent:latest
          env:
            - name: SLNG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ourslngagent-secrets
                  key: SLNG_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ourslngagent-secrets
                  key: OPENAI_API_KEY

