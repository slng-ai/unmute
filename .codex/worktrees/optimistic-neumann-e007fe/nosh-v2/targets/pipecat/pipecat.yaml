# Pipecat target profile. This is target-specific deploy/runtime config, not
# the portable agent spec.
docker:
  image: nosh-v2
  tag: latest

pcc:
  agent_name: nosh-v2
  secret_set: nosh-v2-local
  agent_profile: voice-agent
  scaling:
    min_agents: 1

kubernetes:
  namespace: default
  secret_name: nosh-v2-secrets
  replicas: 1

local:
  env_file: .env.local
