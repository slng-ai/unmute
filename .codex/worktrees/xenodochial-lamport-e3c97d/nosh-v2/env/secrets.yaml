# Runtime secret references. Values live in .env.local for local runs and in
# your target secret store for deployment.
local:
  env_file: .env.local

secrets:
  SLNG_API_KEY:
    local_key: SLNG_API_KEY
  OPENAI_API_KEY:
    local_key: OPENAI_API_KEY
  # Optional provider key for Gradium routes.
  GRADIUM_API_KEY:
    local_key: GRADIUM_API_KEY
  TWILIO_ACCOUNT_SID:
    local_key: TWILIO_ACCOUNT_SID
  TWILIO_AUTH_TOKEN:
    local_key: TWILIO_AUTH_TOKEN
