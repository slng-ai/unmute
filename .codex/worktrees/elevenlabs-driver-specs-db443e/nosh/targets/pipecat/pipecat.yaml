# Pipecat target profile. This is target-specific deploy/runtime config, not
# the portable agent spec.
docker:
  image: nosh
  tag: latest

pcc:
  agent_name: nosh
  secret_set: nosh-local
  agent_profile: voice-agent
  scaling:
    min_agents: 1

kubernetes:
  namespace: default
  secret_name: nosh-secrets
  replicas: 1

local:
  env_file: .env.local
