targets:
  pipecat:
    provider: pipecat
    version: "1.8.0"
    sdk_language: python

  livekit:
    provider: livekit
    version: "1.6.10"
    sdk_language: python
    models:
      # LiveKit resolves an unlisted think provider through LiveKit Inference,
      # which has no slot for a custom endpoint.
      nemotron:
        provider: nvidia
        model: "nemotron-3.5-lightning-30b-a3b"
      # silero is a voice activity detector, not a turn detector. Pipecat
      # forwards the identity unchecked; LiveKit checks it and refuses.
      detector:
        provider: livekit
        model: turn-detector-mini
