name: Bug report
description: Something in unmute is broken, refused wrongly, or the agent it built misbehaves.
labels: ["bug"]
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing. Two things make a bug fixable fast:

        1. **Which step fails.** `unmute` has separate stages (author, validate,
           compile, dev, deploy, then the running agent). A bug at one stage has
           nothing to do with the others.
        2. **The smallest thing that shows it.** If an `agent.yaml` of ten lines
           reproduces it, paste that instead of your whole package.

        Docs: https://unmute.ai

  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected instead
      placeholder: |
        `unmute compile` accepts a `pace: brisk` on a task binding, but the
        emitted bot.py never sets the ceiling. I expected it to be refused, or
        for the field to reach the runtime.
    validations:
      required: true

  - type: dropdown
    id: step
    attributes:
      label: Which step fails
      options:
        - Installing unmute, or running it at all
        - Authoring (the interactive console, or `unmute init`)
        - "`unmute validate` (my package is refused, and I think it is valid)"
        - "`unmute validate` (my package is accepted, and I think it should be refused)"
        - "`unmute compile` (it errors, or writes the wrong thing into build/)"
        - "`unmute dev` (the local browser loop)"
        - "`unmute deploy`"
        - The deployed agent, on a browser session
        - The deployed agent, on a phone call
        - The docs site, or the coding-agent skill
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Where does the fault look like it is
      description: >
        Our own first rule for debugging is to find the layer the defect lives
        in and reproduce it there. Your best guess is enough, and "not sure" is a
        fine answer.
      options:
        - The CLI itself (it crashed, or its error message is wrong)
        - The generated code in `build/<target>/` is wrong
        - The generated code looks right, and the framework or provider behaves differently
        - The generated code looks right, and the phone leg or carrier behaves differently
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: targets
    attributes:
      label: Which target are you compiling to
      multiple: true
      options:
        - livekit
        - pipecat
        - slng
        - Not target specific
    validations:
      required: true

  - type: dropdown
    id: route
    attributes:
      label: Phone route, if a call is involved
      description: The target, transport, and carrier from your connection file.
      options:
        - No phone (browser or `unmute dev` only)
        - "pipecat / cloud-websocket / Twilio"
        - "pipecat / daily-sip / Twilio"
        - "livekit / sip / Twilio"
        - "livekit / sip / Telnyx"
        - "livekit / sip / Plivo"
        - "livekit / connector / Twilio"
        - Something else, described below

  - type: textarea
    id: version
    attributes:
      label: Output of `unmute --version`
      description: >
        The commit is the part that matters. A package that passes on one unmute
        and fails on another usually differs by a build, not by a release.
      render: text
      placeholder: |
        unmute version <version> (<commit> <date>)
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux
        - Windows
        - Windows (WSL)
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install unmute
      options:
        - Homebrew
        - Scoop
        - "`go install`"
        - Release archive
        - Built from source (`make install`)

  - type: textarea
    id: repro
    attributes:
      label: The smallest package that shows it
      description: >
        The relevant part of your `agent.yaml`, `targets.yaml`, or connection
        file. Remove keys, numbers, and prompts that are not needed to reproduce.
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: The exact command and its full output
      description: >
        Include the whole error, not the last line. For a `unmute dev` problem,
        `build/<target>/dev.log` has the runtime side. For a deployed agent,
        paste the platform logs.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, an audio clip of the call, links to a run in your tracing tool.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the open issues and this is not already filed.
          required: true
        - label: I checked `unmute --version` against the latest release, so this is not a stale binary.
          required: true
        - label: I removed API keys, phone numbers, and customer data from everything I pasted.
          required: true
