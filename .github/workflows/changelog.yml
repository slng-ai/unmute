# GoReleaser publishes with GITHUB_TOKEN, whose release events cannot start
# another workflow. workflow_run fires after Release, even if a later package
# publisher fails. Read published releases only, from the trusted main branch.
name: Changelog

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-changelog
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync published releases into the changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Sync every stable release so a missed or queued run loses no tags.
          # Prereleases do not advance the stable docs version.
          gh api --paginate 'repos/{owner}/{repo}/releases' --jq '
            .[] | select(.draft == false and .prerelease == false)
            | .tag_name | select(test("^v[0-9]+[.][0-9]+[.][0-9]+$"))
          ' > "$RUNNER_TEMP/changelog-tags"
          while IFS= read -r tag; do
            python3 scripts/render_changelog.py "$tag"
          done < "$RUNNER_TEMP/changelog-tags"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Check the rendered docs before publishing
        run: go test ./internal/docsite

      # main only takes pull requests, so the job opens one and a person
      # merges it. The Mintlify GitHub App deploys docs-site/ from that merge.
      - name: Open the changelog pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs-site/changelog.mdx docs-site/snippets/unmute-version.mdx
          if git diff --cached --quiet; then
            echo "The changelog is up to date"
            exit 0
          fi
          # One fixed branch: a release that lands while the last pull request
          # is still open updates that pull request instead of opening another.
          branch=docs/changelog-sync
          git switch -c "$branch"
          # GoReleaser excludes docs: commits from the next release's notes.
          git commit -m "docs: sync the release changelog"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[]')" ]; then
            gh pr create --base main --head "$branch" \
              --title "docs: sync the release changelog" \
              --body "Written by the Changelog workflow from the published releases. Merge it to publish the changelog."
          fi
