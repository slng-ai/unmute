# Runs the two gates the repo already documents as required: `make test`
# (L1-L3, zero Python) and `make lint`. Both are fast and hermetic.
#
# `make smoke` is deliberately absent. It needs Docker, network, and provider
# credentials, it takes several minutes, and CLAUDE.md scopes it as opt-in and
# never part of the PR gate. Run it locally before promoting a driver.
#
# Every job carries `check-latest: true`. go.mod says `go 1.26`, which setup-go
# reads as a spec, not a pin, and without the flag it hands back whatever 1.26.x
# the runner happens to have cached. That was go1.26.5 on 2026-08-15, five CVEs
# behind, and the `vuln` job below only means anything if every job builds the
# same Go it scanned. release.yml carries the flag for the same reason.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Single source of truth: the version the module already declares.
          go-version-file: go.mod
          check-latest: true
          cache: true
      - run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      # Installed from the module proxy rather than via golangci-lint-action, so
      # the version is pinned in one obvious place and CI runs the same `make
      # lint` a developer runs. The v2 line matters: the checked-in
      # .golangci.yml declares `version: "2"` and a v1 binary cannot read it.
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: make lint

  # The release pipeline is config, so it can only rot silently. This job runs
  # the whole thing on every PR without publishing anything: the config must be
  # valid (and not merely deprecated), the 6 platforms must build, and the
  # binaries must still carry their version stamps. See
  # specs/010-goreleaser-release-pipeline/contracts/release-workflow.md.
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe and the changelog both read history.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      # A snapshot writes SBOMs too, so syft has to be here.
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true
      # Exit 1 is invalid config, exit 2 is a deprecated key. Both are failures:
      # we want the day GoReleaser announces a deprecation, not the day it lands.
      - run: goreleaser check
      # Signing is skipped on purpose: a PR should not mint an OIDC token, and
      # the signing path is exercised for real on every tag.
      - run: goreleaser release --snapshot --clean --skip=sign
      - name: assert the artifact set
        run: |
          set -eu
          count() { find dist -maxdepth 1 -name "$1" | wc -l | tr -d ' '; }
          expect() {
            if [ "$2" != "$3" ]; then
              echo "dist/: expected $3 of $1, found $2"
              ls -l dist
              exit 1
            fi
          }
          expect '*.tar.gz' "$(count '*.tar.gz')" 4
          expect '*.zip' "$(count '*.zip')" 2
          expect '*_checksums.txt' "$(count '*_checksums.txt')" 1
          expect '*.sbom.json' "$(count '*.sbom.json')" 6
          # A dropped or renamed main.commit / main.date stamp would quietly fall
          # back to the bare version, so assert the whole shape, not just the tag.
          bin=$(find dist -type f -name unmute -path '*linux_amd64*' | head -1)
          printed=$("$bin" --version)
          echo "$printed"
          echo "$printed" | grep -Eq 'SNAPSHOT.*\([0-9a-f]{7,} .+\)' || {
            echo "--version lost its commit or date stamp"
            exit 1
          }

  # gofmt is not covered by `make fmt` in CI because that target rewrites files.
  # Checking is the CI-safe half of it.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      # The other check that would rewrite files: a dependency added or dropped
      # without tidying leaves go.mod and go.sum describing a module nobody
      # builds. Run it, then require that it changed nothing.
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # Checked-in Python: the tool scripts under examples/ and the golden files the
  # generator is compared against. `ruff check` is the whole gate, on purpose.
  # `ty check` is not here. Every one of its findings today is an unresolved
  # import for pipecat or livekit, which needs the provider SDKs installed, and
  # installing those is `make smoke`'s job. CLAUDE.md keeps smoke off the PR gate.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned in one obvious place and bumped deliberately, like golangci-lint.
      - run: pip install ruff==0.15.14
      # ruff honours .gitignore, so `.` is the tracked Python and nothing else.
      - run: ruff check .

  # Known vulnerabilities, both in what we import and in the standard library we
  # link into every released binary. Same go.mod version as every other job, so
  # what this scans is what ships. That is also why go.mod tracks a supported Go
  # line: on go1.24.13 this scan found 17 reachable stdlib vulnerabilities, all
  # of them unfixable, because 1.24 had fallen outside Go's two-release security
  # window. A red build here means a patched Go exists, so go and get it.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...
