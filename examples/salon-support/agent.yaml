# Sage and Stone Salon support desk: the smallest package that exercises
# variables and secrets and that you can talk to in a browser right away.
#
# Nothing external is needed, and that is the point of starting here. The channel
# is web audio (no phone number), the tools are local Python fixtures (no API to
# stand up), and there is no tracing provider to sign up for. Two model keys is
# the whole list: `OPENAI_API_KEY` and `SLNG_API_KEY`. The tracing examples are
# examples/simple-prompt and examples/salon-concierge.
version: 1
entry_agent: support_desk

variables:
  customer_name:
    type: string
    source: call_start
    default: there
    description: Caller's first name, used in the greeting and the prompt.
  customer_id:
    type: string
    source: call_start
    default: cus_1001
    description: CRM id of the caller. The booking tool receives it directly; never say it out loud.
  requested_service:
    type: string
    source: conversation
    description: The service the caller wants, for example a haircut or a colour. Save it as soon as they say it.

secrets:
  - OPENAI_API_KEY
  - SLNG_API_KEY

models:
  think:
    reasoning:
      provider: openai
      model: gpt-5.6-terra
      params:
        # A reasoning model answering with function tools on chat completions
        # needs this exact value, or OpenAI returns 400 on every turn.
        reasoning_effort: "none"
  speak:
    voice:
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
  listen:
    transcriber:
      provider: slng
      model: "slng/deepgram/nova:3-en"
  turn:
    detector:
      provider: local
      model: silero

agents:
  support_desk:
    instructions: instructions.md
    model: reasoning
    voice: voice
    tools:
      - check_availability
      - book_appointment

tools:
  - check_availability
  - book_appointment

conversation:
  greeting:
    speaks_first: agent
    text: "Hi {{customer_name}}, thanks for calling Sage and Stone Salon. What can I do for you?"
  interruption:
    enabled: true

channels:
  web:
    kind: realtime_audio

capacity:
  peak_sessions: 2
  max_sessions: 4
  avg_session_duration: 3m
