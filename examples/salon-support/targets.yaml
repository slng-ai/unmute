# Both shipped code drivers, web audio only: no carrier, no connection, no
# public URL. `unmute dev --target <name>` runs either one in the browser.
targets:
  pipecat:
    provider: pipecat
    version: "1.5.0"

  livekit:
    provider: livekit
    version: "1.5.2"
    sdk_language: python
    models:
      # LiveKit names its own on-device turn detector; the Pipecat side keeps
      # Silero. Same package, one line per target that needs a different model.
      detector:
        provider: livekit
        model: turn-detector-mini
