# Keep the voice models in Europe while the agent worker is deployed separately.
version: 1
entry_agent: regional_assistant

secrets:
  - OPENAI_API_KEY
  - SLNG_API_KEY

models:
  think:
    reasoning:
      provider: openai
      model: gpt-5.6-terra
      params:
        reasoning_effort: "none"
  speak:
    voice:
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
      params:
        # Pin TTS to one exact SLNG region.
        region_override: eu-north-1
        # This is ignored while region_override is set; exact region wins.
        world_part_override: eu
  listen:
    transcriber:
      provider: slng
      model: "slng/deepgram/nova:3-multi"
      params:
        # Let SLNG choose an available STT region inside Europe.
        world_part_override: eu
  turn:
    detector:
      provider: local
      model: silero

agents:
  regional_assistant:
    instructions: instructions.md
    model: reasoning
    voice: voice

conversation:
  greeting:
    speaks_first: agent
    text: "Hello. How can I help?"

channels:
  web:
    kind: realtime_audio

capacity:
  peak_sessions: 1
  max_sessions: 2
  avg_session_duration: 5m
