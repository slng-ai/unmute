# One agent owns every appointment workflow and tool.
version: 1
language: en
entry_agent: appointment_desk

models:
  think:
    reasoning:
      provider: openai
      model: gpt-4o-mini
      temperature: 0.2
  speak:
    voice:
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
  listen:
    transcriber:
      provider: slng
      model: "slng/deepgram/nova:3-en"
  turn:
    detector:
      provider: local
      model: silero

agents:
  appointment_desk:
    instructions: instructions.md
    model: reasoning
    voice: voice
    tools:
      - lookup_customer
      - create_customer
      - check_availability
      - book_appointment
      - cancel_appointment

tools:
  - lookup_customer
  - create_customer
  - check_availability
  - book_appointment
  - cancel_appointment

conversation:
  greeting:
    speaks_first: agent
    text: "Hi, this is Sage and Stone Salon. How can I help with your appointment?"
  interruption: { enabled: true }

tracing:
  provider: langfuse

channels:
  web: { kind: realtime_audio }

capacity:
  peak_sessions: 5
  max_sessions: 10
  avg_session_duration: 5m
