# One agent owns every appointment workflow and tool.
version: 1
entry_agent: appointment_desk

secrets:
  - OPENAI_API_KEY
  - SLNG_API_KEY
  - LANGFUSE_BASE_URL
  - LANGFUSE_PUBLIC_KEY
  - LANGFUSE_SECRET_KEY

models:
  think:
    reasoning:
      provider: openai
      model: gpt-5.6-luna
      params:
        # A reasoning model answering with function tools on chat completions
        # needs this exact value, or OpenAI returns 400 on every turn.
        reasoning_effort: "none"
  speak:
    voice:
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
  listen:
    transcriber:
      provider: slng
      model: "slng/deepgram/nova:3-en"
  turn:
    detector:
      provider: local
      model: silero

agents:
  appointment_desk:
    instructions: instructions.md
    model: reasoning
    voice: voice
    tools:
      - lookup_customer
      - create_customer
      - check_availability
      - book_appointment
      - cancel_appointment

tools:
  - lookup_customer
  - create_customer
  - check_availability
  - book_appointment
  - cancel_appointment

conversation:
  greeting:
    speaks_first: agent
    text: "Hi, this is Sage and Stone Salon. How can I help with your appointment?"
  interruption:
    enabled: true

tracing:
  provider: langfuse

channels:
  web:
    kind: realtime_audio

capacity:
  peak_sessions: 5
  max_sessions: 10
  avg_session_duration: 5m
