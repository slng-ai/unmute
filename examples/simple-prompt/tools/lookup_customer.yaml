description: Look up a Sage and Stone customer by phone number.

input:
  type: object
  properties:
    phone: { type: string, description: Customer phone number }
  required: [phone]

output:
  type: object
  properties:
    found: { type: boolean }
    customer_id: { type: string }
    name: { type: string }
  required: [found, customer_id, name]

execution: local
handler: tools/lookup_customer.py
interruption: provider_default
effect: returns_data
