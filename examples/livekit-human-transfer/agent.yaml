# Sage and Stone Salon's phone line, with two ways to reach a person.
#
# A human transfer names its shape with a block, never a `mode:` field
# (SCHEMA.md N25). Exactly one of `cold:` or `warm:` is required, and the block
# carries every parameter of the transfer (N27), so a warm-only field like
# `briefing` cannot be written on a cold transfer.
version: 1
entry_agent: front_desk

# Every environment variable this package needs you to set, in one list: model
# keys, the trunk credentials connections/twilio_sip.yaml names, and the two
# numbers a transfer dials. It does not list names the runtime supplies —
# LIVEKIT_URL and its key pair come from the Compose graph or your LiveKit Cloud
# project, not from this package.
secrets:
  - OPENAI_API_KEY
  - SLNG_API_KEY
  - SIP_TRUNK_HOSTNAME
  - SIP_AUTH_USERNAME
  - SIP_AUTH_PASSWORD
  - SIP_FROM_NUMBER
  - BILLING_PHONE_NUMBER
  - SUPERVISOR_PHONE_NUMBER

models:
  think:
    reasoning:
      provider: openai
      model: gpt-4o-mini
      temperature: 0.3
  speak:
    voice:
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
  listen:
    transcriber:
      provider: slng
      model: "slng/deepgram/nova:3-en"
  turn:
    detector:
      provider: local
      model: silero

agents:
  front_desk:
    instructions: instructions.md
    model: reasoning
    voice: voice
    tools:
      - send_to_billing
      - escalate_to_supervisor

controls:
  # Cold: one call to the carrier. The caller's leg is rerouted, the agent
  # drops off, and billing answers knowing nothing about the call.
  send_to_billing:
    kind: human_transfer
    when: The caller asks about an invoice, a refund, or a charge they do not recognise.
    cold:
      destination: billing_line

  # Warm: the caller waits on hold music while the agent rings the supervisor,
  # tells them what the call is about, and only then connects the two.
  escalate_to_supervisor:
    kind: human_transfer
    when: The caller is unhappy with how something was handled and asks for a manager.
    warm:
      destination: supervisor_line
      # Free text, not a mode. The call transcript is passed along on its own,
      # so write what the supervisor needs on top of it.
      briefing: |
        Lead with the caller's name and which stylist they saw.
        Say what they are unhappy about and what you already offered them.
        Ask whether they can take the call now.
      ring_timeout: 25s
      # If nobody picks up, declines, or the line goes to voicemail, the agent
      # comes back to the caller instead of dropping them.
      on_unavailable: return_to_caller

# Who this agent escalates to, resolved here so the model never sees a phone
# number and can never dial an arbitrary one. A value is the UPPER_SNAKE name of
# an environment variable holding the number, read at call time: agent.yaml is
# the portable half of a package, so a literal number does not belong in it.
# The names land in the generated .env.example and the required-env list.
destinations:
  billing_line: BILLING_PHONE_NUMBER
  supervisor_line: SUPERVISOR_PHONE_NUMBER

conversation:
  greeting:
    speaks_first: agent
    text: "Sage and Stone Salon, this is the front desk. How can I help?"
  interruption:
    enabled: true

channels:
  phone:
    kind: telephony
    inbound: true
    # A warm transfer dials the supervisor, so this agent places calls either
    # way. Declaring it also gives `unmute dev --telephony --to <your number>`,
    # which is how you test a transfer when you cannot receive the inbound call.
    outbound: true

capacity:
  peak_sessions: 4
  max_sessions: 8
  peak_starts_per_second: 1
  avg_session_duration: 3m
