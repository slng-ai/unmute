# Twilio Elastic SIP Trunking, the account side of the LiveKit SIP route.
# Values are environment variable names, never secrets.
#
# The names are plain SIP names rather than Twilio ones, because these four are
# standard SIP trunk settings and the same emitted code dials through any SIP
# carrier with them (SCHEMA N33). They are yours to choose: the compiler carries
# whatever you write here through verbatim, so a package that already uses
# TWILIO_SIP_ADDRESS and friends keeps working with no edit.
#
# All four reach the deployed agent directly. It dials out by passing them inline
# with the call, so no LiveKit outbound trunk has to be registered first.
#
# Cold transfer is a SIP REFER, so the trunk must allow transfers: in the Twilio
# console, Elastic SIP Trunking > Manage > Trunks > your trunk > Call Transfer
# (SIP REFER) = Enabled, and Enable PSTN Transfer ticked.
transport: sip
carrier: twilio
environment:
  sip_address: SIP_TRUNK_HOSTNAME
  sip_username: SIP_AUTH_USERNAME
  sip_password: SIP_AUTH_PASSWORD
  from_number: SIP_FROM_NUMBER
