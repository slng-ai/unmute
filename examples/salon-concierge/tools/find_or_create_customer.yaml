description: >-
  Look up or create the salon customer for the caller's phone number. Call it as
  soon as you have the whole number, the saved one or the one the caller just
  said. It first asks the caller to confirm the number, so never ask that
  yourself. Call it again with the same number after their yes, and it runs.
  A number that cannot be right comes back refused, saying what to ask the
  caller next.

local:
  handler: tools/salon.py:find_or_create_customer
