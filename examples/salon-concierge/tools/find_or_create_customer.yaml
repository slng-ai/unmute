description: >-
  Look up or create one salon customer from the exact confirmed phone number.
  Use only after the digit readback got a clear yes. Reuse the record that
  already owns the number, or create one for a number that is new. Never guess
  a number or pass one the caller has not confirmed.
  A caller giving a replacement number is not confirmation. Ask the readback
  question first; call this tool only after a later caller message agrees to it.

local:
  handler: tools/salon.py:find_or_create_customer

# No `announce:` here, and it used to be. It covered the middle of a booking:
# this tool is called right after the caller's yes, and it is the first of three
# model requests that run with nothing spoken between them, measured at 4.0
# seconds on Pipecat (trace 617a2377) and 2.0 on LiveKit (trace 50d99406).
#
# It moved to `verify_customer`'s own `announce:`, which is spoken as the step is
# entered rather than in the middle of it. That is earlier and it is honest on
# both routes in, and it leaves this tool free: a line here would now land about
# a second after `find_slots` speaks its own, in the next model turn, which is
# the collision that took the first announcement out of this package.
interruption: provider_default
effect: returns_data
