description: >-
  Cancel one confirmed booking owned by the verified customer. Use an exact
  booking ID returned by list_bookings.

input:
  type: object
  properties:
    booking_id:
      type: string
      description: Exact booking ID returned by list_bookings
    confirmed:
      type: boolean
      description: True only after the caller agrees to this exact booking change
  required:
    - booking_id
    - confirmed

inject:
  - customer_phone: "{{customer_phone}}"

output:
  type: object
  properties:
    booking_id:
      type: string
    status:
      type: string
      enum:
        - cancelled
        - not_confirmed
        - not_found
        - already_cancelled
    appointment:
      type: object
      description: >-
        The saved booking, present and complete on success and absent otherwise.
        The step saves this without asking the model for it.
      properties:
        booking_id:
          type: string
        service:
          type: string
          enum:
            - haircut
            - hair-color
            - blowout
        date:
          type: string
        time:
          type: string
        action:
          type: string
          enum:
            - cancel
    summary:
      type: string
  required:
    - booking_id
    - status
    - summary

local:
  handler: tools/salon.py

interruption: provider_default
effect: returns_data
