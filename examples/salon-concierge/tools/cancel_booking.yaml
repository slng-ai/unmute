description: >-
  Cancel one confirmed booking owned by the verified customer. Use an exact
  booking ID returned by list_bookings.

input:
  type: object
  properties:
    booking_id:
      type: string
      description: Exact booking ID returned by list_bookings
    confirmed:
      type: boolean
      description: True only after the caller agrees to this exact booking change
  required:
    - booking_id
    - confirmed

inject:
  - customer_phone: "{{customer_phone}}"

output:
  type: object
  properties:
    booking_id:
      type: string
    status:
      type: string
      enum:
        - cancelled
        - not_confirmed
        - not_found
        - already_cancelled
    summary:
      type: string
  required:
    - booking_id
    - status
    - summary

local:
  handler: tools/salon.py

interruption: provider_default
effect: returns_data
