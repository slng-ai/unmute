targets:
  livekit:
    provider: livekit
    version: "1.6.10"
    sdk_language: python
    connection: twilio_sip
    deployment_region: eu-central
    models:
      reasoning:
        provider: openai
        model: gpt-5.6-terra
        params:
          api: responses
          reasoning_effort: low
          use_websocket: false
      detector:
        provider: livekit
        model: turn-detector-mini

  pipecat:
    provider: pipecat
    version: "1.7.0"
    connection: twilio_voice
    deployment_region: eu-central
