targets:
  livekit:
    provider: livekit
    version: "1.6.10"
    sdk_language: python
    connection: twilio_sip
    deployment_region: eu-central
    models:
      reasoning:
        provider: openai
        model: gpt-5.6-terra
        params:
          api: responses
          reasoning_effort: none
          use_websocket: true
          # Fast mode. OpenAI accepts auto, default, flex, fast and priority,
          # and fast or priority opt into it. It buys a tighter tail rather
          # than a faster median: over every inference in a call, ttft median
          # moved 0.810s to 0.780s while p90 moved 1.480s to 0.940s. That is
          # the shape a caller notices, because the slow turn is the one they
          # remember. Priority bills at a higher rate, so this is a deliberate
          # trade and not a free win. Measured 2026-08-21.
          service_tier: priority
      detector:
        provider: livekit
        model: turn-detector-mini

  pipecat:
    provider: pipecat
    version: "1.7.0"
    connection: twilio_voice
    deployment_region: eu-central

  # The same agent on the trunk instead of the media stream: no managed platform
  # anywhere in it, so the four containers a local run starts are the four you
  # run in production. Receives calls only, which is what this line does.
  pipecat_sip:
    provider: pipecat
    version: "1.7.0"
    connection: twilio_sip
