targets:
  livekit:
    provider: livekit
    version: "1.6.10"
    sdk_language: python
    connection: twilio_sip
    deployment_region: eu-central
    models:
      # No reasoning override here on purpose. A target's models block replaces
      # the base one rather than merging into it, so an override would route
      # this target straight past the Context Router with nothing to warn you.
      # The router speaks Chat Completions, which also rules out the Responses
      # API and its held websocket that this target used before.
      detector:
        provider: livekit
        model: turn-detector-mini

  pipecat:
    provider: pipecat
    version: "1.7.0"
    connection: twilio_voice
    deployment_region: eu-central

  # The same agent on the trunk instead of the media stream: no managed platform
  # anywhere in it, so the four containers a local run starts are the four you
  # run in production. Receives calls only, which is what this line does.
  pipecat_sip:
    provider: pipecat
    version: "1.7.0"
    connection: twilio_sip
