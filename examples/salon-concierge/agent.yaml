version: 1

name: salon-concierge

entry_agent: concierge

agents:
  concierge:
    instructions: instructions.md
    think: reasoning
    speak: voice
    tools:
      - look_up_salon_info
      - end_call
    tasks:
      - name: verify_customer
        when: >-
          Run this when the caller explicitly corrects their phone number, and
          when a complaint is about to be written down. Never before a booking:
          the `book` flow runs this step itself when the saved number is not
          confirmed. A change of date, time or service is not a phone
          correction.
        instructions: tasks/verify-customer.md
        # Spoken as the step is entered, so it covers the lookup's latency. Short
        # and about the caller, not about the process: "let me verify you first"
        # is a system describing itself.
        #
        # None of these may promise the lookup. The step has to read the number
        # back and get a yes *before* it calls the tool, and a line saying "I'll
        # look you up" is the model's own last sentence when it decides what to
        # do next: on a text run that wording it went straight to the lookup and
        # skipped the readback. These name the check instead, which is also what
        # the next sentence out of the step actually is.
        announce:
          - Let me confirm who I'm speaking to.
          - One second, let me check who I've got.
          - Right, let me make sure I have you.
        tools:
          - find_or_create_customer
        finish:
          - tool: find_or_create_customer
            success:
              - customer_status:
                  - existing
                  - created
        assign:
          - customer_phone: result.customer_phone
          - customer_verified: result.customer_status
        context:
          history: messages

      # No `when:` here on purpose, which makes this a definition and not
      # something the concierge can choose. The only way in is the `book` flow
      # below, so a booking cannot start without verification having been
      # decided first.
      - name: manage_booking
        instructions: tasks/booking.md
        # "Double check" implied a check that had already happened, on the first
        # look of the call. These say the same thing in fewer words and none of
        # them claims a second look.
        announce:
          - Let me have a look at the diary.
          - One second, I'll check the diary.
          - Right, let me see what's free.
        tools:
          - find_slots
          - save_booking
        handoffs:
          - to_complaints
        finish:
          - tool: save_booking
            success:
              - status:
                  - booked
                  - moved
                  - cancelled
        assign:
          - appointment: result.appointment
        context:
          history: messages
    task_groups:
      - book
    handoffs:
      - to_complaints
    escalations:
      - to_manager

  complaint_specialist:
    instructions: agents/complaint-specialist.md
    think: reasoning
    speak: voice
    tools:
      - record_complaint
      - look_up_refund_policy
      - end_call
    # A bare name: the definition stays on the concierge, one name across the
    # package. Customer care needs it in reach because `record_complaint`
    # injects `customer_phone` and is refused while the caller has not agreed to
    # it, and a caller who opens with a complaint has never been near booking.
    tasks:
      - verify_customer
    handoffs:
      - to_concierge
    escalations:
      - to_manager

handoffs:
  to_complaints:
    to: complaint_specialist
    when: The caller has a complaint or service problem.
    context:
      history: messages

  to_concierge:
    to: concierge
    when: The caller changes to a request owned by another specialist.
    context:
      history: messages

escalations:
  to_manager:
    when: The caller explicitly asks for a manager or is clearly and strongly frustrated.
    cold:
      destination: manager_line
      ring_timeout: 30s
      on_unavailable: hangup

# One booking request, start to finish, and no model request in the middle of
# it deciding what comes next. The concierge picks this once; the flow runs
# verification and then booking itself.
#
# No `announce:` on the group. Its line would fire on every entry and no
# sentence is true on both halves: the flow opens on the verification question
# the first time and on the diary every time after. Each step carries its own
# list instead, and a skipped step speaks nothing.
task_groups:
  book:
    when: >-
      The caller wants to create, move or cancel a booking. Includes a change to
      an appointment just made.
    steps:
      # Skipped once the caller has agreed to their number, which is every
      # booking after the first on a call. Decided as the flow starts, so a
      # confirmation withdrawn mid-flow is the next invocation's question.
      - task: verify_customer
        skip_when_confirmed: customer_phone
      - manage_booking
    context_scope: shared
    then: return

shapes:
  - name: Appointment
    description: The latest booking successfully created, moved, or cancelled.
    fields:
      - booking_id: Id
      - service: Literal["haircut", "hair-color", "blowout"]
      - date: Date
      - spoken: string
      - time: Time
      - action: Literal["book", "move", "cancel"]

variables:
  appointment:
    type: Appointment
    description: The latest successful booking action, saved only after the tool succeeds.

  booking_date:
    type: Date
    default: ""
    description: >-
      Today's date in the salon's own timezone, YYYY-MM-DD. Read once from the
      clock before the greeting, so a caller saying "tomorrow" costs one model
      request instead of two chained tool calls. A call that crosses midnight
      keeps the day it started on, which is deliberate: a date changing
      underneath a conversation would leave the caller and the agent disagreeing
      about what "tomorrow" means halfway through.

  booking_weekday:
    type: string
    default: ""
    description: >-
      The weekday today falls on, spelled out in English: Monday to Sunday. From
      the same clock reading as `booking_date`, so the two cannot disagree about
      which day it is. It is what lets the agent answer "next Friday" without a
      second turn working out what day today is first.

  salon_local_time:
    type: Time
    default: ""
    description: >-
      The salon's own wall clock when the call began, HH:MM on a 24 hour clock.
      From the same reading as the two above. It is what lets the agent know that
      a caller asking for "this afternoon" at 17:40 is asking for something that
      has nearly passed, rather than offering them a slot that is already gone.

  customer_phone:
    type: Phone
    default: ""
    confirm: verify_customer
    description: >-
      The caller's phone number in E.164: a plus sign, then digits, with no
      spaces, brackets or dashes. One shape for every phone number in this
      package, the MANAGER_PHONE_NUMBER transfer destination included, so no
      prompt and no tool has to guess which shape it is holding.

      No `source:` here on purpose. The prefetch block below reads the carrier's
      fact and this variable receives it, which leaves the per-route refusal for
      a variable naming a source its target cannot supply exactly as strict as it
      is: on a route with no caller ID the entry skips and this holds its default.

      Offered to the caller for a yes, never acted on unasked. Somebody may be
      ringing from a friend's phone, or may hold a second account, so until the
      verification step has heard them agree this value stays unconfirmed and
      appears in no prompt but that step's own.

  customer_verified:
    type: string
    default: ""
    description: >-
      Whether verification has already run on this call, and what it found. Set
      by the verification step as it ends, which only happens on a number the
      caller agreed to, so a value here means the number beside it is confirmed.

      It exists for customer care, which has to decide whether to identify the
      caller before writing a complaint down and cannot read `customer_phone` to
      find out: an unconfirmed number renders in no prompt but the verification
      step's own, and a confirmed one must not be in front of an agent that
      might say it out loud. This carries the same fact with nothing sensitive
      in it.

      The concierge does not read it. The `book` flow decides the same thing
      structurally with `skip_when_confirmed:`, off the confirmation itself
      rather than off a copy of it.

      Empty means nobody has been verified yet on this call.

prefetch:
  - name: today
    clock: now
    timezone: Europe/Madrid
    assign:
      - booking_date: result.date
      - booking_weekday: result.day_of_week
      - salon_local_time: result.time

  - name: caller
    source: from_number
    assign:
      - customer_phone: result.value

secrets:
  - OPENAI_API_KEY
  - GOOGLE_API_KEY
  - SLNG_API_KEY
  - LANGFUSE_SECRET_KEY
  - LANGFUSE_PUBLIC_KEY
  - LANGFUSE_BASE_URL
  - MANAGER_PHONE_NUMBER
  - TWILIO_ACCOUNT_SID
  - TWILIO_AUTH_TOKEN
  - TWILIO_PHONE_NUMBER
  - SIP_TRUNK_HOSTNAME
  - SIP_AUTH_USERNAME
  - SIP_AUTH_PASSWORD
  - SIP_FROM_NUMBER

destinations:
  manager_line: MANAGER_PHONE_NUMBER

knowledge:
  refunds:
    documents: knowledge/refunds
  services:
    documents: knowledge/services
    chunk_size: 220
    chunk_overlap: 40

models:
  think:
    # The other qualified binding. Swap the two blocks to go back; the README
    # says what each one was measured on.
    # reasoning:
    #   provider: openai
    #   model: gpt-5.6-luna
    #   params:
    #     reasoning_effort: "none"
    reasoning:
      provider: google
      model: gemini-3.1-flash-lite
      params:
        vertexai: true
        location: eu
        thinking_config:
          thinking_level: MINIMAL
  speak:
    voice:
      provider: slng
      model: "cartesia/sonic:3.5"
      voice: "62ae83ad-4f6a-430b-af41-a9bede9286ca"
      language: en
      params:
        world_part: eu-north
        warm_standby_enabled: true
  listen:
    transcriber:
      provider: slng
      model: "soniox/speech-ai:rt-v5"
      language: en
      params:
        world_part: eu-north
  turn:
    detector:
      provider: local
      model: silero
      pace: balanced

tools:
  - find_or_create_customer
  - find_slots
  - save_booking
  - record_complaint
  - look_up_refund_policy
  - look_up_salon_info
  - end_call

conversation:
  greeting:
    speaks_first: agent
    text: "Hi, you've reached Sage and Stone. Robin speaking, what can I do for you?"
  interruption:
    enabled: true
  inactivity:
    nudge_after: 15s
    end_after: 45s
  max_duration: 15m

tracing:
  provider: langfuse

channels:
  web:
    kind: realtime_audio
  phone:
    kind: telephony
    inbound: true
    outbound: false

capacity:
  peak_sessions: 5
  max_sessions: 10
  peak_starts_per_second: 1
  avg_session_duration: 5m
