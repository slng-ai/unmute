version: 1

name: salon-concierge

entry_agent: concierge

# The zone every clock reading in this package is taken in. Required before a
# prefetch entry can read the clock, and required rather than defaulted because
# the wrong answer is silent: a container clock is UTC, so a salon in Spain taking
# a booking for "tomorrow" at 23:30 local would confidently name the wrong day.
timezone: Europe/Madrid

agents:
  concierge:
    instructions: instructions.md
    model: reasoning
    voice: voice
    tools:
      - look_up_salon_info
    delegates:
      - verify_customer
      - manage_booking
    handoffs:
      - to_complaints
    escalations:
      - to_manager

  complaint_specialist:
    instructions: agents/complaint-specialist.md
    model: reasoning
    voice: voice
    tools:
      - look_up_refund_policy
      - record_complaint
    delegates:
      - verify_customer
    handoffs:
      - to_concierge
    escalations:
      - to_manager

delegates:
  verify_customer:
    task: customer_verification
    when: >-
      Confirm who the caller is before any specialist handoff. The task reads
      the phone number back and needs a yes before it looks anyone up.
    assign:
      customer_phone: result.customer_phone

  manage_booking:
    task: booking
    when: The caller wants to create, modify, or cancel a booking.
    # Two model requests pass between the caller finishing and this step's first
    # word, and they were silence. Spoken after the prerequisite guard, so a step
    # refused for an unconfirmed number stays quiet: hearing "let me pull up the
    # diary" and then being asked to confirm a number is worse than hearing
    # nothing. See README.md on the two-cover-lines case.
    announce: Let me pull up the diary.
    requires:
      - customer_phone

handoffs:
  to_complaints:
    to: complaint_specialist
    when: The verified caller has a complaint or service problem.
    # Deliberately not gated on identifying the caller, even though the `when:`
    # says "verified": somebody with a complaint must be able to make it, and a
    # guard here would leave an angry caller stuck at an identity question. The
    # specialist's record_complaint tool injects the number and is refused to the
    # model while that number is unconfirmed, which is where the protection lives.
    context:
      history: full
      variables: all

  to_concierge:
    to: concierge
    when: The caller changes to a request owned by another specialist.
    context:
      history: full
      variables: all

escalations:
  to_manager:
    when: The caller explicitly asks for a manager or is clearly and strongly frustrated.
    cold:
      destination: manager_line
      ring_timeout: 30s
      on_unavailable: hangup

tasks:
  customer_verification:
    instructions: tasks/verify-customer.md
    tools:
      - find_or_create_customer
    result:
      customer_phone: string
      status:
        enum:
          - existing
          - created
          - invalid
      summary: string
    context:
      history: full

  booking:
    instructions: tasks/booking.md
    tools:
      - list_bookings
      # get_current_date used to sit here. Reading the clock is not a
      # conversation, and asking a model to call a tool for it cost two chained
      # requests and 2.56 seconds of silence on every relative day. The prefetch
      # block below reads it once, before the greeting, into {{booking_date}}.
      - check_availability
      - create_booking
      - modify_booking
      - cancel_booking
    handoffs:
      - to_complaints
    result:
      action:
        enum:
          - create
          - modify
          - cancel
          - none
      booking_id: string
      status: string
      summary: string
    context:
      history: full

variables:
  booking_date:
    type: string
    default: ""
    description: >-
      Today's date in the salon's own timezone, YYYY-MM-DD. Read once from the
      clock before the greeting, so a caller saying "tomorrow" costs one model
      request instead of two chained tool calls. A call that crosses midnight
      keeps the day it started on, which is deliberate: a date changing
      underneath a conversation would leave the caller and the agent disagreeing
      about what "tomorrow" means halfway through.

  customer_phone:
    type: string
    default: ""
    # The step that has to hear the caller agree before anything acts on this.
    # Names the task, not the delegate that runs it: the task is what has a
    # prompt, and its prompt is the one place this value may render.
    confirm: customer_verification
    description: >-
      The caller's phone number in E.164: a plus sign, then digits, with no
      spaces, brackets or dashes. One shape for every phone number in this
      package, the MANAGER_PHONE_NUMBER transfer destination included, so no
      prompt and no tool has to guess which shape it is holding.

      No `source:` here on purpose. The prefetch block below reads the carrier's
      fact and this variable receives it, which leaves the per-route refusal for
      a variable naming a source its target cannot supply exactly as strict as it
      is: on a route with no caller ID the entry skips and this holds its default.

      Offered to the caller for a yes, never acted on unasked. Somebody may be
      ringing from a friend's phone, or may hold a second account, so until the
      verification step has heard them agree this value satisfies no `requires:`
      guard and appears in no prompt but that step's own.

      An earlier version of this note said no prompt ever reads the number back.
      That is now false rather than merely out of date: reading it back is the
      whole saving, and it replaced twelve spoken digits with one yes. The
      read-back turn does not cache, and that trade was made deliberately.

  customer_name:
    type: string
    default: ""
    description: >-
      The name on the record the caller's number belongs to, looked up before the
      greeting. Inherits `customer_phone`'s confirming step, because a name found
      from a number nobody has agreed to is exactly as unconfirmed as that number
      was: greeting a stranger by the account holder's name is the worst thing
      this feature could do, and the compiler refuses the prompt that would.

# Facts knowable before the greeting, resolved once per call so the model never
# spends a turn discovering them.
#
# An ordered list, and the order matters: "caller" has to sit above "profile",
# which reads what it assigns. Written the other way round it is refused, naming
# both entries, rather than quietly reordered.
prefetch:
  - name: today
    clock: date
    assign:
      - booking_date: result.date

  - name: caller
    source: from_number
    assign:
      - customer_phone: result.value

  - name: profile
    tool: look_up_customer
    args:
      - phone: "{{customer_phone}}"
    assign:
      - customer_name: result.name

secrets:
  - OPENAI_API_KEY
  - SLNG_API_KEY
  - LANGFUSE_SECRET_KEY
  - LANGFUSE_PUBLIC_KEY
  - LANGFUSE_BASE_URL
  - MANAGER_PHONE_NUMBER
  - TWILIO_ACCOUNT_SID
  - TWILIO_AUTH_TOKEN
  - TWILIO_PHONE_NUMBER
  - SIP_TRUNK_HOSTNAME
  - SIP_AUTH_USERNAME
  - SIP_AUTH_PASSWORD
  - SIP_FROM_NUMBER

destinations:
  manager_line: MANAGER_PHONE_NUMBER

knowledge:
  refunds:
    documents: knowledge/refunds
  services:
    documents: knowledge/services
    chunk_size: 220
    chunk_overlap: 40

models:
  think:
    reasoning:
      provider: slng
      model: gpt-5.6-luna
      agent_id: optimized-salon-concierge-v12
      upstream:
        provider: openai
      params:
        world_part_override: eu
        reasoning_effort: "none"
  speak:
    voice:
      provider: slng
      model: "cartesia/sonic:3.5"
      voice: "62ae83ad-4f6a-430b-af41-a9bede9286ca"
      language: en
      params:
        world_part_override: eu
        warm_standby_enabled: true
  listen:
    transcriber:
      provider: slng
      model: "soniox/speech-ai:rt-v5"
      language: en
      params:
        world_part_override: eu
  turn:
    detector:
      provider: local
      model: silero
      pace: balanced
      endpointing_delay: 400ms

tools:
  - find_or_create_customer
  # Reads and writes nothing, which is what lets a prefetch run it unasked on
  # every call. find_or_create_customer stays where it is for the confirmed
  # mid-call path: pre-fetching that one would create a customer record for every
  # wrong number that ever rang.
  - look_up_customer
  - look_up_refund_policy
  - look_up_salon_info
  - list_bookings
  - check_availability
  - create_booking
  - modify_booking
  - cancel_booking
  - record_complaint

conversation:
  greeting:
    speaks_first: agent
    text: "Hi, you've reached Sage and Stone. Robin speaking, what can I do for you?"
  interruption:
    enabled: true
  inactivity:
    nudge_after: 15s
    end_after: 45s
  max_duration: 15m

tracing:
  provider: langfuse

channels:
  web:
    kind: realtime_audio
  phone:
    kind: telephony
    inbound: true
    outbound: false

capacity:
  peak_sessions: 5
  max_sessions: 10
  peak_starts_per_second: 1
  avg_session_duration: 5m
