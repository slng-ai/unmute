version: 1
entry_agent: concierge

variables:
  customer_phone:
    type: string
    description: >-
      The caller's confirmed phone number, as the verification task returns it:
      digit groups separated by single spaces, with no plus sign, brackets or
      dashes. That exact shape is load-bearing rather than cosmetic. The Context
      Router only puts the placeholder back where the answer holds the value
      character for character, so a number the agent reformats while speaking it
      leaves real digits in the stored copy, the personal-data scan refuses to
      share it, and the turn stops caching with no error to notice.

secrets:
  # The reasoning model and the knowledge bases' embeddings both read this.
  - OPENAI_API_KEY
  - SLNG_API_KEY
  - COVAL_API_KEY
  - MANAGER_PHONE_NUMBER
  - TWILIO_ACCOUNT_SID
  - TWILIO_AUTH_TOKEN
  - TWILIO_PHONE_NUMBER
  - SIP_TRUNK_HOSTNAME
  - SIP_AUTH_USERNAME
  - SIP_AUTH_PASSWORD
  - SIP_FROM_NUMBER

destinations:
  manager_line: MANAGER_PHONE_NUMBER

# Two folders of documents the agents can search, so an answer about a price or a
# refund comes from the salon's own paperwork instead of from what the model
# happens to remember. Each folder is read, split and embedded once when the agent
# starts, and held in memory, so content is fixed until the next compile.
#
# They are separate on purpose. An agent gets a knowledge base by being given its
# tool, so the concierge can quote prices and cannot quote refund policy, and the
# complaint specialist is the other way round.
knowledge:
  refunds:
    documents: knowledge/refunds
  services:
    documents: knowledge/services
    # A price list, not prose. At the default 90 tokens the list splits mid-run,
    # so "how much is a cut and finish" ranked an opening-hours passage above the
    # price: the price line ended up as the tail of a chunk about something else.
    # A wider window keeps each service with its own price and duration.
    chunk_size: 220
    chunk_overlap: 40

models:
  think:
    reasoning:
      provider: slng
      model: gpt-5.6-luna
      # Back at -v8 on purpose. The instruction files never changed, so this
      # package's prompts are byte-identical to what -v8's cache was written
      # against, and it comes back warm. Do not reuse -v9: it holds
      # qwen/qwen3-32b's answers from a trial that was reverted, and one of them
      # was a booking confirmation for a booking that never happened.
      agent_id: optimized-salon-concierge-v8
      upstream:
        provider: openai
      params:
        world_part_override: eu
        # Not optional once the agent has tools: the GPT-5 family rejects
        # function tools on chat completions without it.
        reasoning_effort: "none"
  speak:
    voice:
      provider: slng
      model: "deepgram/aura:2"
      voice: "aura-2-thalia-en"
      language: en
      params:
        world_part_override: eu
        warm_standby_enabled: true
  listen:
    transcriber:
      provider: slng
      model: "deepgram/nova:3"
      language: en
      params:
        world_part_override: eu
  turn:
    detector:
      provider: local
      model: silero
      endpointing_delay: 400ms

agents:
  concierge:
    instructions: instructions.md
    model: reasoning
    voice: voice
    tools:
      - verify_customer
      - look_up_salon_info
      - manage_booking
      - to_complaints
      - to_manager

  complaint_specialist:
    instructions: agents/complaint-specialist.md
    model: reasoning
    voice: voice
    tools:
      - verify_customer
      - record_complaint
      - look_up_refund_policy
      - to_manager
      - to_concierge

tasks:
  customer_verification:
    instructions: tasks/verify-customer.md
    tools:
      - find_or_create_customer
    result:
      customer_phone: string
      status:
        enum:
          - existing
          - created
          - invalid
      summary: string
    context:
      history: full

  booking:
    instructions: tasks/booking.md
    tools:
      - list_bookings
      - get_current_date
      - check_availability
      - create_booking
      - modify_booking
      - cancel_booking
      - to_complaints
    result:
      action:
        enum:
          - create
          - modify
          - cancel
          - none
      booking_id: string
      status: string
      summary: string
    context:
      history: full

controls:
  verify_customer:
    kind: delegate
    task: customer_verification
    when: >-
      Confirm who the caller is before any specialist handoff. The task reads
      the phone number back and needs a yes before it looks anyone up.
    assign:
      customer_phone: result.customer_phone

  manage_booking:
    kind: delegate
    task: booking
    when: The caller wants to create, modify, or cancel a booking.
    # The guard the shape used to need a whole extra agent for. The step is held
    # back until the caller is identified, the model is told which control
    # supplies the number, and the caller hears none of it.
    requires:
      - customer_phone

  to_complaints:
    kind: agent_transfer
    to: complaint_specialist
    when: The verified caller has a complaint or service problem.
    context:
      history: full
      variables: all

  to_concierge:
    kind: agent_transfer
    to: concierge
    when: The caller changes to a request owned by another specialist.
    context:
      history: full
      variables: all

  to_manager:
    kind: human_transfer
    when: The caller explicitly asks for a manager or is clearly and strongly frustrated.
    cold:
      destination: manager_line
      ring_timeout: 30s
      on_unavailable: hangup

tools:
  - find_or_create_customer
  - look_up_refund_policy
  - look_up_salon_info
  - list_bookings
  - get_current_date
  - check_availability
  - create_booking
  - modify_booking
  - cancel_booking
  - record_complaint

conversation:
  greeting:
    speaks_first: agent
    text: "Hi, you’ve reached Sage and Stone Salon. How can I help today?"
  interruption:
    enabled: true
  inactivity:
    nudge_after: 15s
    end_after: 45s
  max_duration: 15m

tracing:
  provider: coval

channels:
  web:
    kind: realtime_audio
  phone:
    kind: telephony
    inbound: true
    outbound: false

capacity:
  peak_sessions: 5
  max_sessions: 10
  peak_starts_per_second: 1
  avg_session_duration: 5m
