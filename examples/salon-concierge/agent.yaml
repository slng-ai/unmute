# One full salon project: verification task, booking task, specialist handoffs,
# cold manager transfer, local in-memory tools, browser audio, and inbound-only
# phone routes on both code targets.
#
# Tuned for turn latency: one LLM round trip per control hop is the dominant
# cost in a voice turn, so verification asks for a phone number only and the
# booking flow is one task rather than three. See README.md.
version: 1
entry_agent: concierge

variables:
  customer_id:
    type: string
    description: Verified customer ID. It is assigned by the verification task and never spoken.

secrets:
  - OPENAI_API_KEY
  - SLNG_API_KEY
  - COVAL_API_KEY
  - MANAGER_PHONE_NUMBER
  - TWILIO_ACCOUNT_SID
  - TWILIO_AUTH_TOKEN
  - TWILIO_PHONE_NUMBER
  - SIP_TRUNK_HOSTNAME
  - SIP_AUTH_USERNAME
  - SIP_AUTH_PASSWORD
  - SIP_FROM_NUMBER

destinations:
  manager_line: MANAGER_PHONE_NUMBER

models:
  think:
    reasoning:
      provider: openai
      model: gpt-5.6-luna
      params:
        reasoning_effort: "none"
  # speak:
  #   voice:
  #     provider: slng
  #     # UNDER TEST. Swapped from cartesia/sonic:3.5 while chasing intermittent
  #     # first-segment failures on the gateway: segments sent their text, waited
  #     # 11.3s, received zero audio and errored. Voice ids are model-specific
  #     # here, and gradium rejects a cartesia uuid with "Embeddings not found".
  #     model: "gradium/tts:default"
  #     voice: "4SZHfMpw-p46Ywgs"
  #     language: en
  speak:
    voice:
      provider: slng
      model: "deepgram/aura:2"
      voice: "aura-2-thalia-en"
      language: en
      params:
        # Speech world part. SLNG speech serves na, eu and ap; the Context
        # Router's own regions are a different set under the same key.
        world_part_override: eu
        # Hold a TTS socket open ahead of the turn, so the gateway's session
        # init is already done when the text arrives. Off by default in the
        # SLNG plugin. Worth about 40ms of mean time to first audio and a much
        # better floor: gateway synthesis fell from 418ms mean and 221ms best
        # without it, to 376ms mean and 58ms best with it, over 14 and 9
        # segments. standby_used was true on 9 of 9 segments, so the mechanism
        # is confirmed rather than inferred. Measured 2026-08-21.
        #
        # It is NOT worth the ~610ms an earlier version of this comment
        # claimed. That number was the wait for a usable websocket, which
        # LiveKit's tts ttfb does not contain: ttfb tracks the gateway's
        # synthesis time alone, matching it to the millisecond across three
        # runs. The socket handshake was already off the caller's path.
        warm_standby_enabled: true
  listen:
    transcriber:
      provider: slng
      # How fast this model lands its *final* transcript decides how long the
      # caller waits, because the turn detector reads the transcript to decide
      # whether they have finished. A final that is still outstanding leaves the
      # detector unsure, and an unsure detector waits the full endpointing
      # max_delay of 2.5s instead of the 0.58s floor. On identical audio,
      # gradium/stt:default finalised in 0.999s mean and crossed that line on
      # 12 of 12 clips; deepgram/nova:3 finalised in 0.159s mean, worst 0.323s,
      # and crossed it on none, for the same words.
      model: "deepgram/nova:3"
      language: en
      params:
        # Kept for EU data residency, matching speak. It buys no latency here:
        # with and without it measured 0.190s and 0.186s mean.
        world_part_override: eu
  turn:
    detector:
      provider: local
      model: silero
      # UNDER TEST at 400ms on a TTS that works. 250ms moved the floor 0.577s to
      # ~0.30s but the agent re-asked a question, which is what a split
      # utterance looks like. The earlier retest was wasted on cartesia
      # segments that returned no audio at all.
      endpointing_delay: 400ms

agents:
  concierge:
    instructions: instructions.md
    model: reasoning
    voice: voice
    tools:
      - verify_customer
      - to_booking
      - to_complaints
      - to_chat

  booking_specialist:
    instructions: agents/booking-specialist.md
    model: reasoning
    voice: voice
    tools:
      - manage_booking
      - to_complaints
      - to_chat
      - to_concierge

  complaint_specialist:
    instructions: agents/complaint-specialist.md
    model: reasoning
    voice: voice
    tools:
      - record_complaint
      - to_manager
      - to_booking
      - to_chat
      - to_concierge

  chat_with_me:
    instructions: agents/chat-with-me.md
    model: reasoning
    voice: voice
    tools:
      - to_booking
      - to_complaints
      - to_concierge

tasks:
  customer_verification:
    instructions: tasks/verify-customer.md
    tools:
      - find_or_create_customer
    result:
      customer_id: string
      status:
        enum:
          - existing
          - created
          - invalid
      summary: string
    context:
      history: full

  # One task, not three. A draft step, a confirm step and an apply step each
  # cost their own LLM round trip to finish, and the mutation tools already
  # refuse an unconfirmed write, so the split bought two seconds of silence per
  # booking and no extra safety.
  booking:
    instructions: tasks/booking.md
    tools:
      - list_bookings
      - get_current_date
      - check_availability
      - create_booking
      - modify_booking
      - cancel_booking
      - to_complaints
      - to_chat
    result:
      action:
        enum:
          - create
          - modify
          - cancel
          - none
      booking_id: string
      status: string
      summary: string
    context:
      history: full

controls:
  verify_customer:
    kind: delegate
    task: customer_verification
    when: >-
      Confirm who the caller is before any specialist handoff. The task reads
      the phone number back and needs a yes before it looks anyone up.
    assign:
      customer_id: result.customer_id

  manage_booking:
    kind: delegate
    task: booking
    when: The verified caller wants to create, modify, or cancel a booking.

  to_booking:
    kind: agent_transfer
    to: booking_specialist
    when: The verified caller wants to create, modify, cancel, or review a booking.
    requires:
      - customer_id
    context:
      history: full
      variables: all

  to_complaints:
    kind: agent_transfer
    to: complaint_specialist
    when: The verified caller has a complaint or service problem.
    requires:
      - customer_id
    context:
      history: full
      variables: all

  to_chat:
    kind: agent_transfer
    to: chat_with_me
    when: The verified caller wants open-ended chat or current public information.
    requires:
      - customer_id
    context:
      history: full
      variables: all

  to_concierge:
    kind: agent_transfer
    to: concierge
    when: The caller changes to a request owned by another specialist.
    requires:
      - customer_id
    context:
      history: full
      variables: all

  to_manager:
    kind: human_transfer
    when: The caller explicitly asks for a manager or is clearly and strongly frustrated.
    cold:
      destination: manager_line
      ring_timeout: 30s
      on_unavailable: hangup

tools:
  - find_or_create_customer
  - list_bookings
  - get_current_date
  - check_availability
  - create_booking
  - modify_booking
  - cancel_booking
  - record_complaint

conversation:
  greeting:
    speaks_first: agent
    text: "Hi, you’ve reached Sage and Stone Salon. How can I help today?"
  interruption:
    enabled: true
  inactivity:
    nudge_after: 15s
    end_after: 45s
  max_duration: 15m

tracing:
  provider: coval

channels:
  web:
    kind: realtime_audio
  phone:
    kind: telephony
    inbound: true
    outbound: false

capacity:
  peak_sessions: 5
  max_sessions: 10
  peak_starts_per_second: 1
  avg_session_duration: 5m
