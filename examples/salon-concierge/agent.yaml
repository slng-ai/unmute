version: 1
entry_agent: concierge

variables:
  customer_id:
    type: string
    description: Verified customer ID. It is assigned by the verification task and never spoken.
  customer_phone:
    type: string
    description: >-
      The caller's confirmed phone number, as the verification task returns it:
      digit groups separated by single spaces, with no plus sign, brackets or
      dashes. That exact shape is load-bearing rather than cosmetic. The Context
      Router only puts the placeholder back where the answer holds the value
      character for character, so a number the agent reformats while speaking it
      leaves real digits in the stored copy, the personal-data scan refuses to
      share it, and the turn stops caching with no error to notice.

secrets:
  - OPENAI_API_KEY
  - SLNG_API_KEY
  - COVAL_API_KEY
  - MANAGER_PHONE_NUMBER
  - TWILIO_ACCOUNT_SID
  - TWILIO_AUTH_TOKEN
  - TWILIO_PHONE_NUMBER
  - SIP_TRUNK_HOSTNAME
  - SIP_AUTH_USERNAME
  - SIP_AUTH_PASSWORD
  - SIP_FROM_NUMBER

destinations:
  manager_line: MANAGER_PHONE_NUMBER

models:
  think:
    reasoning:
      provider: slng
      model: gpt-5.6-luna
      agent_id: optimized-salon-concierge-v8
      upstream:
        provider: openai
      params:
        world_part_override: eu
        reasoning_effort: "none"
  speak:
    voice:
      provider: slng
      model: "deepgram/aura:2"
      voice: "aura-2-thalia-en"
      language: en
      params:
        world_part_override: eu
        warm_standby_enabled: true
  listen:
    transcriber:
      provider: slng
      model: "deepgram/nova:3"
      language: en
      params:
        world_part_override: eu
  turn:
    detector:
      provider: local
      model: silero
      endpointing_delay: 400ms

agents:
  concierge:
    instructions: instructions.md
    model: reasoning
    voice: voice
    tools:
      - verify_customer
      - to_booking
      - to_complaints
      - to_chat

  booking_specialist:
    instructions: agents/booking-specialist.md
    model: reasoning
    voice: voice
    tools:
      - manage_booking
      - to_complaints
      - to_chat
      - to_concierge

  complaint_specialist:
    instructions: agents/complaint-specialist.md
    model: reasoning
    voice: voice
    tools:
      - record_complaint
      - to_manager
      - to_booking
      - to_chat
      - to_concierge

  chat_with_me:
    instructions: agents/chat-with-me.md
    model: reasoning
    voice: voice
    tools:
      - to_booking
      - to_complaints
      - to_concierge

tasks:
  customer_verification:
    instructions: tasks/verify-customer.md
    tools:
      - find_or_create_customer
    result:
      customer_id: string
      customer_phone: string
      status:
        enum:
          - existing
          - created
          - invalid
      summary: string
    context:
      history: full

  booking:
    instructions: tasks/booking.md
    tools:
      - list_bookings
      - get_current_date
      - check_availability
      - create_booking
      - modify_booking
      - cancel_booking
      - to_complaints
      - to_chat
    result:
      action:
        enum:
          - create
          - modify
          - cancel
          - none
      booking_id: string
      status: string
      summary: string
    context:
      history: full

controls:
  verify_customer:
    kind: delegate
    task: customer_verification
    when: >-
      Confirm who the caller is before any specialist handoff. The task reads
      the phone number back and needs a yes before it looks anyone up.
    assign:
      customer_id: result.customer_id
      customer_phone: result.customer_phone

  manage_booking:
    kind: delegate
    task: booking
    when: The verified caller wants to create, modify, or cancel a booking.

  to_booking:
    kind: agent_transfer
    to: booking_specialist
    when: The verified caller wants to create, modify, cancel, or review a booking.
    requires:
      - customer_id
    context:
      history: full
      variables: all

  to_complaints:
    kind: agent_transfer
    to: complaint_specialist
    when: The verified caller has a complaint or service problem.
    requires:
      - customer_id
    context:
      history: full
      variables: all

  to_chat:
    kind: agent_transfer
    to: chat_with_me
    when: The verified caller wants open-ended chat or current public information.
    requires:
      - customer_id
    context:
      history: full
      variables: all

  to_concierge:
    kind: agent_transfer
    to: concierge
    when: The caller changes to a request owned by another specialist.
    requires:
      - customer_id
    context:
      history: full
      variables: all

  to_manager:
    kind: human_transfer
    when: The caller explicitly asks for a manager or is clearly and strongly frustrated.
    cold:
      destination: manager_line
      ring_timeout: 30s
      on_unavailable: hangup

tools:
  - find_or_create_customer
  - list_bookings
  - get_current_date
  - check_availability
  - create_booking
  - modify_booking
  - cancel_booking
  - record_complaint

conversation:
  greeting:
    speaks_first: agent
    text: "Hi, you’ve reached Sage and Stone Salon. How can I help today?"
  interruption:
    enabled: true
  inactivity:
    nudge_after: 15s
    end_after: 45s
  max_duration: 15m

tracing:
  provider: coval

channels:
  web:
    kind: realtime_audio
  phone:
    kind: telephony
    inbound: true
    outbound: false

capacity:
  peak_sessions: 5
  max_sessions: 10
  peak_starts_per_second: 1
  avg_session_duration: 5m
