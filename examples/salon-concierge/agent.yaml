version: 1

name: salon-concierge

entry_agent: concierge

agents:
  concierge:
    instructions: instructions.md
    think: reasoning
    speak: voice
    tools:
      - look_up_salon_info
      - end_call
    tasks:
      - name: verify_customer
        when: >-
          Run this before the booking step whenever `customer_verified` is
          empty, and run it on its own when the caller explicitly corrects their
          phone number. Never run it twice for one booking: once
          `customer_verified` names a status, the caller is verified for the
          rest of the call. A change of date, time or service is not a phone
          correction and needs no verification.
        instructions: tasks/verify-customer.md
        # Spoken as this step is entered, on both routes in, and only when the
        # step actually runs: the group skips it once the number is confirmed,
        # so nothing ever says "verified" on a call where nobody was. That is
        # why the line is here and not on the group, whose own line fires on
        # every entry and could be honest on neither half.
        #
        # Alternatives because a caller can enter verification twice in a call,
        # by correcting their number after a booking, and the second identical
        # sentence is what makes an agent sound like a recording.
        announce:
          - Let me verify you first.
          - First, let me get you verified.
          - One moment, let me pull your details up.
        tools:
          - find_or_create_customer
        # One entry per tool, and the alternatives are a list under the field.
        # Two entries naming one tool, or two pairs naming one field, are both
        # silently reduced to the last one written.
        finish:
          - tool: find_or_create_customer
            success:
              - customer_status:
                  - existing
                  - created
        assign:
          - customer_phone: result.customer_phone
          # What the concierge reads to know verification already happened. It
          # exists because this is no longer a group step: `skip_when_confirmed:`
          # decided that structurally and there is no equivalent for a plain
          # task, so the decision moves into the owner's prompt and the owner
          # needs something to read. Deliberately the status and not the number:
          # the concierge must never hold a phone number it could speak.
          - customer_verified: result.customer_status
        context:
          history: messages

      - name: manage_booking
        when: >-
          The caller wants to create, move or cancel a booking. Includes a
          change to an appointment just made.
        instructions: tasks/booking.md
        # Spoken as this step is entered, and it used to sit on `find_slots`
        # instead. A tool's line is emitted inside the tool body, so it fires
        # once per invocation: on the live call of 2026-09-16 (trace 917975e9)
        # the model read the diary twice in one turn and the caller heard two
        # announcements 0.8 seconds apart. A step's line fires once in `on_enter`
        # whatever the step then does, so the repetition is not a rule the model
        # has to follow, it is a shape it cannot break.
        #
        # It is also earlier. The step's line is spoken before the model has
        # decided anything; the tool's was spoken after the request that chose
        # the tool. Measured on the same trace, step entry ran at t=25.46 and the
        # tool at t=26.10, so the caller hears this 0.64 seconds sooner.
        #
        # Alternatives because this fires once per booking, and a caller can
        # book and then move it inside a minute. A live call played one sentence
        # twice in forty-four seconds, which is what a recording sounds like.
        announce:
          - Let me double check what I have available.
          - Let me see what is free.
          - Right, let me have a look at the diary.
        tools:
          - find_slots
          - save_booking
        handoffs:
          - to_complaints
        finish:
          - tool: save_booking
            success:
              - status:
                  - booked
                  - moved
                  - cancelled
        assign:
          - appointment: result.appointment
        context:
          history: messages
    handoffs:
      - to_complaints
    escalations:
      - to_manager

  complaint_specialist:
    instructions: agents/complaint-specialist.md
    think: reasoning
    speak: voice
    # record_complaint sits here rather than behind a task of its own. Filing a
    # complaint is one action, not a step that has to happen in an order, so a
    # task around it cost a model round trip to enter and bought nothing. The
    # specialist's own prompt gets the caller's agreement before calling it.
    tools:
      - record_complaint
      - look_up_refund_policy
      - end_call
    handoffs:
      - to_concierge
    escalations:
      - to_manager

handoffs:
  to_complaints:
    to: complaint_specialist
    when: The caller has a complaint or service problem.
    context:
      history: messages

  to_concierge:
    to: concierge
    when: The caller changes to a request owned by another specialist.
    context:
      history: messages

escalations:
  to_manager:
    when: The caller explicitly asks for a manager or is clearly and strongly frustrated.
    cold:
      destination: manager_line
      ring_timeout: 30s
      on_unavailable: hangup

shapes:
  - name: Appointment
    description: The latest booking successfully created, moved, or cancelled.
    fields:
      - booking_id: Id
      - service: Literal["haircut", "hair-color", "blowout"]
      - date: Date
      # The whole confirmation phrase, "Friday at 9:00 AM", composed by the
      # tool. Three live calls on 2026-09-16 got a different part of it wrong,
      # each time because the agent built the sentence from something other
      # than this record: a Friday read off a date as "Thursday the 18th", a
      # "09:00" read back as "09:00 AM", and a move saved at 09:00 confirmed as
      # "3:00 PM", which was the time the caller had said two turns earlier.
      # The record already knows the answer, so no prompt composes one.
      - spoken: string
      - time: Time
      - action: Literal["book", "move", "cancel"]

# No `task_groups:` here, and there was one until 2026-09-16. A `book` group ran
# verify_customer then manage_booking as two steps of one invocation, which is a
# better shape than what replaced it: the group chained the steps itself, so the
# owner spent no model request deciding to enter the second one.
#
# It came out because it does not run on Pipecat. On the live Pipecat call of
# 2026-09-16 (trace 5a330c65) the group was entered, held the call for eleven
# seconds, produced no model request and no audio at all, and the caller heard
# only the greeting before asking "Hello?". Entering it a second time did the
# same. The lowering compiles and validates; it just never speaks.
#
# Two plain tasks cost one extra model request on the booking turn, which is the
# price of the example running on both targets. Verification is no longer
# skipped by `skip_when_confirmed:`, which is a group-step field: the concierge
# reads `customer_verified` and decides, which is what it did before the group
# existed.

variables:
  appointment:
    type: Appointment
    description: The latest successful booking action, saved only after the tool succeeds.

  booking_date:
    type: Date
    default: ""
    description: >-
      Today's date in the salon's own timezone, YYYY-MM-DD. Read once from the
      clock before the greeting, so a caller saying "tomorrow" costs one model
      request instead of two chained tool calls. A call that crosses midnight
      keeps the day it started on, which is deliberate: a date changing
      underneath a conversation would leave the caller and the agent disagreeing
      about what "tomorrow" means halfway through.

  booking_weekday:
    type: string
    default: ""
    description: >-
      The weekday today falls on, spelled out in English: Monday to Sunday. From
      the same clock reading as `booking_date`, so the two cannot disagree about
      which day it is. It is what lets the agent answer "next Friday" without a
      second turn working out what day today is first.

  salon_local_time:
    type: Time
    default: ""
    description: >-
      The salon's own wall clock when the call began, HH:MM on a 24 hour clock.
      From the same reading as the two above. It is what lets the agent know that
      a caller asking for "this afternoon" at 17:40 is asking for something that
      has nearly passed, rather than offering them a slot that is already gone.

  customer_phone:
    type: Phone
    default: ""
    confirm: verify_customer
    description: >-
      The caller's phone number in E.164: a plus sign, then digits, with no
      spaces, brackets or dashes. One shape for every phone number in this
      package, the MANAGER_PHONE_NUMBER transfer destination included, so no
      prompt and no tool has to guess which shape it is holding.

      No `source:` here on purpose. The prefetch block below reads the carrier's
      fact and this variable receives it, which leaves the per-route refusal for
      a variable naming a source its target cannot supply exactly as strict as it
      is: on a route with no caller ID the entry skips and this holds its default.

      Offered to the caller for a yes, never acted on unasked. Somebody may be
      ringing from a friend's phone, or may hold a second account, so until the
      verification step has heard them agree this value stays unconfirmed and
      appears in no prompt but that step's own.

  customer_verified:
    # Plain string rather than a Literal of the two statuses that can reach it.
    # The step's `finish:` only fires on existing or created, so `invalid` never
    # lands here, but the compiler checks the tool's declared output against the
    # variable and not the gate in front of it, so a narrower type is refused.
    type: string
    default: ""
    description: >-
      Whether verification has already run on this call, and what it found. Set
      by the verification step as it ends, which only happens on a number the
      caller agreed to, so a value here means the number beside it is confirmed.

      It exists for the concierge, which has to decide whether to verify before
      running the booking step and cannot read `customer_phone` to find out: an
      unconfirmed number renders in no prompt but the verification step's own,
      and a confirmed one must not be in front of an agent that might say it out
      loud. This carries the same fact with nothing sensitive in it.

      Empty means nobody has been verified yet on this call.

prefetch:
  - name: today
    clock: now
    timezone: Europe/Madrid
    assign:
      - booking_date: result.date
      - booking_weekday: result.day_of_week
      - salon_local_time: result.time

  - name: caller
    source: from_number
    assign:
      - customer_phone: result.value

secrets:
  - OPENAI_API_KEY
  - SLNG_API_KEY
  - LANGFUSE_SECRET_KEY
  - LANGFUSE_PUBLIC_KEY
  - LANGFUSE_BASE_URL
  - MANAGER_PHONE_NUMBER
  - TWILIO_ACCOUNT_SID
  - TWILIO_AUTH_TOKEN
  - TWILIO_PHONE_NUMBER
  - SIP_TRUNK_HOSTNAME
  - SIP_AUTH_USERNAME
  - SIP_AUTH_PASSWORD
  - SIP_FROM_NUMBER

destinations:
  manager_line: MANAGER_PHONE_NUMBER

knowledge:
  refunds:
    documents: knowledge/refunds
  services:
    documents: knowledge/services
    chunk_size: 220
    chunk_overlap: 40

models:
  think:
    # Back off native Gemini on 2026-09-16, after one live call (trace 917975e9)
    # lost 18.5 seconds to two `MALFORMED_FUNCTION_CALL` aborts and the caller
    # asked whether anybody was still there. That finish reason is a Gemini
    # server-side abort: the model emits its tool call as plain text instead of
    # a structured part, and the turn is thrown away. Nothing in this package
    # reaches it. The one deterministic trigger anybody has bisected is a tool
    # property named after a Python keyword, and none of ours is.
    #
    # The plugin then makes one abort cost nine seconds: MALFORMED is not in
    # livekit-plugins-google's non-retryable list (llm.py:122-129 in 1.8.2), so
    # the agents loop runs four attempts with 4.1 seconds of sleep between them.
    # The emitted session now caps that at one retry, which is worth having on
    # any provider, but a model that does not abort is worth more.
    reasoning:
      provider: openai
      model: gpt-5.6-luna
      params:
        reasoning_effort: "none"
  speak:
    voice:
      provider: slng
      model: "cartesia/sonic:3.5"
      voice: "62ae83ad-4f6a-430b-af41-a9bede9286ca"
      language: en
      params:
        world_part: eu-north
        warm_standby_enabled: true
  listen:
    transcriber:
      provider: slng
      model: "soniox/speech-ai:rt-v5"
      language: en
      params:
        world_part: eu-north
  turn:
    detector:
      provider: local
      model: silero
      pace: balanced

tools:
  - find_or_create_customer
  - find_slots
  - save_booking
  - record_complaint
  - look_up_refund_policy
  - look_up_salon_info
  - end_call

conversation:
  greeting:
    speaks_first: agent
    text: "Hi, you've reached Sage and Stone. Robin speaking, what can I do for you?"
  interruption:
    enabled: true
  inactivity:
    nudge_after: 15s
    end_after: 45s
  max_duration: 15m

tracing:
  provider: langfuse

channels:
  web:
    kind: realtime_audio
  phone:
    kind: telephony
    inbound: true
    outbound: false

capacity:
  peak_sessions: 5
  max_sessions: 10
  peak_starts_per_second: 1
  avg_session_duration: 5m
