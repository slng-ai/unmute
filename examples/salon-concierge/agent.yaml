version: 1

name: salon-concierge

entry_agent: concierge

agents:
  concierge:
    instructions: instructions.md
    think: reasoning
    speak: voice
    tools:
      - look_up_salon_info
      - end_call
    tasks:
      - name: verify_customer
        when: >-
          Run only when the caller explicitly corrects their phone number. Every
          other route into verification goes through the booking flow, which
          runs this step itself when the saved number is not confirmed. A change
          of date, time or service is not a phone correction.
        instructions: tasks/verify-customer.md
        tools:
          - find_or_create_customer
        # One entry per tool, and the alternatives are a list under the field.
        # Two entries naming one tool, or two pairs naming one field, are both
        # silently reduced to the last one written.
        finish:
          - tool: find_or_create_customer
            success:
              - customer_status:
                  - existing
                  - created
        assign:
          - customer_phone: result.customer_phone
        context:
          history: messages

      # No `announce:` here. A task's own line is spoken only under
      # `opening: listen`, and this step's opening has to report what the diary
      # holds, which is a generated turn. The line that covers this step's entry
      # rides on `find_slots` instead, which is the first thing it does.
      - name: manage_booking
        instructions: tasks/booking.md
        tools:
          - find_slots
          - save_booking
        handoffs:
          - to_complaints
        finish:
          - tool: save_booking
            success:
              - status:
                  - booked
                  - moved
                  - cancelled
        assign:
          - appointment: result.appointment
        context:
          history: messages
    task_groups:
      - book
    handoffs:
      - to_complaints
    escalations:
      - to_manager

  complaint_specialist:
    instructions: agents/complaint-specialist.md
    think: reasoning
    speak: voice
    # record_complaint sits here rather than behind a task of its own. Filing a
    # complaint is one action, not a step that has to happen in an order, so a
    # task around it cost a model round trip to enter and bought nothing. The
    # specialist's own prompt gets the caller's agreement before calling it.
    tools:
      - record_complaint
      - look_up_refund_policy
      - end_call
    handoffs:
      - to_concierge
    escalations:
      - to_manager

handoffs:
  to_complaints:
    to: complaint_specialist
    when: The caller has a complaint or service problem.
    context:
      history: messages

  to_concierge:
    to: concierge
    when: The caller changes to a request owned by another specialist.
    context:
      history: messages

escalations:
  to_manager:
    when: The caller explicitly asks for a manager or is clearly and strongly frustrated.
    cold:
      destination: manager_line
      ring_timeout: 30s
      on_unavailable: hangup

shapes:
  - name: Appointment
    description: The latest booking successfully created, moved, or cancelled.
    fields:
      - booking_id: Id
      - service: Literal["haircut", "hair-color", "blowout"]
      - date: Date
      # The agent says this out loud and cannot work one out from the date. A
      # live call on 2026-09-16 booked 2026-09-18, which is the Friday the
      # caller asked for, and confirmed it as "Thursday the 18th": every turn
      # before it had the day right, and the one sentence read off this record
      # was wrong, because the record held a date and nothing else. The tool
      # fills it, so no prompt does the arithmetic.
      - weekday: string
      - time: Time
      - action: Literal["book", "move", "cancel"]

# One booking request, start to finish, with no owner request between the two
# steps. Verification is skipped when the caller's number is already confirmed,
# which is every booking after the first on a call. The `announce:` covers
# entering the group, so the caller hears something while the first step opens.
#
# That line has to be true on both paths, because this group opens on the
# verification question the first time and on the diary every time after. A
# line naming either one is a lie on the other half of the calls: "let me pull
# that up" was spoken and then followed by a question about the caller's phone
# number, which is not something you pull up.
#
# It is also the only announce in this flow, because the skill's latency page
# says not to put one on two tools that fire in the same turn. Measured on the
# live LiveKit call of 2026-09-16: the request that enters this group and the
# verification turn after it together leave about 2.6 seconds between the caller
# finishing their request and hearing anything, the longest silence in the call.
#
# One line spoken on every entry means the caller hears the same sentence once
# per booking, which on a call with two bookings sounds like a recording. The
# same call played it three times in fifty seconds, and the third was a bug in
# the owner's prompt rather than in this line: the group returns a neutral
# `completed` and carries the caller's last turn back with it, so the owner read
# "Okay, great. Let's do 3:00 PM." above a completed result as a request nobody
# had served and entered here again. The diary refused the duplicate with
# slot_taken and the step then had nothing to save. The owner's workflow now
# says a completed flow is a served request; varying the line itself would take
# a list here, which this key does not accept.
task_groups:
  book:
    when: >-
      The caller wants to create, move or cancel a booking. Includes a change to
      an appointment just made.
    announce: Sure, let me get that sorted for you.
    steps:
      - task: verify_customer
        skip_when_confirmed: customer_phone
      - manage_booking
    context_scope: shared
    then: return

variables:
  appointment:
    type: Appointment
    description: The latest successful booking action, saved only after the tool succeeds.

  booking_date:
    type: Date
    default: ""
    description: >-
      Today's date in the salon's own timezone, YYYY-MM-DD. Read once from the
      clock before the greeting, so a caller saying "tomorrow" costs one model
      request instead of two chained tool calls. A call that crosses midnight
      keeps the day it started on, which is deliberate: a date changing
      underneath a conversation would leave the caller and the agent disagreeing
      about what "tomorrow" means halfway through.

  booking_weekday:
    type: string
    default: ""
    description: >-
      The weekday today falls on, spelled out in English: Monday to Sunday. From
      the same clock reading as `booking_date`, so the two cannot disagree about
      which day it is. It is what lets the agent answer "next Friday" without a
      second turn working out what day today is first.

  salon_local_time:
    type: Time
    default: ""
    description: >-
      The salon's own wall clock when the call began, HH:MM on a 24 hour clock.
      From the same reading as the two above. It is what lets the agent know that
      a caller asking for "this afternoon" at 17:40 is asking for something that
      has nearly passed, rather than offering them a slot that is already gone.

  customer_phone:
    type: Phone
    default: ""
    confirm: verify_customer
    description: >-
      The caller's phone number in E.164: a plus sign, then digits, with no
      spaces, brackets or dashes. One shape for every phone number in this
      package, the MANAGER_PHONE_NUMBER transfer destination included, so no
      prompt and no tool has to guess which shape it is holding.

      No `source:` here on purpose. The prefetch block below reads the carrier's
      fact and this variable receives it, which leaves the per-route refusal for
      a variable naming a source its target cannot supply exactly as strict as it
      is: on a route with no caller ID the entry skips and this holds its default.

      Offered to the caller for a yes, never acted on unasked. Somebody may be
      ringing from a friend's phone, or may hold a second account, so until the
      verification step has heard them agree this value stays unconfirmed and
      appears in no prompt but that step's own.

prefetch:
  - name: today
    clock: now
    timezone: Europe/Madrid
    assign:
      - booking_date: result.date
      - booking_weekday: result.day_of_week
      - salon_local_time: result.time

  - name: caller
    source: from_number
    assign:
      - customer_phone: result.value

secrets:
  - GOOGLE_API_KEY
  - OPENAI_API_KEY
  - SLNG_API_KEY
  - LANGFUSE_SECRET_KEY
  - LANGFUSE_PUBLIC_KEY
  - LANGFUSE_BASE_URL
  - MANAGER_PHONE_NUMBER
  - TWILIO_ACCOUNT_SID
  - TWILIO_AUTH_TOKEN
  - TWILIO_PHONE_NUMBER
  - SIP_TRUNK_HOSTNAME
  - SIP_AUTH_USERNAME
  - SIP_AUTH_PASSWORD
  - SIP_FROM_NUMBER

destinations:
  manager_line: MANAGER_PHONE_NUMBER

knowledge:
  refunds:
    documents: knowledge/refunds
  services:
    documents: knowledge/services
    chunk_size: 220
    chunk_overlap: 40

models:
  think:
    reasoning:
      provider: google
      model: gemini-3.5-flash-lite
      params:
        vertexai: true
        location: eu
        thinking_config:
          thinking_level: minimal
  speak:
    voice:
      provider: slng
      model: "cartesia/sonic:3.5"
      voice: "62ae83ad-4f6a-430b-af41-a9bede9286ca"
      language: en
      params:
        world_part: eu-north
        warm_standby_enabled: true
  listen:
    transcriber:
      provider: slng
      model: "soniox/speech-ai:rt-v5"
      language: en
      params:
        world_part: eu-north
  turn:
    detector:
      provider: local
      model: silero
      pace: balanced

tools:
  - find_or_create_customer
  - find_slots
  - save_booking
  - record_complaint
  - look_up_refund_policy
  - look_up_salon_info
  - end_call

conversation:
  greeting:
    speaks_first: agent
    text: "Hi, you've reached Sage and Stone. Robin speaking, what can I do for you?"
  interruption:
    enabled: true
  inactivity:
    nudge_after: 15s
    end_after: 45s
  max_duration: 15m

tracing:
  provider: langfuse

channels:
  web:
    kind: realtime_audio
  phone:
    kind: telephony
    inbound: true
    outbound: false

capacity:
  peak_sessions: 5
  max_sessions: 10
  peak_starts_per_second: 1
  avg_session_duration: 5m
