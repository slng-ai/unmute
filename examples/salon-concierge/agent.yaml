version: 2

name: salon-concierge

entry_agent: concierge

agents:
  concierge:
    instructions: instructions.md
    think: reasoning
    speak: voice
    tools:
      - look_up_salon_info
      - end_call
    tasks:
      - name: verify_customer
        when: >-
          Run this when the caller explicitly corrects their phone number, and
          when a complaint is about to be written down. Never before a booking:
          the `book` flow runs this step itself when the saved number is not
          confirmed. A change of date, time or service is not a phone
          correction.
        instructions: tasks/verify-customer.md
        # With no saved number, the step says this line and waits. With one,
        # code reads it back first, and the lookup runs on the caller's yes.
        start:
          say:
            - What number is best to identify you?
            - Can you give me a number I could use to identify you?
          listen: true
          call: find_or_create_customer
          with:
            - phone: state.customer_phone
        tools:
          - name: find_or_create_customer
            confirm:
              - Can you confirm your number is {{input.phone}}?
              - Just to check, is that {{input.phone}}?
            outcomes:
              - if:
                  - status:
                      - existing
                      - created
                save:
                  - customer_phone: result.customer_phone
                  - customer_verified: result.status
                then: done

      # No `when:`: the only way in is the `book` flow, so a booking cannot
      # start before verification has been decided.
      - name: manage_booking
        instructions: tasks/booking.md
        # The step reads the diary in code, with what the caller asked for,
        # and says the offer without asking the model.
        start:
          say:
            - Let me have a look.
            - One moment, let me check the diary.
            - Let me see what we have.
          call: find_slots
          with:
            - service: state.requested_service?
            - date: state.requested_day?
            - intent: state.requested_intent?
        # Each change is read back by code first and runs on the caller's yes.
        # Its receipt is said by code too, so the concierge makes no request.
        tools:
          - name: find_slots
            outcomes:
              - if:
                  - offered:
                      - true
                say:
                  - "{{result.offer}}"
          - name: book_appointment
            confirm:
              - Shall I book your {{input.service}} for {{input.date}} at {{input.time}}?
              - Would you like your {{input.service}} booked for {{input.date}} at {{input.time}}?
            outcomes:
              - if:
                  - status:
                      - booked
                save:
                  - appointment: result.appointment
                say:
                  - Lovely, your {{result.appointment.service}} is booked for {{result.appointment.date}} at {{result.appointment.time}}. Anything else I can do for you?
                  - Great, you're all set for {{result.appointment.date}} at {{result.appointment.time}}. Is there anything else?
                  - Perfect, you're in the diary for {{result.appointment.date}} at {{result.appointment.time}}. Anything else I can help with?
                then: done
          - name: move_appointment
            confirm:
              - Shall I move it to {{input.date}} at {{input.time}}?
              - Would you like it moved to {{input.date}} at {{input.time}}?
            outcomes:
              - if:
                  - status:
                      - moved
                save:
                  - appointment: result.appointment
                say:
                  - Done, I've moved it to {{result.appointment.date}} at {{result.appointment.time}}. Anything else?
                  - Great, you're now booked for {{result.appointment.date}} at {{result.appointment.time}}. Is there anything else I can do?
                  - All sorted, it's moved to {{result.appointment.date}} at {{result.appointment.time}}. Anything else I can help with?
                then: done
          - name: cancel_appointment
            confirm:
              - Shall I cancel your {{input.service}} for {{input.date}} at {{input.time}}?
              - Just to check, cancel your {{input.service}} for {{input.date}} at {{input.time}}?
            outcomes:
              - if:
                  - status:
                      - cancelled
                save:
                  - appointment: result.appointment
                say:
                  - That's cancelled for you. Anything else I can help with?
                  - Done, I've cancelled it. Is there anything else?
                  - All cancelled. Anything else I can do for you?
                then: done
        handoffs:
          - to_complaints
    task_groups:
      - book
    handoffs:
      - to_complaints
    escalations:
      - to_manager

  complaint_specialist:
    instructions: agents/complaint-specialist.md
    think: reasoning
    speak: voice
    tools:
      - record_complaint
      - look_up_refund_policy
      - end_call
    # A bare name: the definition stays on the concierge, one name across the
    # package. record_complaint injects customer_phone, which the caller must
    # confirm first, and a caller who opens with a complaint never went near
    # booking.
    tasks:
      - verify_customer
    handoffs:
      - to_concierge
    escalations:
      - to_manager

handoffs:
  to_complaints:
    to: complaint_specialist
    when: The caller has a complaint or service problem.
    announce: I'm sorry to hear that. Let me take this down properly.

  to_concierge:
    to: concierge
    when: The caller changes to a request owned by another specialist.

escalations:
  to_manager:
    when: The caller explicitly asks for a manager or is clearly and strongly frustrated.
    cold:
      destination: manager_line
      ring_timeout: 30s
      on_unavailable: hangup

# One booking request, start to finish. The concierge picks this once, with
# what the caller asked for; the flow runs verification and then booking.
task_groups:
  book:
    when: >-
      The caller wants to create, move or cancel a booking. Includes a change to
      an appointment just made.
    arguments:
      - requested_service
      - requested_day
      - requested_intent
    steps:
      # Skipped once the caller has agreed to their number.
      - task: verify_customer
        skip_when_confirmed: customer_phone
      - manage_booking

# How the values on State in state.py behave: where one comes from, and
# which step confirms it. A value needs an entry only for one of those.
variables:
  - name: customer_phone
    confirm: verify_customer

prefetch:
  - name: today
    clock: now
    timezone: Europe/Madrid
    assign:
      - booking_date: result.date
      - booking_weekday: result.day_of_week
      - salon_local_time: result.time

  - name: caller
    source: from_number
    assign:
      - customer_phone: result.value

secrets:
  - OPENAI_API_KEY
  - GOOGLE_API_KEY
  - SLNG_API_KEY
  - LANGFUSE_SECRET_KEY
  - LANGFUSE_PUBLIC_KEY
  - LANGFUSE_BASE_URL
  - MANAGER_PHONE_NUMBER
  - TWILIO_ACCOUNT_SID
  - TWILIO_AUTH_TOKEN
  - TWILIO_PHONE_NUMBER
  - SIP_TRUNK_HOSTNAME
  - SIP_AUTH_USERNAME
  - SIP_AUTH_PASSWORD
  - SIP_FROM_NUMBER

destinations:
  manager_line: MANAGER_PHONE_NUMBER

knowledge:
  refunds:
    documents: knowledge/refunds
  services:
    documents: knowledge/services
    chunk_size: 220
    chunk_overlap: 40

models:
  think:
    # The other qualified binding. Swap the two blocks to go back; the README
    # says what each one was measured on.
    # reasoning:
    #   provider: openai
    #   model: gpt-5.6-luna
    #   params:
    #     reasoning_effort: "none"
    reasoning:
      provider: google
      model: gemini-3.1-flash-lite
      params:
        vertexai: true
        location: eu
        thinking_config:
          thinking_level: MINIMAL
  speak:
    voice:
      provider: slng
      model: "cartesia/sonic:3.5"
      voice: "62ae83ad-4f6a-430b-af41-a9bede9286ca"
      language: en
      params:
        world_part: eu-north
        warm_standby_enabled: true
  listen:
    transcriber:
      provider: slng
      model: "soniox/speech-ai:rt-v5"
      language: en
      params:
        world_part: eu-north
  turn:
    detector:
      provider: local
      model: silero
      pace: snappy

tools:
  - find_or_create_customer
  - find_slots
  - book_appointment
  - move_appointment
  - cancel_appointment
  - name: record_complaint
    start:
      say:
        - Let me get that written down.
  - look_up_refund_policy
  - look_up_salon_info
  - end_call

conversation:
  greeting:
    speaks_first: agent
    text: "Hi, you've reached Sage and Stone. Robin speaking, what can I do for you?"
  interruption:
    enabled: true
  inactivity:
    nudge_after: 15s
    end_after: 45s
  max_duration: 15m

tracing:
  provider: langfuse
