version: 1

name: salon-concierge
entry_agent: concierge

variables:
  customer_phone:
    type: string
    description: >-
      The caller's confirmed phone number in E.164, exactly as the verification
      task returns it: a plus sign, then digits, with no spaces, brackets or
      dashes. One shape for every phone number in this package, the
      MANAGER_PHONE_NUMBER transfer destination included, so no prompt and no
      tool has to guess which shape it is holding. The prompts never read this
      value back to the caller, and that is deliberate: the Context Router only
      puts the placeholder back where an answer holds the value character for
      character, and a model asked to say an E.164 string aloud regroups it, so
      such a turn would silently stop caching. The placeholder is here so an
      agent can tell an identified caller from a new one, not so it can recite
      the number.

secrets:
  - OPENAI_API_KEY
  - SLNG_API_KEY
  - COVAL_API_KEY
  - MANAGER_PHONE_NUMBER
  - TWILIO_ACCOUNT_SID
  - TWILIO_AUTH_TOKEN
  - TWILIO_PHONE_NUMBER
  - SIP_TRUNK_HOSTNAME
  - SIP_AUTH_USERNAME
  - SIP_AUTH_PASSWORD
  - SIP_FROM_NUMBER

destinations:
  manager_line: MANAGER_PHONE_NUMBER

knowledge:
  refunds:
    documents: knowledge/refunds
  services:
    documents: knowledge/services
    chunk_size: 220
    chunk_overlap: 40

models:
  think:
    reasoning:
      provider: slng
      model: gpt-5.6-luna
      agent_id: optimized-salon-concierge-v12
      upstream:
        provider: openai
      params:
        world_part_override: eu
        reasoning_effort: "none"
  speak:
    voice:
      provider: slng
      model: "cartesia/sonic:3.5"
      voice: "62ae83ad-4f6a-430b-af41-a9bede9286ca"
      language: en
      params:
        world_part_override: eu
        warm_standby_enabled: true
  listen:
    transcriber:
      provider: slng
      model: "soniox/speech-ai:rt-v5"
      language: en
      params:
        world_part_override: eu
  turn:
    detector:
      provider: local
      model: silero
      pace: balanced
      endpointing_delay: 400ms

agents:
  concierge:
    instructions: instructions.md
    model: reasoning
    voice: voice
    tools:
      - verify_customer
      - look_up_salon_info
      - manage_booking
      - to_complaints
      - to_manager

  complaint_specialist:
    instructions: agents/complaint-specialist.md
    model: reasoning
    voice: voice
    tools:
      - verify_customer
      - record_complaint
      - look_up_refund_policy
      - to_manager
      - to_concierge

tasks:
  customer_verification:
    instructions: tasks/verify-customer.md
    tools:
      - find_or_create_customer
    result:
      customer_phone: string
      status:
        enum:
          - existing
          - created
          - invalid
      summary: string
    context:
      history: full

  booking:
    instructions: tasks/booking.md
    tools:
      - list_bookings
      - get_current_date
      - check_availability
      - create_booking
      - modify_booking
      - cancel_booking
      - to_complaints
    result:
      action:
        enum:
          - create
          - modify
          - cancel
          - none
      booking_id: string
      status: string
      summary: string
    context:
      history: full

controls:
  verify_customer:
    kind: delegate
    task: customer_verification
    when: >-
      Confirm who the caller is before any specialist handoff. The task reads
      the phone number back and needs a yes before it looks anyone up.
    assign:
      customer_phone: result.customer_phone

  manage_booking:
    kind: delegate
    task: booking
    when: The caller wants to create, modify, or cancel a booking.
    requires:
      - customer_phone

  to_complaints:
    kind: agent_transfer
    to: complaint_specialist
    when: The verified caller has a complaint or service problem.
    context:
      history: full
      variables: all

  to_concierge:
    kind: agent_transfer
    to: concierge
    when: The caller changes to a request owned by another specialist.
    context:
      history: full
      variables: all

  to_manager:
    kind: human_transfer
    when: The caller explicitly asks for a manager or is clearly and strongly frustrated.
    cold:
      destination: manager_line
      ring_timeout: 30s
      on_unavailable: hangup

tools:
  - find_or_create_customer
  - look_up_refund_policy
  - look_up_salon_info
  - list_bookings
  - get_current_date
  - check_availability
  - create_booking
  - modify_booking
  - cancel_booking
  - record_complaint

conversation:
  greeting:
    speaks_first: agent
    text: "Hi, you've reached Sage and Stone. Robin speaking, what can I do for you?"
  interruption:
    enabled: true
  inactivity:
    nudge_after: 15s
    end_after: 45s
  max_duration: 15m

tracing:
  provider: coval

channels:
  web:
    kind: realtime_audio
  phone:
    kind: telephony
    inbound: true
    outbound: false

capacity:
  peak_sessions: 5
  max_sessions: 10
  peak_starts_per_second: 1
  avg_session_duration: 5m
