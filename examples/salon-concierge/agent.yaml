version: 2

name: salon-concierge

entry_agent: concierge

agents:
  concierge:
    instructions: instructions.md
    think: reasoning
    speak: voice
    tools:
      - look_up_salon_info
      - end_call
    tasks:
      - name: verify_customer
        when: >-
          Run this when the caller explicitly corrects their phone number, and
          when a complaint is about to be written down. Never before a booking:
          the `book` flow runs this step itself when the saved number is not
          confirmed. A change of date, time or service is not a phone
          correction.
        instructions: tasks/verify-customer.md
        # The step asks for the number and waits. With a saved number, code
        # opens on the lookup instead, and the read-back below asks for a yes.
        opening: listen
        announce:
          - What number is best to identify you?
          - Can you give me a number I could use to identify you?
        opens_with:
          tool: find_or_create_customer
          arguments:
            - phone: customer_phone
        tools:
          - find_or_create_customer
        finish:
          - tool: find_or_create_customer
            success:
              - status:
                  - existing
                  - created
            # Code reads the number back, and the lookup runs on the caller's yes.
            confirm:
              - Can you confirm your number is {{state.number_heard}}?
              - Just to check, is that {{state.number_heard}}?
        assign:
          - number_heard: input.phone
          - customer_phone: result.customer_phone
          - customer_verified: result.status

      # No `when:`: the only way in is the `book` flow, so a booking cannot
      # start before verification has been decided.
      - name: manage_booking
        instructions: tasks/booking.md
        announce:
          - Let me have a look.
          - One moment, let me check the diary.
          - Let me see what we have.
        # The step opens by reading the diary in code, with what the caller
        # asked for, and says the offer without asking the model.
        opens_with:
          tool: find_slots
          arguments:
            - service: requested_service
            - date: requested_day
            - intent: requested_intent
          say:
            - "{{state.offer}}"
        tools:
          - find_slots
          - book_appointment
          - move_appointment
          - cancel_appointment
        handoffs:
          - to_complaints
        replies:
          - tool: find_slots
            when:
              - offered:
                  - true
            say:
              - "{{state.offer}}"
        # Each write is read back by code first and runs on the caller's yes.
        # Its receipt is said by code too, so the concierge makes no request.
        finish:
          - tool: book_appointment
            success:
              - status:
                  - booked
            confirm:
              - Shall I book your {{state.chosen_service}} for {{state.chosen_day}} at {{state.chosen_time}}?
              - Would you like your {{state.chosen_service}} booked for {{state.chosen_day}} at {{state.chosen_time}}?
            say:
              - Lovely, your {{state.appointment.service}} is booked for {{state.appointment.date}} at {{state.appointment.time}}. Anything else I can do for you?
              - Great, you're all set for {{state.appointment.date}} at {{state.appointment.time}}. Is there anything else?
              - Perfect, you're in the diary for {{state.appointment.date}} at {{state.appointment.time}}. Anything else I can help with?
          - tool: move_appointment
            success:
              - status:
                  - moved
            confirm:
              - Shall I move it to {{state.chosen_day}} at {{state.chosen_time}}?
              - Would you like it moved to {{state.chosen_day}} at {{state.chosen_time}}?
            say:
              - Done, I've moved it to {{state.appointment.date}} at {{state.appointment.time}}. Anything else?
              - Great, you're now booked for {{state.appointment.date}} at {{state.appointment.time}}. Is there anything else I can do?
              - All sorted, it's moved to {{state.appointment.date}} at {{state.appointment.time}}. Anything else I can help with?
          - tool: cancel_appointment
            success:
              - status:
                  - cancelled
            confirm:
              - Shall I cancel your {{state.chosen_service}} for {{state.chosen_day}} at {{state.chosen_time}}?
              - Just to check, cancel your {{state.chosen_service}} for {{state.chosen_day}} at {{state.chosen_time}}?
            say:
              - That's cancelled for you. Anything else I can help with?
              - Done, I've cancelled it. Is there anything else?
              - All cancelled. Anything else I can do for you?
        assign:
          - appointment: result.appointment
          - chosen_service: input.service?
          - chosen_day: input.date
          - chosen_time: input.time
    task_groups:
      - book
    handoffs:
      - to_complaints
    escalations:
      - to_manager

  complaint_specialist:
    instructions: agents/complaint-specialist.md
    think: reasoning
    speak: voice
    tools:
      - record_complaint
      - look_up_refund_policy
      - end_call
    # A bare name: the definition stays on the concierge, one name across the
    # package. record_complaint injects customer_phone, which the caller must
    # confirm first, and a caller who opens with a complaint never went near
    # booking.
    tasks:
      - verify_customer
    handoffs:
      - to_concierge
    escalations:
      - to_manager

handoffs:
  to_complaints:
    to: complaint_specialist
    when: The caller has a complaint or service problem.
    announce: I'm sorry to hear that. Let me take this down properly.

  to_concierge:
    to: concierge
    when: The caller changes to a request owned by another specialist.

escalations:
  to_manager:
    when: The caller explicitly asks for a manager or is clearly and strongly frustrated.
    cold:
      destination: manager_line
      ring_timeout: 30s
      on_unavailable: hangup

# One booking request, start to finish. The concierge picks this once, with
# what the caller asked for; the flow runs verification and then booking.
task_groups:
  book:
    when: >-
      The caller wants to create, move or cancel a booking. Includes a change to
      an appointment just made.
    arguments:
      - requested_service
      - requested_day
      - requested_intent
    steps:
      # Skipped once the caller has agreed to their number.
      - task: verify_customer
        skip_when_confirmed: customer_phone
      - manage_booking

# How the values on State in state.py behave: where one comes from, and
# which step confirms it. A value needs an entry only for one of those.
variables:
  - name: customer_phone
    confirm: verify_customer

prefetch:
  - name: today
    clock: now
    timezone: Europe/Madrid
    assign:
      - booking_date: result.date
      - booking_weekday: result.day_of_week
      - salon_local_time: result.time

  - name: caller
    source: from_number
    assign:
      - customer_phone: result.value

secrets:
  - OPENAI_API_KEY
  - GOOGLE_API_KEY
  - SLNG_API_KEY
  - LANGFUSE_SECRET_KEY
  - LANGFUSE_PUBLIC_KEY
  - LANGFUSE_BASE_URL
  - MANAGER_PHONE_NUMBER
  - TWILIO_ACCOUNT_SID
  - TWILIO_AUTH_TOKEN
  - TWILIO_PHONE_NUMBER
  - SIP_TRUNK_HOSTNAME
  - SIP_AUTH_USERNAME
  - SIP_AUTH_PASSWORD
  - SIP_FROM_NUMBER

destinations:
  manager_line: MANAGER_PHONE_NUMBER

knowledge:
  refunds:
    documents: knowledge/refunds
  services:
    documents: knowledge/services
    chunk_size: 220
    chunk_overlap: 40

models:
  think:
    # The other qualified binding. Swap the two blocks to go back; the README
    # says what each one was measured on.
    # reasoning:
    #   provider: openai
    #   model: gpt-5.6-luna
    #   params:
    #     reasoning_effort: "none"
    reasoning:
      provider: google
      model: gemini-3.1-flash-lite
      params:
        vertexai: true
        location: eu
        thinking_config:
          thinking_level: MINIMAL
  speak:
    voice:
      provider: slng
      model: "cartesia/sonic:3.5"
      voice: "62ae83ad-4f6a-430b-af41-a9bede9286ca"
      language: en
      params:
        world_part: eu-north
        warm_standby_enabled: true
  listen:
    transcriber:
      provider: slng
      model: "soniox/speech-ai:rt-v5"
      language: en
      params:
        world_part: eu-north
  turn:
    detector:
      provider: local
      model: silero
      pace: snappy

tools:
  - find_or_create_customer
  - find_slots
  - book_appointment
  - move_appointment
  - cancel_appointment
  - record_complaint
  - look_up_refund_policy
  - look_up_salon_info
  - end_call

conversation:
  greeting:
    speaks_first: agent
    text: "Hi, you've reached Sage and Stone. Robin speaking, what can I do for you?"
  interruption:
    enabled: true
  inactivity:
    nudge_after: 15s
    end_after: 45s
  max_duration: 15m

tracing:
  provider: langfuse

channels:
  web:
    kind: realtime_audio
  phone:
    kind: telephony
    inbound: true
    outbound: false

capacity:
  peak_sessions: 5
  max_sessions: 10
  peak_starts_per_second: 1
  avg_session_duration: 5m
