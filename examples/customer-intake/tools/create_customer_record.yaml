description: >-
  Open the customer record once the caller's number is agreed and their details
  are taken. Call it silently, once, and read the reference number back from
  what it returns rather than inventing one.

# One argument the model fills, and it is the only one the model could get
# right: everything else was already said and saved, and asking the model to
# retype it is how a digit changes between the turn it was agreed on and the
# turn it was written down.
with:
  - phone: "state.caller_phone"
  - email: "state.caller_email"
  - name: "state.contact.name"
  - enquiry: "state.enquiry"

local:
  handler: tools/intake.py:create_customer_record

interruption: provider_default
effect: returns_data
