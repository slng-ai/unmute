# Both code targets, same source, no `connection:` on either. That is what makes
# this a browser package: `unmute dev` runs it, no carrier account is needed, and
# the `source: from_number` prefetch entry is seeded by `--source` instead of by
# a route.

channels:
  - name: web
    kind: realtime_audio

capacity:
  peak_sessions: 2
  max_sessions: 5
  peak_starts_per_second: 1
  avg_session_duration: 3m

targets:
  livekit:
    provider: livekit
    version: "1.8.8"
    sdk_language: python
    models:
      detector:
        provider: livekit
        model: turn-detector-mini
        endpointing_delay: 300ms

  pipecat:
    provider: pipecat
    version: "1.12.0"
    models:
      detector:
        provider: local
        model: silero
        # No endpointing_delay here on purpose. It sets the floor, and every
        # Pipecat pace already resolves the floor to 200ms; writing it again
        # would read like a decision while changing nothing. The pace on the
        # base binding is what moves this target, through the ceiling.
