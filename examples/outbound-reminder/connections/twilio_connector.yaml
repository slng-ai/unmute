# Twilio account for the LiveKit Twilio connector route. Values are
# environment variable names, never secrets.
#
# The same three names as ./twilio_websocket.yaml, and deliberately so: one
# Twilio account, reached two ways. A connection declares its own transport, so
# the two targets in this package cannot share one file even though they share
# an account.
transport: connector
carrier: twilio
environment:
  account_sid: TWILIO_ACCOUNT_SID
  auth_token: TWILIO_AUTH_TOKEN
  from_number: TWILIO_PHONE_NUMBER
