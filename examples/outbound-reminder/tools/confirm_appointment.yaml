# The model calls this with no arguments. Runtime values are injected into the
# local fixture, so the model can never invent a customer id or route value.
description: Confirm that the existing appointment stays as booked. Call it when the customer says the time works.

input:
  type: object
  properties: {}

inject:
  customer_id: "{{customer_id}}"
  dialed_number: "{{dialed_number}}"
  channel: phone

output:
  type: object
  properties:
    confirmed:
      type: boolean
    customer_id:
      type: string
    dialed_number:
      type: string
    channel:
      type: string
  required:
    - confirmed
    - customer_id
    - dialed_number
    - channel

local:
  handler: tools/confirm_appointment.py

effect: returns_data
interruption: provider_default
