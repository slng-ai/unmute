# Deterministic local fixture: no booking service or credential is required.
description: Cancel the appointment outright. Call it only when the customer says plainly that they want to cancel, never when they want a different time.

input:
  type: object
  properties: {}

inject:
  customer_id: "{{customer_id}}"

output:
  type: object
  properties:
    cancelled:
      type: boolean
    customer_id:
      type: string
  required:
    - cancelled
    - customer_id

local:
  handler: tools/cancel_appointment.py

effect: returns_data
interruption: provider_default
