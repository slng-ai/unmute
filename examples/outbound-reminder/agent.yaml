# Outbound appointment reminder showing every runtime-value kind in one place:
#   input variables        customer_id, name, appointment_time (from the dispatch)
#   system variable        dialed_number (runtime owned, source: to_number)
#   conversation variable  reschedule_to (the model saves it mid call)
#   secrets                env names only, values never appear in any file
#
# The three tools also show both ways a secret reaches a call: the two webhook
# tools name theirs in YAML (url_env, auth.token_env), and cancel_appointment
# reads its signing key with os.environ inside its own Python handler.
version: 1
entry_agent: reminder

variables:
  customer_id:
    type: string
    source: call_start
    description: CRM id of the customer this call is about. Used by the booking tools, never spoken.
  name:
    type: string
    source: call_start
    description: Customer's first name, used in the greeting and the prompt.
  appointment_time:
    type: string
    source: call_start
    description: Appointment start in spoken form, for example "tomorrow at 3 pm".
  dialed_number:
    type: string
    source: to_number
  reschedule_to:
    type: string
    source: conversation
    description: New slot the customer asks for, in spoken form. Save it as soon as the customer names one.

secrets:
  - SALON_API_URL
  - SALON_API_TOKEN
  - SALON_API_SIGNING_KEY
  - OPENAI_API_KEY
  - SLNG_API_KEY
  # Both connections name the same three: one Twilio account, reached two ways.
  - TWILIO_ACCOUNT_SID
  - TWILIO_AUTH_TOKEN
  - TWILIO_PHONE_NUMBER

models:
  think:
    reasoning:
      provider: openai
      model: gpt-5.6-luna
      params:
        # A reasoning model answering with function tools on chat completions
        # needs this exact value, or OpenAI returns 400 on every turn.
        reasoning_effort: "none"
  speak:
    voice:
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
  listen:
    transcriber:
      provider: slng
      model: "slng/deepgram/nova:3-en"
  turn:
    detector:
      provider: local
      model: silero

agents:
  reminder:
    instructions: instructions.md
    model: reasoning
    voice: voice
    tools:
      - confirm_appointment
      - reschedule_appointment
      - cancel_appointment

tools:
  - confirm_appointment
  - reschedule_appointment
  - cancel_appointment

conversation:
  greeting:
    speaks_first: agent
    text: "Hi {{name}}! This is Sage and Stone Salon calling about your appointment {{appointment_time}}. Does that time still work for you?"
  interruption:
    enabled: true

channels:
  web:
    kind: realtime_audio
  phone:
    kind: telephony
    inbound: false
    outbound: true

capacity:
  peak_sessions: 2
  max_sessions: 4
  peak_starts_per_second: 1
  avg_session_duration: 2m
