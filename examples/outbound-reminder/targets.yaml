# Both shipped code drivers, same agent, same Twilio account: the variables and
# secrets surface compiles and runs identically on each.
#
# The two targets ride different transports, so each names its own connection
# file. The files hold the same three environment names because there is one
# Twilio account behind them; what differs is the mechanism, and a connection
# states its own.
targets:
  pipecat:
    provider: pipecat
    version: "1.5.0"
    connection: twilio_websocket

  livekit:
    provider: livekit
    version: "1.5.2"
    sdk_language: python
    connection: twilio_connector
    models:
      detector:
        provider: livekit
        model: turn-detector-mini
