# Sage and Stone Salon's phone line on Pipecat over Daily, with one way to
# reach a person: a cold transfer. Daily is the route where Pipecat has a
# native transfer primitive (sip_call_transfer); warm transfer has no Pipecat
# primitive at all, so it lives in the LiveKit example (../livekit-human-transfer).
version: 1
entry_agent: front_desk

# Every environment variable this package needs you to set, in one list: model
# keys and the number the transfer dials. There are no carrier credentials
# because connections/daily.yaml names none — Daily carries its own calls. The
# route still reads DAILY_API_KEY at runtime, and it is not listed here because
# the route's own environment supplies it rather than you (SCHEMA §4.12).
secrets:
  - OPENAI_API_KEY
  - SLNG_API_KEY
  - BILLING_PHONE_NUMBER

models:
  think:
    reasoning:
      provider: openai
      model: gpt-5.6-luna
      params:
        reasoning_effort: minimal
  speak:
    voice:
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
  listen:
    transcriber:
      provider: slng
      model: "slng/deepgram/nova:3-en"
  turn:
    detector:
      provider: local
      model: silero

agents:
  front_desk:
    instructions: instructions.md
    model: reasoning
    voice: voice
    tools:
      - send_to_billing

controls:
  # Cold: the bot announces the handoff, Daily reroutes the caller's leg via
  # SIP REFER, and the bot drops off. Billing answers knowing nothing about
  # the call.
  send_to_billing:
    kind: human_transfer
    when: The caller asks about an invoice, a refund, or a charge they do not recognise.
    cold:
      destination: billing_line

# Who this agent escalates to. A value is the UPPER_SNAKE name of an environment
# variable holding an E.164 number or a sip: URI, read at call time. A committed
# example never ships a dialable literal: any number a repository ships is a
# number nobody answers.
destinations:
  billing_line: BILLING_PHONE_NUMBER

conversation:
  greeting:
    speaks_first: agent
    text: "Sage and Stone Salon, this is the front desk. How can I help?"
  interruption:
    enabled: true

# No phone channel: on this route the telephony is Daily's own. The number,
# the dial-in webhook, and dial-out permission all live on the Daily domain
# (configured through Pipecat Cloud), not in a generated telephony server.
channels:
  web:
    kind: realtime_audio

capacity:
  peak_sessions: 4
  max_sessions: 8
  peak_starts_per_second: 1
  avg_session_duration: 3m
