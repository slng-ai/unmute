# Pipecat on the Daily route: the one Pipecat transport with a native
# transfer primitive (docs/TRANSFERS.md). Cold transfer needs dial-out
# enabled on the Daily domain.
targets:
  pipecat:
    provider: pipecat
    version: "1.5.0"
    # connections/daily.yaml declares the transport and nothing else: this route
    # has no carrier and needs no credentials from you.
    connection: daily
