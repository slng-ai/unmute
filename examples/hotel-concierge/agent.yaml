name: hotel-concierge

entry_agent: concierge

agents:
  - name: concierge
    prompt: instructions.md
    think: reasoning
    speak: front_desk
    tools:
      - hotel_info
      - search_places_text
      - web_search
      - send_sms
      - end_call

models:
  think:
    reasoning:
      description: answers the guest
      # Written out, although the model id already carries the vendor. A
      # manifest matches its model rules by provider, so an entry with no
      # provider matches no rule and every model it names is refused.
      provider: google
      model: gemini/google/gemini-3.1-flash-lite:latest
      # One fallback model. SLNG tries it when the primary fails to answer.
      # Named here, defined below, and emitted as the platform's own
      # fallbacks.llm list.
      fallback:
        - backup
    backup:
      description: takes over when the primary model fails
      provider: google
      model: gemini/google/gemini-2.5-flash:latest
  # Both speech models are written whole, vendor and model joined, and both are
  # ones SLNG serves in the eu region. The `slng/deepgram/...-en` ids the
  # scaffold uses elsewhere are SLNG-hosted copies that run in us-central,
  # Australia and India only, and a push into eu-north refuses them with
  # AGENT_MODEL_UNAVAILABLE.
  speak:
    front_desk:
      description: warm, concise
      provider: slng
      model: "deepgram/aura:2"
      voice: "aura-2-thalia-en"
  listen:
    transcriber:
      description: default STT
      provider: deepgram
      model: deepgram/nova:3
      language: en

# How the values on State in state.py behave: where one comes from, and
# which step confirms it. A value needs an entry only for one of those.
variables:
  - name: caller_phone
    source: conversation

# There is no `secrets:` block. The places tool's credential is SLNG's, held
# in its Vault under the name the published tool records, and `unmute deploy`
# discovers it from the platform rather than this file repeating it. Every
# value this package varies per deployment is a template variable above. A
# `{{$NAME}}` Vault variable would not work in the prompt either way: SLNG
# substitutes one into an MCP server URL and nowhere else, and a prompt is a
# template whose placeholder names carry no dollar, so the push refuses it.

tools:
  - name: search_places_text
    start:
      say:
        - Let me have a look around the neighbourhood.

conversation:
  greeting:
    speaks_first: agent
    say: "Good day, this is the concierge desk at {{state.hotel_name}}. How can I help with your stay?"
  interruption:
    enabled: true
