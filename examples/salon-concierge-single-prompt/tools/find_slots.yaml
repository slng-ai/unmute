description: >-
  Read the diary: what the caller already has booked, and what times are free.
  Call this before offering any time and before changing any booking. It never
  writes anything, so call it whenever you are unsure what the caller holds.

  Give a date to see free times on that date. Leave the service out to see every
  service. The caller's own bookings come back every time, whatever you asked,
  so you never need a second call to find out what they hold.

  Ask the caller which day they want before you call this, and never guess one.
  A call for a day nobody named answers nothing, and the second call you then
  have to make speaks a second announcement the caller did not need to hear.

local:
  handler: tools/salon.py:find_slots

# No `announce:`, the same as in salon-concierge, so the two packages run one
# tool set and a comparison between them measures only their structure.
interruption: provider_default
effect: returns_data
