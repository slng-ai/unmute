description: >-
  Cancel one confirmed booking owned by the verified customer. Use an exact
  booking ID returned by list_bookings.

input:
  type: object
  properties:
    customer_phone:
      type: string
      description: >-
        The caller's confirmed phone number, exactly as find_or_create_customer
        returned it. The model retypes it here on every call, because nothing in
        this package holds it.
    booking_id:
      type: string
      description: Exact booking ID returned by list_bookings
    confirmed:
      type: boolean
      description: Exact true value from the shared confirm_booking result
  required:
    - customer_phone
    - booking_id
    - confirmed

output:
  type: object
  properties:
    booking_id:
      type: string
    status:
      type: string
      enum:
        - cancelled
        - not_confirmed
        - not_found
        - already_cancelled
    summary:
      type: string
  required:
    - booking_id
    - status
    - summary

local:
  handler: tools/salon.py

interruption: provider_default
effect: returns_data
announce: Cancelling that now.
