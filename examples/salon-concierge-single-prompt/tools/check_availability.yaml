description: List currently open salon times for one supported service and date.

input:
  type: object
  properties:
    service:
      type: string
      enum:
        - haircut
        - hair-color
        - blowout
    date:
      type: string
      description: Preferred date in YYYY-MM-DD form
  required:
    - service
    - date

output:
  type: object
  properties:
    slots:
      type: array
      items:
        type: object
        properties:
          slot_id:
            type: string
          start_time:
            type: string
        required:
          - slot_id
          - start_time
    status:
      type: string
      enum:
        - available
        - full
        - invalid
  required:
    - slots
    - status

local:
  handler: tools/salon.py

interruption: provider_default
effect: returns_data
