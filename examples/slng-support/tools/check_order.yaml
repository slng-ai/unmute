# A CODE tool. SLNG runs this Python itself, in its own sandbox.
#
# Two things follow, and both bite the first time:
#
#   1. Custom code on SLNG has NO internet access. `requests`, `httpx` and
#      `urllib` are refused at validate rather than failing on a live call.
#      Work that needs the network is a webhook tool: see search_places_text.
#   2. A code tool cannot be published until one sample run proves it. Write
#      build/slng/samples/check_order.json and deploy with --run-samples.
#
# The parameter is `order_number`, matching the tool of this name that already
# exists in the organisation. A push REPLACES a tool it finds, so a package that
# renamed the field would change the schema every other agent calls.
description: Look up an order by its number and return its status and delivery date.

input:
  type: object
  properties:
    order_number:
      type: string
      description: The order number the caller read out
  required:
    - order_number

output:
  type: object
  properties:
    status:
      type: string
    delivers_on:
      type: string

local:
  handler: tools/check_order.py

announce: One moment while I look that up.
effect: returns_data
