version: 1

name: acme-support

entry_agent: support

agents:
  support:
    instructions: instructions.md
    model: reasoning
    voice: front_desk
    tools:
      - check_order
      - search_places_text
      - web_search
      - end_call

variables:
  customer_name:
    type: string
    default: there

models:
  think:
    reasoning:
      description: answers the caller
      model: gemini/google/gemini-3.1-flash-lite:latest
  speak:
    front_desk:
      description: warm, concise
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
  listen:
    transcriber:
      description: default STT
      provider: deepgram
      model: slng/deepgram/nova:3-en
      language: en

secrets:
  - SLNG_TOOL_RENDER
  - SEARCH_PLACES_URL
  - FIRECRAWL_MCP_URL

tools:
  - web_search
  - check_order
  - search_places_text
  - end_call

conversation:
  greeting:
    speaks_first: agent
    text: "Hi {{customer_name}}, you have reached Acme Support. How can I help?"
  interruption:
    enabled: true

channels:
  web:
    kind: realtime_audio
  phone:
    kind: telephony
    inbound: true
    outbound: false

capacity:
  peak_sessions: 5
  max_sessions: 10
  peak_starts_per_second: 0.5
  avg_session_duration: 4m
