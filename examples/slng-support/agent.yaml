# A support agent that runs on SLNG, and only on SLNG.
#
# SLNG hosts the agent, so there is no project to run and no infrastructure to
# operate. `unmute compile --target slng` writes a deployment body and a runbook
# into build/slng/, and the voiceai CLI pushes them.
#
# Every tool here is a builtin, which is deliberate. A builtin names a
# capability SLNG already owns, so this package needs no tool bodies created
# first and no names resolved to identifiers: the emitted agent.json is postable
# exactly as written.
#
# What this package leaves out, and why:
#   - a `turn:` section: SLNG owns its own turn taking, so a bound turn model
#     reaches nothing
#   - tasks, task groups, agent transfers: SLNG's agent carries one prompt
#   - inactivity, max_duration, interruption thresholds: no field to hold them
#   - tracing, capacity: unmute instruments and sizes no process here
#
# All five are refused at validate rather than dropped, so `unmute validate
# --target slng` tells you before anything is written.

version: 1

# What this agent is called where it is deployed. The deployed name is this
# joined to the target it was compiled for, so one package with two targets
# of the same provider does not deploy one name twice. Required on every
# target: the two names unmute could infer instead are not identities,
# because every package calls its target after the platform, and the folder
# is named by whoever cloned the repository.
name: acme-support

entry_agent: support

agents:
  support:
    instructions: instructions.md
    model: reasoning
    voice: front_desk
    tools:
      - end_call

variables:
  # Declared with a default, so it appears in both of SLNG's variable maps: the
  # declaration list and the defaults. A caller whose name is not supplied at
  # dispatch is greeted with the default.
  customer_name:
    type: string
    default: there

models:
  think:
    reasoning:
      description: answers the caller
      model: gemini/google/gemini-3.1-flash-lite:latest
  speak:
    front_desk:
      description: warm, concise
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
  listen:
    transcriber:
      description: default STT
      provider: deepgram
      model: slng/deepgram/nova:3-en
      language: en

tools:
  - end_call

conversation:
  greeting:
    speaks_first: agent
    # SLNG requires a greeting and speaks the string it is given, so it is
    # written out here rather than left to the model. The token is a package
    # variable, rendered by SLNG at the start of the call.
    text: "Hi {{customer_name}}, you have reached Acme Support. How can I help?"
  interruption:
    enabled: true

channels:
  web:
    kind: realtime_audio
