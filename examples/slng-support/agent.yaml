version: 1

name: acme-support

entry_agent: support

agents:
  support:
    instructions: instructions.md
    think: reasoning
    speak: front_desk
    tools:
      - check_order
      - search_places_text
      - web_search
      - end_call

models:
  think:
    reasoning:
      description: answers the caller
      model: gemini/google/gemini-3.1-flash-lite:latest
  speak:
    front_desk:
      description: warm, concise
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
  listen:
    transcriber:
      description: default STT
      provider: deepgram
      model: slng/deepgram/nova:3-en
      language: en

# There is no `secrets:` block. The two hosted tools authenticate with
# credentials SLNG holds for them, and the MCP server's address and credential
# are SLNG's too, so `unmute deploy` discovers what the vault has to hold
# rather than this file repeating names that could go out of step with it.

tools:
  - web_search
  - check_order
  - search_places_text
  - end_call

conversation:
  greeting:
    speaks_first: agent
    text: "Hi, you have reached Acme Support. How can I help?"
  interruption:
    enabled: true

channels:
  web:
    kind: realtime_audio
  phone:
    kind: telephony
    inbound: true
    outbound: false

capacity:
  peak_sessions: 5
  max_sessions: 10
  peak_starts_per_second: 0.5
  avg_session_duration: 4m
