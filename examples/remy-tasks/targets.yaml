# One LiveKit instance. listen and speak route through the SLNG Execution Layer
# (provider: slng, slng/... routes), so the emitted project uses slng.STT /
# slng.TTS from livekit-plugins-slng rather than a per-vendor plugin. reason
# binds the native openai plugin; turn-detector-mini runs the local turn model.
# Same models as the `remy` example; only the unused `desk` voice is dropped,
# since this variant has a single agent.

targets:
  livekit-dev:
    provider: livekit
    version: "1.5.2"            # framework pin; the driver checks its range (>=1.5, <2.0)
    sdk_language: python
    models:                     # all four roles are open on LiveKit
      listen: { provider: slng, model: "slng/deepgram/nova:3-en" }
      turn:   { provider: livekit, model: turn-detector-mini }
      speak:
        host: { provider: slng, model: "slng/deepgram/aura:2-en", voice: "aura-2-thalia-en" }
      reason:
        reasoning:
          provider: openai
          model: gpt-4o-mini
          params: { temperature: 0.4 }
