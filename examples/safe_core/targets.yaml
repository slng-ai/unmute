# One instance per primary target. The same portable source compiles to all five.
# Each instance carries infrastructure only (provider, version, transport,
# destinations) plus a `models:` override map for the entries this target
# cannot run as defined in agent.yaml (N15). listen and turn are role slots set
# here because they are per-target plumbing, not per-agent identity. Overrides
# are forwarded to the provider as-is and never validated (SCHEMA.md, D10);
# secrets and URLs are env var names only. Instances are named after the
# provider: what you test is what you deploy.

targets:
  livekit:
    provider: livekit
    version: "1.5.2"            # framework pin; the driver checks its range (>=1.5, <2.0)
    sdk_language: python
    models:                     # all four roles are open on LiveKit
      listen: { provider: deepgram, model: nova-3 }
      turn:   { provider: livekit, model: turn-detector-mini, semantic_endpointing: preferred }
      front_desk: { provider: elevenlabs, voice: cgSgspJ2msm6clMCkdW9 }
      specialist: { provider: elevenlabs, voice: EXAVITQu4vr4xnSDxMaL }
    destinations:
      billing_line: "+14155550123"

  pipecat:
    provider: pipecat
    version: "1.5.0"
    transport: daily-sip        # cold_transfer needs Daily SIP on Pipecat
    models:                     # speak/reason use the agent.yaml defaults (SLNG + OpenAI)
      listen: { provider: deepgram, model: nova-3 }
      turn:   { provider: local, model: silero, semantic_endpointing: preferred }  # on-device VAD; advisory
    destinations:
      billing_line: "+14155550123"

  vapi:
    provider: vapi
    carrier: twilio
    models:
      # turn is integrated on Vapi: no turn binding. Endpointing intent comes
      # from the conversation block, not from a bound model.
      listen: { provider: deepgram, model: nova-3 }
      front_desk: { provider: elevenlabs, voice: cgSgspJ2msm6clMCkdW9 }
      specialist: { provider: elevenlabs, voice: EXAVITQu4vr4xnSDxMaL }
    destinations:
      billing_line: "+14155550123"

  elevenlabs:
    provider: elevenlabs
    models:
      # listen and turn are integrated on ElevenLabs. The listen override is
      # settings-only; it can never name an outside STT model.
      listen: { params: { user_input_audio_format: ulaw_8000 } }
      front_desk: { voice: cgSgspJ2msm6clMCkdW9 }   # ElevenLabs voices only
      specialist: { voice: EXAVITQu4vr4xnSDxMaL }
      fast_reasoning:    { model: gemini-2.5-flash }    # ElevenLabs supported list
      careful_reasoning: { model: claude-sonnet-4-5 }
    destinations:
      billing_line: "+14155550123"

  deepgram:
    provider: deepgram
    version: "1"
    carrier: twilio             # the generated bridge resolves phone controls
                                # against the carrier
    models:
      # turn is integrated into listen on Deepgram: turn thresholds ride the
      # listen override's params, because that is where Deepgram puts them.
      listen: { model: flux, params: { eot_threshold: 0.7 } }
      front_desk: { model: aura-2-thalia-en }   # Deepgram voices, or a fixed third-party list
      specialist: { model: aura-2-orion-en }
    destinations:
      billing_line: "+14155550123"
