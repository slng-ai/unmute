# One instance per primary target. The same portable source compiles to all five.
# Model names, voice ids, and params here are forwarded to the provider as-is
# and never validated (SCHEMA.md, D10). Secrets and URLs are env var names only.

targets:
  livekit-dev:
    provider: livekit
    version: "1.2"              # framework pin; the driver checks its range
    sdk_language: python
    models:                     # all four roles are open on LiveKit
      listen: { provider: deepgram, model: nova-3 }
      turn:   { provider: livekit, model: turn-detector-mini }
      speak:
        front_desk: { provider: elevenlabs, voice: cgSgspJ2msm6clMCkdW9 }
        specialist: { provider: elevenlabs, voice: EXAVITQu4vr4xnSDxMaL }
      reason:
        fast_reasoning:
          provider: openai
          model: gpt-4o-mini
          params: { temperature: 0.4 }
        careful_reasoning:
          provider: openai
          model: gpt-4o
    destinations:
      billing_line: "+14155550123"

  pipecat-dev:
    provider: pipecat
    version: "1.0.3"
    transport: daily-sip        # cold_transfer needs Daily SIP on Pipecat
    models:                     # all four roles are open on Pipecat
      listen: { provider: deepgram, model: nova-3 }
      turn:   { provider: local, model: smart-turn }
      speak:
        front_desk: { provider: slng, voice: nova-it, endpoint_env: SLNG_TTS_URL }
        specialist: { provider: slng, voice: marco,   endpoint_env: SLNG_TTS_URL }
      reason:
        fast_reasoning:
          provider: openai
          model: gpt-4o-mini
          params: { temperature: 0.4 }
        careful_reasoning:
          provider: openai
          model: gpt-4o
    destinations:
      billing_line: "+14155550123"

  vapi-prod:
    provider: vapi
    carrier: twilio
    models:
      # turn is integrated on Vapi: no binding. Endpointing intent comes
      # from the conversation block, not from a bound model.
      listen: { provider: deepgram, model: nova-3 }
      speak:
        front_desk: { provider: elevenlabs, voice_id: cgSgspJ2msm6clMCkdW9 }
        specialist: { provider: elevenlabs, voice_id: EXAVITQu4vr4xnSDxMaL }
      reason:
        fast_reasoning:    { provider: openai, model: gpt-4o-mini }
        careful_reasoning: { provider: openai, model: gpt-4o }
    destinations:
      billing_line: "+14155550123"

  elevenlabs-prod:
    provider: elevenlabs
    models:
      # listen and turn are integrated on ElevenLabs. The listen binding is
      # optional and settings-only; it can never name an outside STT model.
      listen: { params: { user_input_audio_format: ulaw_8000 } }
      speak:                    # ElevenLabs voices only
        front_desk: { voice_id: cgSgspJ2msm6clMCkdW9 }
        specialist: { voice_id: EXAVITQu4vr4xnSDxMaL }
      reason:                   # must come from the ElevenLabs supported list
        fast_reasoning:    { model: gemini-2.5-flash }
        careful_reasoning: { model: claude-sonnet-4-5 }
    destinations:
      billing_line: "+14155550123"

  deepgram-dev:
    provider: deepgram
    carrier: twilio             # the generated bridge resolves phone controls
                                # against the carrier
    models:
      # turn is integrated into listen on Deepgram: turn thresholds ride the
      # listen binding's params, because that is where Deepgram puts them.
      listen: { model: flux, params: { eot_threshold: 0.7 } }
      speak:                    # Deepgram voices, or a fixed third-party list
        front_desk: { model: aura-2-thalia-en }
        specialist: { model: aura-2-orion-en }
      reason:
        fast_reasoning:    { provider: openai, model: gpt-4o-mini }
        careful_reasoning: { provider: openai, model: gpt-4o }
    destinations:
      billing_line: "+14155550123"
