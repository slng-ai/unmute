description: >-
  Look a dish up on the menu before you agree to it. Takes what the caller
  called it, in their own words, and hands back the real menu name, the price in
  pounds and whether the kitchen has it tonight. Use the name and the price this
  returns, never one you remember.

local:
  handler: tools/takeaway.py:look_up_dish

interruption: provider_default
effect: returns_data
