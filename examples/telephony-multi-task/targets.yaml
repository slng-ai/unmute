targets:
  livekit:
    provider: livekit
    version: "1.5.2"
    sdk_language: python
    transport: sip
    carrier: twilio
    connection: twilio_sip
    destinations:
      front_desk: "+15550100000"
    models:
      detector: { provider: livekit, model: turn-detector-mini }

  pipecat:
    provider: pipecat
    version: "1.5.0"
    transport: carrier-websocket
    carrier: twilio
    connection: twilio_voice
    destinations:
      front_desk: "+15550100000"
