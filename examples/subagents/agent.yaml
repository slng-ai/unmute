# A front desk hands the same conversation to one of two specialist agents.
version: 1
language: en
entry_agent: front_desk

models:
  think:
    reasoning:
      provider: openai
      model: gpt-4o-mini
      temperature: 0.2
  speak:
    voice:
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
  listen:
    transcriber:
      provider: slng
      model: "slng/deepgram/nova:3-en"
  turn:
    detector:
      provider: local
      model: silero

agents:
  front_desk:
    instructions: instructions.md
    model: reasoning
    voice: voice
    tools: [to_sales, to_support]

  sales_specialist:
    instructions: agents/sales-specialist.md
    model: reasoning
    voice: voice

  support_specialist:
    instructions: agents/support-specialist.md
    model: reasoning
    voice: voice

controls:
  to_sales:
    kind: agent_transfer
    to: sales_specialist
    when: The caller asks about plans, pricing, or buying.
    context:
      history: full
      variables: all

  to_support:
    kind: agent_transfer
    to: support_specialist
    when: The caller needs help with an existing account or product.
    context:
      history: full
      variables: all

conversation:
  greeting:
    speaks_first: agent
    text: "Hi, do you need sales or product support?"
  interruption: { enabled: true }

channels:
  web: { kind: realtime_audio }

capacity:
  peak_sessions: 5
  max_sessions: 10
  avg_session_duration: 5m
