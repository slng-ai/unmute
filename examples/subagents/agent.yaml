# Two agents share appointment tools and hand the conversation back and forth.
version: 1
entry_agent: booking_desk

secrets:
  - OPENAI_API_KEY
  - SLNG_API_KEY
  - LANGFUSE_BASE_URL
  - LANGFUSE_PUBLIC_KEY
  - LANGFUSE_SECRET_KEY

models:
  think:
    reasoning:
      provider: openai
      model: gpt-5.6-luna
      params:
        reasoning_effort: minimal
  speak:
    voice:
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
  listen:
    transcriber:
      provider: slng
      model: "slng/deepgram/nova:3-en"
  turn:
    detector:
      provider: local
      model: silero

agents:
  booking_desk:
    instructions: instructions.md
    model: reasoning
    voice: voice
    tools:
      - lookup_customer
      - create_customer
      - check_availability
      - book_appointment
      - to_appointment_manager

  appointment_manager:
    instructions: agents/appointment-manager.md
    model: reasoning
    voice: voice
    tools:
      - lookup_customer
      - create_customer
      - check_availability
      - book_appointment
      - cancel_appointment
      - to_booking_desk

controls:
  to_appointment_manager:
    kind: agent_transfer
    to: appointment_manager
    when: The caller wants to reschedule or cancel an existing appointment.
    context:
      history: full
      variables: all

  to_booking_desk:
    kind: agent_transfer
    to: booking_desk
    when: The caller wants to make a new appointment instead.
    context:
      history: full
      variables: all

tools:
  - lookup_customer
  - create_customer
  - check_availability
  - book_appointment
  - cancel_appointment

conversation:
  greeting:
    speaks_first: agent
    text: "Hi, this is Sage and Stone Salon. Are you booking or changing an appointment?"
  interruption:
    enabled: true

tracing:
  provider: langfuse

channels:
  web:
    kind: realtime_audio

capacity:
  peak_sessions: 5
  max_sessions: 10
  avg_session_duration: 5m
