description: >-
  Create a Sage and Stone customer only after lookup found no record and the
  caller explicitly gave permission. Use only the customer_id this action
  returns.

input:
  type: object
  properties:
    name: { type: string, description: Customer full name }
    phone: { type: string, description: Customer phone number }
  required: [name, phone]

output:
  type: object
  properties:
    customer_id: { type: string }
    name: { type: string }
    created: { type: boolean }
  required: [customer_id, name, created]

local:
  handler: tools/create_customer.py

interruption: provider_default
effect: returns_data
