# Both shapes, both orchestrators, one agent.yaml. The two targets differ only
# in which Twilio product they use, which is the whole reason their credentials
# differ (docs/user/learn/07-phone-calls.md#why-the-same-carrier-asks-for-different-credentials).
#
#   pipecat: Programmable Voice + Media Streams. Three account credentials, and
#            `unmute dev --telephony` is the whole setup. Start here.
#   livekit: Elastic SIP Trunking. Needs a provisioned trunk and a LiveKit SIP
#            deployment with public SIP and RTP, so it compiles on a laptop but
#            does not run on one.
#
# Both compile offline with no credentials at all: a Connection stores env var
# names, never values.
targets:
  pipecat:
    provider: pipecat
    version: "1.5.0"
    transport: carrier-websocket
    carrier: twilio
    connection: twilio_voice
    # Symbolic names, resolved here so the model never sees a phone number and
    # can never dial an arbitrary one. A destination is either a literal (E.164
    # or a sip: URI) or the UPPER_SNAKE name of an environment variable holding
    # one. Both forms are shown here on purpose.
    destinations:
      # A fixed number that is the same everywhere: keep it in the file.
      billing_line: "+34910000001"
      # One that differs per environment, or that you would rather not commit:
      # name the variable instead. It lands in the generated .env.example and in
      # the required-env list, and is read at call time.
      supervisor_line: SUPERVISOR_PHONE_NUMBER

  livekit:
    provider: livekit
    version: "1.5.2"
    sdk_language: python
    transport: sip
    carrier: twilio
    connection: twilio_sip
    models:
      # LiveKit runs its own turn model rather than local Silero.
      detector:
        provider: livekit
        model: turn-detector-mini
    # The same two names the agent uses, resolved per target: a destination is
    # a property of where the call is placed from, not of the agent.
    destinations:
      billing_line: "+34910000001"
      supervisor_line: SUPERVISOR_PHONE_NUMBER
