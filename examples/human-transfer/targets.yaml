# Both shapes, both orchestrators, one agent.yaml. The two targets differ only
# in which Twilio product they use, which is the whole reason their credentials
# differ (docs/user/learn/07-phone-calls.md#why-the-same-carrier-asks-for-different-credentials).
#
#   pipecat: Programmable Voice + Media Streams. Three account credentials, and
#            `unmute dev --telephony` is the whole setup. Start here.
#   livekit: the same Twilio product through our own Media Streams bridge, so
#            it runs on a laptop too. Transfers here are ours (a REST redirect
#            for cold, a second streamed call bridged in-room for warm), not
#            LiveKit's SIP prebuilts, which need a trunk.
#
# The SIP route (transport: sip, connections/twilio_sip.yaml) is the other way
# to run LiveKit; see the README for when each one is the right choice.
#
# Both compile offline with no credentials at all: a Connection stores env var
# names, never values.
targets:
  pipecat:
    provider: pipecat
    version: "1.5.0"
    transport: carrier-websocket
    carrier: twilio
    connection: twilio_voice
    # Symbolic names, resolved here so the model never sees a phone number and
    # can never dial an arbitrary one. A destination is either a literal (E.164
    # or a sip: URI, e.g. billing_line: "+14155550123") or the UPPER_SNAKE name
    # of an environment variable holding one. An env var name lands in the
    # generated .env.example and the required-env list, and is read at call
    # time. This example uses the env form for both, because any literal a
    # repository could ship is a number nobody answers, and a transfer to it
    # fails on a live call exactly when you are trying the example out.
    destinations:
      billing_line: BILLING_PHONE_NUMBER
      supervisor_line: SUPERVISOR_PHONE_NUMBER

  livekit:
    provider: livekit
    version: "1.5.2"
    sdk_language: python
    transport: connector
    carrier: twilio
    connection: twilio_voice
    models:
      # LiveKit runs its own turn model rather than local Silero.
      detector:
        provider: livekit
        model: turn-detector-mini
    # The same two names the agent uses, resolved per target: a destination is
    # a property of where the call is placed from, not of the agent.
    destinations:
      billing_line: BILLING_PHONE_NUMBER
      supervisor_line: SUPERVISOR_PHONE_NUMBER
