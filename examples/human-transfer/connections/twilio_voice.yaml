# Twilio for the Pipecat carrier-websocket route: Programmable Voice + Media
# Streams. Values are environment variable names, never secrets.
#
# The same three values carry both transfer shapes. A cold transfer redirects
# the caller's call over the REST API; a warm transfer dials the person on a
# second call from the same number, so nothing else has to be provisioned.
kind: telephony
environment:
  account_sid: TWILIO_ACCOUNT_SID
  auth_token: TWILIO_AUTH_TOKEN
  from_number: TWILIO_PHONE_NUMBER
