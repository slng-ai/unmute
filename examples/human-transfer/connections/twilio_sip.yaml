# Twilio Elastic SIP Trunking, the account side of the LiveKit SIP route.
# Values are environment variable names, never secrets.
#
# Cold transfer is a SIP REFER, so the trunk must allow transfers: in the Twilio
# console, Elastic SIP Trunking > Manage > Trunks > your trunk > Call Transfer
# (SIP REFER) = Enabled, and Enable PSTN Transfer ticked.
kind: telephony
environment:
  sip_address: TWILIO_SIP_ADDRESS
  sip_username: TWILIO_SIP_USERNAME
  sip_password: TWILIO_SIP_PASSWORD
  from_number: TWILIO_PHONE_NUMBER
