description: >-
  Place the reorder for one repeat prescription. Call it only after
  look_up_prescription found the prescription and the caller has agreed the
  reference you read back. It answers with one of four states: placed,
  already_ordered, no_repeats_left, or unknown_reference. Tell the caller which
  one it was in plain words, and give the collection day only when it returns
  one.

local:
  handler: tools/pharmacy.py:request_refill

# Once this has started, the order is placed whether or not the caller talks
# over the answer, so say so rather than leaving it to each runtime's default.
# Pipecat reads this and will not cancel the call; LiveKit runs every tool to
# completion anyway, so it is already true there.
interruption: continue
effect: returns_data
