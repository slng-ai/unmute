# Both code targets from one source, and no `connection:` on either. That is
# what makes this a browser package: `unmute dev` runs it and no carrier account
# is involved. A realtime package compiles for the browser route only in this
# version, so a connection here would be refused by name.
#
# Neither target overrides the realtime binding. The model id, the voice and the
# turn setting are one decision, and writing them per target is how the two
# halves of an example stop agreeing.
targets:
  livekit:
    provider: livekit
    version: "1.8.1"

  pipecat:
    provider: pipecat
    version: "1.10.0"
