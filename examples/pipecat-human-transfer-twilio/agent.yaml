# Sage and Stone Salon's phone line on Pipecat Cloud, reached through the salon's
# own Twilio number, with one way to reach a person: a cold transfer.
# Twilio streams the audio straight to Pipecat Cloud, so nothing in this package
# has to be hosted by anybody.
version: 1
entry_agent: front_desk

# Every environment variable this package needs you to set, in one list: model
# keys, the Twilio credentials connections/twilio_voice.yaml names, and the
# number the transfer dials. It does not list names the route supplies at
# runtime, such as PIPECAT_CLOUD_ORGANIZATION.
secrets:
  - OPENAI_API_KEY
  - SLNG_API_KEY
  - TWILIO_ACCOUNT_SID
  - TWILIO_AUTH_TOKEN
  - TWILIO_PHONE_NUMBER
  - BILLING_PHONE_NUMBER

models:
  think:
    reasoning:
      provider: openai
      model: gpt-5.6-luna
      params:
        # A reasoning model answering with function tools on chat completions
        # needs this exact value, or OpenAI returns 400 on every turn.
        reasoning_effort: "none"
  speak:
    voice:
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
  listen:
    transcriber:
      provider: slng
      model: "slng/deepgram/nova:3-en"
  turn:
    detector:
      provider: local
      model: silero

agents:
  front_desk:
    instructions: instructions.md
    model: reasoning
    voice: voice
    tools:
      - send_to_billing

controls:
  # Cold: one request replaces the live call's markup at Twilio. The caller hears
  # a line, the destination rings, and this agent's part is over. When the
  # destination leg ends or never connects, Twilio ends the original call.
  send_to_billing:
    kind: human_transfer
    when: The caller asks about an invoice, a refund, or a charge they do not recognise.
    cold:
      destination: billing_line

# Who this agent escalates to. A value is the UPPER_SNAKE name of an environment
# variable holding an E.164 number or a sip: URI, read at call time. No phone
# number is ever written into this package.
destinations:
  billing_line: BILLING_PHONE_NUMBER

conversation:
  greeting:
    speaks_first: agent
    # Names its own line on purpose. This salon exists on three targets with the
    # same voice and the same model, and one Twilio number can only point at one
    # of them at a time, so if you are testing more than one you want to hear
    # which answered rather than deduce it from logs.
    text: "Sage and Stone Salon on the Pipecat Cloud line, this is the front desk. How can I help?"
  interruption:
    enabled: true

channels:
  phone:
    kind: telephony
    inbound: true
    # Outbound is declared because it is how you test a transfer without waiting
    # for somebody to call you: place a call to your own mobile, then ask the
    # agent for billing.
    outbound: true

capacity:
  peak_sessions: 4
  max_sessions: 8
  peak_starts_per_second: 1
  avg_session_duration: 3m
