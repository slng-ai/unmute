# Pipecat on the platform's native carrier stream: your own Twilio number, a
# small piece of static markup in the Twilio console, and Pipecat Cloud
# terminating the call's audio itself (SCHEMA N38).
#
# Three fields select it, all of them fields the vocabulary already had:
# transport, carrier, connection. Nothing is hosted by you on this route: the
# build emits no process, and the generated runbook has no hosting step.
targets:
  pipecat:
    provider: pipecat
    version: "1.5.0"
    transport: cloud-websocket
    carrier: twilio
    # The connection is here because this package places calls and hands calls to
    # a person; both speak to Twilio's API in your name. A package that only
    # receives calls on this route needs no connection at all.
    connection: twilio_voice
    # Where Pipecat Cloud runs the deployed agent, and the only place a region is
    # written down. Three things are derived from this one line, so changing it
    # and recompiling moves all three together:
    #
    #   1. `region` in the emitted pcc-deploy.toml, so the agent deploys there
    #   2. the `--region` on the emitted `secrets set` command, because a secret
    #      set is region-scoped and an agent can only read one from its own region
    #   3. the `wss://<region>.api.pipecat.daily.co/...` address in the TwiML the
    #      emitted README dictates, because a regional stream endpoint routes only
    #      to agents deployed in that region
    #
    # Change it to your own region. `pipecat cloud regions list` prints what is
    # available to you; the codes are forwarded exactly as written and never
    # checked here, so the platform CLI is what tells you a code is wrong
    # (SCHEMA N32).
    deployment_region: eu-central
    # The destination is the UPPER_SNAKE name of an env var holding an E.164
    # number or a sip: URI, read at call time. No phone number is ever written
    # into this package.
    destinations:
      billing_line: BILLING_PHONE_NUMBER
