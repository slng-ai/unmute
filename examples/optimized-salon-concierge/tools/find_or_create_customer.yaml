description: >-
  Look up or create one salon customer from the exact confirmed first name and
  surname and phone. Use only after the complete readback receives a new
  unambiguous yes. Reuse the exact match or create a record for a new phone
  number. Never guess identity or use an unconfirmed value.

input:
  type: object
  properties:
    name:
      type: string
      description: Exact confirmed first name and surname joined as one full name
    phone:
      type: string
      description: Exact confirmed phone; 10 to 15 digits with no inferred country code
  required:
    - name
    - phone

output:
  type: object
  properties:
    customer_id:
      type: string
    customer_name:
      type: string
    status:
      type: string
      enum:
        - existing
        - created
        - name_mismatch
        - invalid
    summary:
      type: string
  required:
    - customer_id
    - customer_name
    - status
    - summary

local:
  handler: tools/salon.py

interruption: provider_default
effect: returns_data
