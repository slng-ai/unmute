# Minimal phone agent for telephony testing, both directions.
# It only greets and chats: no tools, no tasks, no transfer, so nothing here
# needs a capability that either Twilio route lacks. Both directions are
# declared under channels.phone, which is what makes this package able to test a
# call coming in and a call going out with the same agent.
version: 1
entry_agent: greeter

# Every environment variable this package needs you to set, in one list: model
# keys, and the carrier credentials the two connections name. It does not list
# names the runtime supplies for you — REDIS_URL and UNMUTE_PUBLIC_URL come from
# `unmute dev` locally and from the operator at deploy time.
secrets:
  - OPENAI_API_KEY
  - SLNG_API_KEY
  # connections/twilio_voice.yaml — the Twilio REST account, used by pipecat
  - TWILIO_ACCOUNT_SID
  - TWILIO_AUTH_TOKEN
  - TWILIO_PHONE_NUMBER
  # connections/twilio_sip.yaml — the Elastic SIP trunk, used by livekit
  - SIP_TRUNK_HOSTNAME
  - SIP_AUTH_USERNAME
  - SIP_AUTH_PASSWORD
  - SIP_FROM_NUMBER

models:
  think:
    reasoning:
      provider: openai
      model: gpt-5.6-terra
      params:
        # A reasoning model answering with function tools on chat completions
        # needs this exact value, or OpenAI returns 400 on every turn.
        reasoning_effort: "none"
  speak:
    voice:
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
  listen:
    transcriber:
      provider: slng
      model: "slng/deepgram/nova:3-en"
  turn:
    detector:
      provider: local
      model: silero

agents:
  greeter:
    instructions: instructions.md
    model: reasoning
    voice: voice

conversation:
  greeting:
    speaks_first: agent
    text: "Hi, you have reached the Unmute test line. How are you today?"
  interruption:
    enabled: true

channels:
  web:
    kind: realtime_audio
  phone:
    kind: telephony
    inbound: true
    outbound: true

capacity:
  peak_sessions: 2
  max_sessions: 4
  peak_starts_per_second: 1
  avg_session_duration: 2m
