# Twilio's REST account credentials, used by the pipecat target here.
# Values are environment variable names, never secrets.
#
# The same three names ../pipecat-human-transfer-twilio uses, so one .env drives
# every Pipecat Twilio example in this repository. The livekit target in this
# package reads ./twilio_sip.yaml instead: its route dials through a trunk, not
# through this API.
#
# from_number is the caller identity the recipient sees: a voice-capable number
# you own in this account (or a caller ID verified on it). The same number
# receives calls, which is why one value serves both directions.
#
# Twilio streams the call's audio straight to Pipecat Cloud, named by a static
# TwiML Bin. Nothing of yours is hosted, in production or ever.
transport: cloud-websocket
carrier: twilio
environment:
  account_sid: TWILIO_ACCOUNT_SID
  auth_token: TWILIO_AUTH_TOKEN
  from_number: TWILIO_PHONE_NUMBER
