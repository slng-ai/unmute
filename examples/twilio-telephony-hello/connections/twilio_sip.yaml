# Twilio Elastic SIP Trunking, the account side of the LiveKit target here.
# Values are environment variable names, never secrets.
#
# This is a second Twilio credential group, not a second Twilio account. The
# ../twilio_voice.yaml trio identifies your account to Twilio's REST API; these
# four are the trunk's own dial-out settings, which live in a different part of
# the console (Elastic SIP Trunking > Manage > Trunks). One number can serve both
# targets, one target at a time.
#
# The names are plain SIP names rather than Twilio ones, because these four are
# standard SIP trunk settings and the same emitted code dials through any SIP
# carrier with them. They are yours to choose: the compiler carries
# whatever you write here through verbatim.
#
# All four reach the deployed agent directly. It dials out by passing them inline
# with the call, so no LiveKit outbound trunk has to be registered first.
#
# A Twilio Elastic SIP Trunk carries the call into LiveKit SIP: the default
# multi-carrier LiveKit route, and the only one with transfer and voicemail
# primitives.
transport: sip
carrier: twilio
environment:
  sip_address: SIP_TRUNK_HOSTNAME
  sip_username: SIP_AUTH_USERNAME
  sip_password: SIP_AUTH_PASSWORD
  from_number: SIP_FROM_NUMBER
