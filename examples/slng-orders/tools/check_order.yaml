# A `local:` tool. The handler runs inside SLNG's sandbox, next to the model
# that calls it, in the region the call is served from — which is the reason to
# put it there rather than behind a webhook of your own.
#
# `input` and `output` are the schemas the model sees and the platform enforces.
# The handler's own type hints have to agree with them: the push step introspects
# the uploaded source, and a mismatch is rejected there rather than at run time.

description: Look up an order by its number and return its status and delivery date.

input:
  type: object
  properties:
    order_number:
      type: string
      description: The order number the caller read out, like A-1001
  required:
    - order_number

output:
  type: object
  properties:
    status:
      type: string
      description: One of packing, shipped, delivered, or unknown
    delivers_on:
      type: string
      description: An ISO date, or an empty string when the order is not found

local:
  handler: tools/check_order.py
  # No dependencies. SLNG's sandbox runs Python 3.14 and already has pydantic,
  # so a handler that needs only those pins nothing. Anything else is an exact
  # `name==version` pin: SLNG builds a locked, hash-verified environment per
  # tool, and a version range cannot be locked.

# Spoken before the call, so the caller hears something while the lookup runs.
announce: One moment while I check that.
interruption: provider_default
effect: returns_data
