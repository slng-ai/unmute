# An order-status agent that runs on SLNG, and ships one tool of its own.
#
# This is the second slng example, and the difference from slng-support is the
# whole point of it. slng-support references only builtins, so its push creates
# nothing: every capability it names already exists in SLNG. This package ships
# a `local:` tool, so the push has real work to do — create the tool in your
# organisation, derive its schema, run it once to prove it works, publish it,
# then attach the published version to the agent.
#
# `check_order` deliberately needs no secret and reaches no network. That keeps
# the walkthrough in docs-site/deploy/slng.mdx followable with nothing set up in
# the dashboard: one API key, one command. A tool that authenticates against a
# real service adds one step, and that step is a Vault entry you create before
# the push, never a value unmute writes.
#
# Same omissions as slng-support, and for the same reasons: no `turn:` section,
# no tasks or transfers, no inactivity or interruption thresholds, no tracing or
# capacity. SLNG owns all of it, so each is refused at validate rather than
# silently dropped.

version: 1

# What this agent is called where it is deployed. The deployed name is this
# joined to the target it was compiled for, so this pushes an agent called
# `acme-orders-slng`. Required on every target: the two names unmute could
# infer instead are not identities, because every package calls its target
# after the platform, and the folder is named by whoever cloned the
# repository.
name: acme-orders
entry_agent: orders

models:
  think:
    reasoning:
      description: answers the caller and calls check_order
      provider: openai
      model: gpt-5.6-luna
  speak:
    front_desk:
      description: warm, concise
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
  listen:
    transcriber:
      description: default STT
      provider: deepgram
      model: slng/deepgram/nova:3-en
      language: en

variables:
  customer_name:
    type: string
    default: there

agents:
  orders:
    instructions: instructions.md
    model: reasoning
    voice: front_desk
    tools:
      - check_order
      - end_call

tools:
  - check_order
  - end_call

conversation:
  greeting:
    speaks_first: agent
    text: "Hi {{customer_name}}, you have reached Acme Orders. Do you have an order number for me?"
  interruption:
    enabled: true

channels:
  web:
    kind: realtime_audio
