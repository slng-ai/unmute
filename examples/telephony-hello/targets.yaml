# Two Twilio telephony targets against the same inbound+outbound agent, both
# driven by one .env (the Twilio account trio + model keys):
#   pipecat: carrier-websocket over Twilio Media Streams.
#   livekit: the LiveKit Twilio connector, also Twilio Media Streams, bridged
#            into a local LiveKit room. Both test fully on a laptop through the
#            managed tunnel; neither needs a SIP trunk or public SIP/RTP.
targets:
  pipecat:
    provider: pipecat
    version: "1.5.0"
    transport: carrier-websocket
    carrier: twilio
    connection: twilio_voice

  livekit:
    provider: livekit
    version: "1.5.2"
    sdk_language: python
    transport: connector
    carrier: twilio
    connection: twilio_voice
    models:
      detector: { provider: livekit, model: turn-detector-mini }
