# One agent whose only tool is a remote MCP server: Firecrawl's web search.
version: 1
entry_agent: researcher

secrets:
  - OPENAI_API_KEY
  - SLNG_API_KEY
  - FIRECRAWL_MCP_URL
  - FIRECRAWL_API_KEY

models:
  think:
    reasoning:
      provider: openai
      model: gpt-5.6-terra
      params:
        # A reasoning model answering with function tools on chat completions
        # needs this exact value, or OpenAI returns 400 on every turn.
        reasoning_effort: "none"
  speak:
    voice:
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
  listen:
    transcriber:
      provider: slng
      model: "slng/deepgram/nova:3-en"
  turn:
    detector:
      provider: local
      model: silero

agents:
  researcher:
    instructions: instructions.md
    model: reasoning
    voice: voice
    tools:
      - web_search

tools:
  - web_search

conversation:
  greeting:
    speaks_first: agent
    text: "Hi, I can look things up on the web for you. What would you like to know?"
  interruption:
    enabled: true

channels:
  web:
    kind: realtime_audio

capacity:
  peak_sessions: 2
  max_sessions: 5
  avg_session_duration: 3m
