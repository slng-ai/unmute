description: >-
  Cancel one Sage and Stone appointment only after customer identification and
  the caller's explicit confirmation. Use the existing appointment_id supplied
  by the caller; never invent one or use a placeholder.

input:
  type: object
  properties:
    appointment_id:
      type: string
      description: Appointment ID to cancel
  required:
    - appointment_id

output:
  type: object
  properties:
    appointment_id:
      type: string
    status:
      type: string
  required:
    - appointment_id
    - status

execution: local
handler: tools/cancel_appointment.py
interruption: provider_default
effect: returns_data
