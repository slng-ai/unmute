description: >-
  Book one caller-selected Sage and Stone slot. Use the exact customer_id
  returned by customer lookup or creation and the exact slot_id returned by
  availability. Never invent either ID or use a placeholder.

input:
  type: object
  properties:
    customer_id: { type: string, description: ID returned by a customer tool }
    service:
      type: string
      enum: [haircut, hair-color, blowout]
    slot_id: { type: string, description: ID returned by check_availability }
  required: [customer_id, service, slot_id]

output:
  type: object
  properties:
    appointment_id: { type: string }
    status: { type: string }
  required: [appointment_id, status]

local:
  handler: tools/book_appointment.py

interruption: provider_default
effect: returns_data
