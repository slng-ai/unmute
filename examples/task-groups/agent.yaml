# One agent delegates three ordered appointment tasks with shared context.
version: 1
entry_agent: appointment_desk

secrets:
  - OPENAI_API_KEY
  - SLNG_API_KEY

models:
  think:
    reasoning:
      provider: openai
      model: gpt-5.6-luna
  speak:
    voice:
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
  listen:
    transcriber:
      provider: slng
      model: "slng/deepgram/nova:3-en"
  turn:
    detector:
      provider: local
      model: silero

agents:
  appointment_desk:
    instructions: instructions.md
    model: reasoning
    voice: voice
    tools:
      - manage_appointment

tasks:
  identify_customer:
    instructions: tasks/identify-customer.md
    tools:
      - lookup_customer
      - create_customer
    result:
      action: string
      customer_id: string
      customer_name: string
      existing_appointment_id: string
    context:
      history: full

  select_appointment:
    instructions: tasks/select-appointment.md
    tools:
      - check_availability
    result:
      service: string
      slot_id: string
      start_time: string
    context:
      history: full

  finalize_appointment:
    instructions: tasks/finalize-appointment.md
    tools:
      - book_appointment
      - cancel_appointment
    result:
      action: string
      status: string
      appointment_id: string
    context:
      history: full

task_groups:
  appointment_flow:
    steps:
      - identify_customer
      - select_appointment
      - finalize_appointment
    context_scope: shared
    then: return
    merge: results

controls:
  manage_appointment:
    kind: delegate
    group: appointment_flow
    when: The caller wants to book, reschedule, or cancel an appointment.

tools:
  - lookup_customer
  - create_customer
  - check_availability
  - book_appointment
  - cancel_appointment

conversation:
  greeting:
    speaks_first: agent
    text: "Hi, this is Sage and Stone Salon. How can I help with your appointment?"
  interruption:
    enabled: true

channels:
  web:
    kind: realtime_audio

capacity:
  peak_sessions: 5
  max_sessions: 10
  avg_session_duration: 5m
