description: >-
  Record the verified customer's complaint after enough facts are known. This
  does not replace a requested manager transfer.

input:
  type: object
  properties:
    customer_phone:
      type: string
      description: >-
        The caller's number exactly as find_or_create_customer returned it, in
        E.164: a plus sign then digits, with no spaces. Copy it, never retype it.
    summary:
      type: string
      description: Short factual summary of the complaint
    requested_resolution:
      type: string
      description: What the customer wants the salon to do, or an empty string
  required:
    - customer_phone
    - summary
    - requested_resolution

output:
  type: object
  properties:
    complaint_id:
      type: string
    status:
      type: string
      enum:
        - recorded
        - invalid
        - customer_not_found
    complaint:
      type: object
      description: >-
        The saved complaint, present and complete on success and absent
        otherwise. The tool writes it, so take it as it is.
      properties:
        complaint_id:
          type: string
        summary:
          type: string
        requested_resolution:
          type: string
  required:
    - complaint_id
    - status

local:
  handler: tools/salon.py

interruption: provider_default
effect: returns_data

announce: Let me get that written down.
