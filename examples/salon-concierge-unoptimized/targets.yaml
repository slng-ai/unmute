channels:
  - name: web
    kind: realtime_audio
  - name: phone
    kind: telephony
    inbound: true
    outbound: false

capacity:
  peak_sessions: 5
  max_sessions: 10
  peak_starts_per_second: 1
  avg_session_duration: 5m

targets:
  livekit:
    provider: livekit
    version: "1.8.8"
    sdk_language: python
    connection: twilio_sip
    deployment_region: eu-central
    models:
      detector:
        provider: livekit
        model: turn-detector-mini
        endpointing_delay: 300ms

  pipecat:
    provider: pipecat
    version: "1.12.0"
    connection: twilio_voice
    deployment_region: eu-central
    warm_instances: 1
    models:
      detector:
        provider: local
        model: silero
        endpointing_delay: 200ms
