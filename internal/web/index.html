<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>unmute dev</title>
<style>
  :root{
    --bg:oklch(0.178 0.008 96);
    --surface:oklch(0.224 0.009 96);
    --surface-2:oklch(0.252 0.010 96);
    --border:oklch(0.320 0.010 96);
    --text:oklch(0.930 0.010 96);
    --muted:oklch(0.660 0.012 96);
    --faint:oklch(0.500 0.011 96);
    --accent:oklch(0.895 0.165 96);
    --accent-ink:oklch(0.180 0.010 96);
    --danger:oklch(0.640 0.165 28);
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --ease:cubic-bezier(0.16,1,0.3,1);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--mono);font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;min-height:100%;
  }
  main{
    flex:1;width:100%;max-width:880px;margin:0 auto;
    padding:24px 24px 32px;display:flex;flex-direction:column;gap:20px;
    min-height:0; /* let transcript scroll inside flexbox */
  }

  /* ── views ───────────────────────────────────────────────
     Header and controls sit outside: a control that disappears when you switch
     view is the same defect as a control labelled with its action. Switching is
     state, never navigation — tearing the page down would end the call. */
  .views{flex:1;min-height:0;display:flex;flex-direction:column}
  .view{flex:1;min-height:0;display:none;flex-direction:column;gap:20px}
  .view[data-active="true"]{display:flex}

  /* ── view switch ──────────────────────────────────────────
     A segmented control, not a rail: two destinations do not earn a permanent
     vertical gutter, and the page is one centred column. */
  .viewtabs{display:flex;gap:2px;padding:2px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
  .vtab{
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    display:flex;align-items:center;gap:6px;
    padding:5px 10px;border:0;border-radius:6px;cursor:pointer;
    background:transparent;color:var(--muted);
    transition:background .18s var(--ease),color .18s var(--ease);
  }
  .vtab:hover{color:var(--text)}
  .vtab[aria-selected="true"]{background:var(--surface-2);color:var(--text)}
  .vtab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* the flagged count rides the tab, so it is visible from either view */
  .badge{
    font-size:10px;letter-spacing:0;padding:1px 5px;border-radius:99px;
    background:var(--danger);color:var(--accent-ink);font-weight:700;
  }
  .badge[hidden]{display:none}

  /* ── log view ────────────────────────────────────────────── */
  .logtools{display:flex;gap:10px;align-items:center;flex:none}
  #logfilter{
    flex:1;min-width:0;font-family:var(--mono);font-size:13px;
    padding:9px 12px;border-radius:9px;
    border:1px solid var(--border);background:var(--surface);color:var(--text);
  }
  #logfilter::placeholder{color:var(--faint)}
  #logfilter:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .kinds{display:flex;gap:2px;padding:2px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
  .kind{
    font-family:var(--mono);font-size:11px;letter-spacing:.06em;
    padding:5px 9px;border:0;border-radius:6px;cursor:pointer;
    background:transparent;color:var(--muted);
  }
  .kind[aria-pressed="true"]{background:var(--surface-2);color:var(--text)}
  .kind:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .logpane{
    flex:1;min-height:0;display:flex;
    border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden;
  }
  .loglist{
    flex:1;overflow:auto;overscroll-behavior:contain;padding:12px 14px;
    font-size:12.5px;line-height:1.5;
    scrollbar-width:thin;scrollbar-color:var(--border) transparent;
  }
  .loglist::-webkit-scrollbar{width:8px;height:8px}
  .loglist::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  .logrow{
    display:block;white-space:pre-wrap;overflow-wrap:anywhere;
    color:var(--muted);padding:1px 0;
  }
  .logrow.flagged{color:var(--danger)}
  .logrow.metric{color:var(--accent)}
  .logempty{color:var(--faint);font-size:12.5px;letter-spacing:.04em;padding:8px 0}

  /* ── top bar ─────────────────────────────────────────── */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .status{display:flex;align-items:center;gap:10px;min-width:0}
  .dot{
    width:9px;height:9px;border-radius:50%;flex:none;
    background:var(--muted);transition:background .22s var(--ease);
  }
  .statusline{
    font-size:12.5px;letter-spacing:.04em;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .statusline .sep{color:var(--border);margin:0 .3em}
  .statusline b{color:var(--text);font-weight:600}
  .logo{height:26px;width:auto;display:block;flex:none}

  /* ── stage: dominant when idle, tucks under header when connected ─ */
  .stage{
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:28px;text-align:center;
    transition:gap .25s var(--ease);
  }
  .state{
    font-size:40px;font-weight:600;letter-spacing:-.01em;
    color:var(--muted);transition:color .22s var(--ease),font-size .25s var(--ease);
  }
  .state .cursor{color:var(--border);font-weight:400}
  .hint{font-size:13px;color:var(--muted);min-height:1.2em;transition:opacity .22s var(--ease)}

  /* meter: live conversation level (mic + agent) */
  .meter{display:flex;align-items:flex-end;gap:4px;height:64px;transition:height .25s var(--ease)}
  .meter i{
    display:block;width:5px;height:100%;border-radius:2px;
    background:var(--border);
    transform:scaleY(.08);transform-origin:bottom;
    transition:transform .09s linear,background .22s var(--ease);
  }

  /* ── transcript ──────────────────────────────────────── */
  .transcript{
    flex:1;min-height:0;display:none;flex-direction:column;
    border:1px solid var(--border);border-radius:12px;background:var(--surface);
    overflow:hidden;
  }
  body[data-state="connected"] .transcript,
  body[data-has-history="true"] .transcript{display:flex}

  .conversation-scroll{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  #diagnostics{flex:none;max-height:35%;overflow-y:auto;border-top:1px solid var(--border);padding:5px 18px}
  #diagnostics[hidden],.exchange[hidden],.exchange-content:empty{display:none}
  #diagnostic-list{display:flex;flex-direction:column;gap:8px}
  .tlist{
    flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;overflow-anchor:none;
    padding:18px 18px 12px;display:flex;flex-direction:column;gap:10px;
    scrollbar-width:thin;scrollbar-color:var(--border) transparent;
  }
  .tlist::-webkit-scrollbar{width:8px}
  .tlist::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

  .turn{display:flex;flex-direction:column;gap:4px;max-width:100%}
  .who{
    font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--faint);font-weight:600;
  }
  .said{
    font-size:14.5px;line-height:1.55;color:var(--text);
    word-wrap:break-word;overflow-wrap:anywhere;
  }
  .turn.you .said{color:var(--text)}
  .turn.bot .said{color:var(--accent)}
  .exchange{flex:none;min-width:0;display:flex;flex-direction:column;gap:6px}
  .exchange-content{display:flex;flex-direction:column;gap:10px}
  .exchange-status{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
  .said{white-space:pre-wrap}
  .segment[data-state="provisional"]{color:var(--muted)}
  .segment[data-state="provisional"]::after{content:" …";color:var(--faint)}
  .segment[data-state="incomplete"]{text-decoration:underline dotted var(--muted);text-underline-offset:4px}

  .tempty{
    margin:auto;padding:24px;text-align:center;color:var(--faint);
    font-size:12.5px;letter-spacing:.04em;
  }

  .activity,.measurements{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
  .activity:empty{display:none}
  .activity{display:flex;flex-direction:column;gap:6px}
  .operation{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
  .operation-metrics{display:flex;flex-wrap:wrap;gap:4px 14px}
  .operation-metrics .measurement{padding:0}
  .metrics-summary{font-size:11.5px;color:var(--text)}
  .feed-bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px}
  .metrics-guide{font-size:11px;color:var(--muted)}
  .metrics-guide:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .activity [data-state="running"]{color:var(--text)}
  .measurements summary{cursor:pointer;padding:4px 0;color:var(--muted)}
  .measurements summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .measurement{padding:5px 0;display:flex;flex-direction:column;gap:2px}
  .measurement-label{color:var(--text)}
  .source-note{white-space:pre-line}
  .measurement-note,.source-note{font-size:10.5px;color:var(--muted)}
  [id="feed-status"]{font-size:11px;color:var(--muted);overflow-wrap:anywhere}

  /* compact mode when conversation is active: shrink the stage out of the way */
  body[data-state="connected"] .state{font-size:22px}
  body[data-state="connected"] .stage{gap:14px}
  body[data-state="connected"] .meter{height:36px}
  body[data-state="connected"] .hint{opacity:0;min-height:0;height:0;margin:0}
  body[data-state="connected"] .stage,body[data-has-history="true"] .stage{
    flex:none;flex-direction:row;justify-content:space-between;gap:12px;
  }
  body[data-state="connected"] .state,body[data-has-history="true"] .state{font-size:16px}
  body[data-state="connected"] .meter,body[data-has-history="true"] .meter{height:18px}
  body[data-has-history="true"] .hint{display:none}
  .transcript{position:relative}
  .tlist{padding-bottom:50px}
  #latest{position:absolute;right:10px;bottom:10px;padding:5px 10px;font-size:11px;z-index:1}
  #latest[hidden]{display:none}
  #latest:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ── controls ────────────────────────────────────────── */
  .controls{display:flex;flex-direction:column;gap:12px;flex:none}
  .btnrow{display:flex;gap:12px}
  .btn,#connect,#mute{
    font-family:var(--mono);font-size:15px;font-weight:600;
    letter-spacing:.01em;cursor:pointer;
    padding:13px 18px;border-radius:9px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);
    transition:background .22s var(--ease),color .22s var(--ease),
               border-color .22s var(--ease),opacity .22s var(--ease);
  }
  #connect:focus-visible,#mute:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #mute[disabled]{opacity:.4;cursor:not-allowed}
  #connect{flex:1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  #connect:hover:not([disabled]){background:oklch(0.92 0.165 96)}
  /* Nothing to connect to yet: the page is served before the runtime exists. */
  #connect[disabled]{opacity:.4;cursor:not-allowed}

  /* ── microphone: a state readout, not a verb ──────────────
     Uppercase and letter-spaced like .who so it reads as a status line rather
     than a second action button sitting next to the real one. */
  #mute{
    flex:none;position:relative;overflow:hidden;
    display:flex;align-items:center;gap:8px;
    font-size:12.5px;letter-spacing:.1em;
  }
  .mic-glyph{font-size:10px;line-height:1}
  #mute[data-mic="live"]{
    background:var(--accent);color:var(--accent-ink);border-color:var(--accent);
  }
  #mute[data-mic="muted"]{
    background:transparent;color:var(--muted);border-color:var(--border);font-weight:500;
  }
  #mute[data-mic="unavailable"]{
    background:transparent;color:var(--faint);border-color:var(--border);font-weight:500;
  }
  #mute[data-mic="unavailable"] .mic-glyph{visibility:hidden}  /* keeps the width, drops the mark */

  /* input level, inside the control it describes */
  .mic-level{position:absolute;left:0;right:0;bottom:0;height:2px;pointer-events:none}
  .mic-level i{
    display:block;height:100%;width:100%;background:var(--accent-ink);opacity:.5;
    transform:scaleX(0);transform-origin:left;transition:transform .07s linear;
  }
  /* The level is driven by an inline transform, which outranks any rule here, so
     renderMic() zeroes it on leaving `live` rather than a selector doing it. */

  /* mic selector — shown only when ≥2 inputs exist (pipecat transport only) */
  .microw{
    display:flex;align-items:center;gap:10px;
    border:1px solid var(--border);background:var(--surface);
    border-radius:9px;padding:0 14px;
  }
  .microw[hidden]{display:none}
  .mic-lab{font-size:12px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
  #micsel{
    appearance:none;-webkit-appearance:none;flex:1;min-width:0;
    background:transparent;border:0;color:var(--text);
    font-family:var(--mono);font-size:13px;padding:12px 0;cursor:pointer;outline:none;
    text-overflow:ellipsis;
  }
  #micsel:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:2px}
  .caret{color:var(--muted);font-size:11px;pointer-events:none}

  /* ── state styling, keyed off body[data-state] ───────── */
  body[data-state="connecting"] .dot{background:var(--accent);animation:pulse 1.1s var(--ease) infinite}
  body[data-state="connecting"] .state{color:var(--text)}

  body[data-state="connected"] .dot{background:var(--accent)}
  body[data-state="connected"] .state{color:var(--accent)}
  body[data-state="connected"] .meter i{background:var(--accent)}
  body[data-state="connected"] #connect{background:transparent;color:var(--text);border-color:var(--border)}
  body[data-state="connected"] #connect:hover{border-color:var(--muted);background:var(--surface)}

  body[data-state="error"] .dot{background:var(--danger)}
  body[data-state="error"] .state{color:var(--danger)}

  /* muted: mic is off — dim the meter. The control dims itself via data-mic. */
  body.muted[data-state="connected"] .meter i{opacity:.5}

  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  @media (max-width:520px){
    main{padding:16px;gap:12px}
    .bar{flex-wrap:wrap;gap:10px}
    .status{flex:1}
    .viewtabs{order:1;width:100%}
    .vtab{flex:1;justify-content:center}
    .logtools{flex-wrap:wrap}
    #logfilter{flex-basis:100%}
    .view{gap:12px}
    .tlist{padding:12px 12px 50px}
    .btnrow{gap:8px}
    #connect,#mute{padding:12px}
    .state{font-size:30px}
  }

  @media (prefers-reduced-motion:reduce){
    .dot{animation:none!important}
    .meter i{transition:background .22s var(--ease)}
    .state,.meter,.hint,.transcript{transition:none!important}
  }
</style>
</head>
<body data-state="idle">
  <main>
    <header class="bar">
      <div class="status">
        <span class="dot" aria-hidden="true"></span>
        <span class="statusline">unmute dev<span class="sep">//</span><b id="agent">agent</b></span>
      </div>
      <div class="viewtabs" role="tablist" aria-label="View">
        <button class="vtab" type="button" role="tab" data-view="conversation" aria-selected="true">conversation</button>
        <button class="vtab" type="button" role="tab" data-view="logs" aria-selected="false">
          logs<span class="badge" id="flagcount" hidden>0</span>
        </button>
      </div>
      <img class="logo" src="logo.svg" alt="Unmute">
    </header>

    <div class="feed-bar">
    <div id="feed-status" role="status" aria-live="polite">Live data connecting</div>
    <a class="metrics-guide" href="https://unmute.ai/optimization/latency" target="_blank" rel="noopener">How to read latency ↗</a>
    </div>
    <div class="views" id="views">
      <div class="view" id="view-conversation" data-view="conversation" data-active="true">
        <section class="stage">
          <div class="state" id="state" aria-live="polite" role="status">ready</div>
          <div class="meter" id="meter" aria-hidden="true"></div>
          <p class="hint" id="hint">press connect and talk to your agent</p>
        </section>

        <section class="transcript" aria-label="Conversation transcript">
          <div class="conversation-scroll">
            <div class="tlist" id="tlist"></div>
            <button id="latest" class="btn" type="button" hidden>Latest</button>
          </div>
          <details id="diagnostics" class="measurements" hidden>
            <summary>Call diagnostics</summary>
            <div id="diagnostic-list"></div>
          </details>
        </section>
      </div>

      <div class="view" id="view-logs" data-view="logs">
        <div class="logtools">
          <input id="logfilter" type="search" placeholder="filter output" aria-label="Filter output" autocomplete="off">
          <div class="kinds" role="group" aria-label="Kind">
            <button class="kind" type="button" data-kind="all" aria-pressed="true">all</button>
            <button class="kind" type="button" data-kind="output" aria-pressed="false">output</button>
            <button class="kind" type="button" data-kind="metric" aria-pressed="false">metrics</button>
            <button class="kind" type="button" data-kind="flagged" aria-pressed="false">problems</button>
          </div>
        </div>
        <section class="logpane" aria-label="Run output">
          <div class="loglist" id="loglist"></div>
        </section>
      </div>
    </div>

    <footer class="controls">
      <label class="microw" id="microw" hidden>
        <span class="mic-lab">input //</span>
        <select id="micsel" aria-label="Microphone"></select>
        <span class="caret" aria-hidden="true">▾</span>
      </label>
      <div class="btnrow">
        <button id="connect" type="button">connect</button>
        <button id="mute" type="button" data-mic="unavailable" disabled
                aria-live="polite" title="M to toggle, hold SPACE to talk">
          <span class="mic-glyph" aria-hidden="true">○</span>
          <span class="mic-text">MIC —</span>
          <span class="mic-level" aria-hidden="true"><i id="miclevel"></i></span>
        </button>
      </div>
    </footer>
  </main>
  <audio id="remote" autoplay></audio>

<script>
"use strict";
// One page, two transports. `GET /api/session` returns {kind}: the CLI picks
// pipecat (WebRTC offer proxied to the containerized bot) or livekit (join a
// room with the JS SDK). Everything below the transport adapter is shared UI.
//
// Visual-preview switch: build flips this to true for the standalone mockup so
// the connected UI is viewable without a running agent. Shipped client = false.
// ponytail: one constant + one simulate() branch — the alternative is a second file.
const DEMO = false;

const q = new URLSearchParams(location.search);
const AGENT = q.get("agent") || "agent";
const BARS = 24;

const el = {
  body: document.body,
  state: document.getElementById("state"),
  hint: document.getElementById("hint"),
  connect: document.getElementById("connect"),
  mute: document.getElementById("mute"),
  meter: document.getElementById("meter"),
  remote: document.getElementById("remote"),
  agent: document.getElementById("agent"),
  microw: document.getElementById("microw"),
  micsel: document.getElementById("micsel"),
  micText: document.querySelector("#mute .mic-text"),
  micGlyph: document.querySelector("#mute .mic-glyph"),
  micLevel: document.getElementById("miclevel"),
  tlist: document.getElementById("tlist"),
  transcript: document.querySelector('.transcript'),
  diagnostics: document.getElementById('diagnostics'),
  diagnosticList: document.getElementById('diagnostic-list'),
  loglist: document.getElementById("loglist"),
  logfilter: document.getElementById("logfilter"),
  flagcount: document.getElementById("flagcount"),
  feed: document.getElementById('feed-status'),
  latest: document.getElementById('latest'),
};
el.agent.textContent = AGENT;

const bars = Array.from({length: BARS}, () => {
  const i = document.createElement("i");
  el.meter.appendChild(i);
  return i;
});

let transport = null;                 // "webrtc-offer" | "livekit" while connected
let pc = null, mic = null, pcId = null, dc = null;   // pipecat transport
let room = null;                                     // livekit transport
let audioCtx = null, analyser = null, micNode = null, remoteNode = null, raf = 0;
let micAnalyser = null;                               // mic-only tap, drives the level in the control
let muted = false, selectedDeviceId = null;
let micState = "unavailable";                         // "unavailable" | "live" | "muted"
let holding = false, heldWasMuted = false;            // hold-to-talk
// ── views ───────────────────────────────────────────────
// State, not navigation: tearing the page down would end the call, so there is
// no router and no second document. The session controls live outside both views.
let currentView = "conversation";
let viewPinned = false;              // the author chose; stop moving it for them
let savedReading = null;
const tabs = Array.from(document.querySelectorAll(".vtab"));

function showView(name, byUser){
  if (byUser) viewPinned = true;
  if (currentView==='conversation' && name!=='conversation') savedReading=readingPosition();
  currentView = name;
  for (const view of document.querySelectorAll(".view"))
    view.dataset.active = String(view.dataset.view === name);
  for (const tab of tabs)
    tab.setAttribute("aria-selected", String(tab.dataset.view === name));
  if (name === "logs") renderLog();
  else restoreReading(savedReading);
}
for (const tab of tabs)
  tab.addEventListener("click", () => { showView(tab.dataset.view, true); });

// ── run output ──────────────────────────────────────────
// The run's lifecycle drives what is in front, because the first thing worth
// looking at before a runtime exists is the reason it does not exist yet.
const LOG_MAX = 2000;
const logRows = [];                  // {kind:"output"|"metric", text, flagged}
let flagged = 0;
let ready = false;

function setRunState(state){
  el.connect.disabled = !transport && !connecting && !ready && state !== "ready";
  if (state === "ready"){
    ready = true;
    el.connect.disabled = false;
    // Move to the conversation once there is one to have, unless something went
    // wrong on the way up, in which case the output is the more useful view.
    if (!viewPinned && !flagged) showView("conversation");
  } else if (state === "failed"){
    ready = false;
    el.connect.disabled = !transport && !connecting;
    if (!transport) setState("error", "error", "the agent did not start; see the output");
    if (!viewPinned) showView("logs");
  } else if (!viewPinned && currentView !== "logs"){
    showView("logs");
  }
}

function pushLogRow(row){
  logRows.push(row);
  if (logRows.length > LOG_MAX) logRows.shift();   // oldest end, as with the server's buffer
  if (row.flagged){
    flagged++;
    el.flagcount.textContent = String(flagged);
    el.flagcount.hidden = false;
  }
  if (currentView === "logs") renderLog();
}

// One compact line per record, so the log view answers "was it slow" without
// leaving it.
function metricText(rec){
  if (!rec) return "";
  if (rec.version === 2){
    const prefix = rec.call_id+' · '+rec.id+' · ';
    if (rec.operation) return prefix+[rec.operation.type,rec.operation.name,rec.operation.state,rec.operation.model,rec.operation.provider,rec.operation.source_request_id].filter(Boolean).join(' · ');
    if (rec.measurement){
      const m=rec.measurement;
      if (m.state!=='measured') return '';
      return prefix+m.scope+' · '+m.metric.replaceAll('_',' ')+' '+secs(m.value)+' · '+
        [m.source,m.model,m.provider,m.operation_id,m.exchange_id,m.reason].filter(Boolean).join(' · ');
    }
    if (rec.call) return prefix+rec.call.state;
    return ''; // raw transcript snapshots remain in dev.log, not repeated here
  }
  if (rec.kind === "session")
    return "session · first speech " + secs(rec.first_speech);
  const parts = ["turn " + (rec.seq || "?")];
  if (rec.e2e != null) parts.push("e2e " + secs(rec.e2e));
  for (const stage of rec.stages || []){
    // This line is about time, so a stage that reported none is left out of it.
    // Which model was in use belongs beside the turn, not here.
    if (stage.ttfb == null && stage.total == null) continue;
    const bits = [stage.kind];
    if (stage.ttfb != null) bits.push(secs(stage.ttfb));
    if (stage.total != null) bits.push("total " + secs(stage.total));
    parts.push(bits.join(" "));
  }
  for (const tool of rec.tools || []) parts.push(tool.name + " " + secs(tool.seconds));
  if (rec.interrupted) parts.push("interrupted");
  return parts.join("  ·  ");
}
function secs(v){
  if (v == null) return 'not reported';
  if (v === 0) return '0ms';
  if (v < .001) return '<1ms';
  const ms=Math.round(v*1000);
  return ms < 1000 ? ms+'ms' : v.toFixed(2)+'s';
}

function logMatches(row, needle, kind){
  if (kind === "output" && row.kind !== "output") return false;
  if (kind === "metric" && row.kind !== "metric") return false;
  if (kind === "flagged" && !row.flagged) return false;
  return !needle || row.text.toLowerCase().includes(needle);
}

function renderLog(){
  const needle = el.logfilter.value.trim().toLowerCase();
  const kind = document.querySelector(".kind[aria-pressed='true']").dataset.kind;
  const atBottom = el.loglist.scrollHeight - el.loglist.scrollTop - el.loglist.clientHeight < 80;
  const frag = document.createDocumentFragment();
  let shown = 0;
  for (const row of logRows){
    if (!logMatches(row, needle, kind)) continue;
    const line = document.createElement("span");
    line.className = "logrow" + (row.flagged ? " flagged" : "") + (row.kind === "metric" ? " metric" : "");
    line.textContent = row.text;
    frag.appendChild(line);
    shown++;
  }
  el.loglist.replaceChildren(frag);
  if (!shown){
    const empty = document.createElement("div");
    empty.className = "logempty";
    empty.textContent = logRows.length ? "nothing matches that filter" : "waiting for output…";
    el.loglist.appendChild(empty);
  }
  if (atBottom) el.loglist.scrollTop = el.loglist.scrollHeight;
}

el.logfilter.addEventListener("input", renderLog);
for (const button of document.querySelectorAll(".kind")){
  button.addEventListener("click", () => {
    for (const other of document.querySelectorAll(".kind"))
      other.setAttribute("aria-pressed", String(other === button));
    renderLog();
  });
}

// EventSource, not a WebSocket: it reconnects on its own and replays with
// Last-Event-ID, which is exactly the behaviour the server's buffer expects.
function startEventStream(){
  if (DEMO || !window.EventSource) return;
  const es = new EventSource("/api/events");
  es.addEventListener('open',()=>{feedFresh=true;renderFeed();});
  es.addEventListener('error',()=>{feedFresh=false;renderFeed();});
  es.addEventListener("message", (e) => {
    let ev;
    try { ev = JSON.parse(e.data); } catch { historyGap=true;renderFeed();return; }
    if (ev.stream_id && ev.stream_id!==feedStream){
      if (feedStream && selectedCallID) historyGap=true;
      feedStream=ev.stream_id;feedSequence=0;
    }
    if (ev.seq){
      if (ev.seq<=feedSequence) return;
      if (feedSequence && ev.seq!==feedSequence+1) historyGap=true;
      feedSequence=ev.seq;
    }
    if (ev.t==='gap' || ev.reason) historyGap=true;
    feedFresh=true;
    renderFeed();
    if (ev.t === "state") setRunState(ev.state);
    else if (ev.t === "log") pushLogRow({kind:"output", text: ev.text || "", flagged: !!ev.flagged});
    else if (ev.t === "metric"){
      const text=metricText(ev.record);
      if (text) pushLogRow({kind:"metric", text, flagged:false});
      attachRecord(ev.record);
    }
  });
}

function setState(s, label, hint){
  el.body.dataset.state = s;
  el.state.innerHTML = label + (s === "idle" ? ' <span class="cursor">▍</span>' : "");
  if (hint !== undefined) el.hint.textContent = hint;
}
function setBars(v){ for (const b of bars) b.style.transform = `scaleY(${Math.max(0.08, v)})`; }
function audioConstraint(){ return selectedDeviceId ? { deviceId: { exact: selectedDeviceId } } : true; }

// Identified snapshots are the sole dev conversation source. Audio callbacks
// retain connection and playback duties; they never guess which row owns text.
let selectedCallID = null, connectionGeneration = 0, connecting = false;
let locallyEnded = false;
let feedFresh=false, historyGap=false, feedStream=null, feedSequence=0;
const records = new Map(), recordNodes = new Map(), exchangeNodes = new Map(), messageNodes = new Map();

function node(tag, className, text){
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text !== undefined) element.textContent = text;
  return element;
}
function setText(element, text){
  if (element.textContent !== text) element.textContent = text;
}
function ordered(parent, element, order){
  element.dataset.order = String(order);
  const before = Array.from(parent.children).find(child => child !== element && Number(child.dataset.order) > order) || null;
  if (element.parentNode !== parent || element.nextElementSibling !== before) parent.insertBefore(element, before);
}
function clearTranscript(){
  el.tlist.replaceChildren();
  el.diagnosticList.replaceChildren();
  el.diagnostics.open=false;
  el.diagnostics.hidden=true;
  records.clear(); recordNodes.clear(); exchangeNodes.clear(); messageNodes.clear();
  selectedCallID = null;
  locallyEnded = false;
  historyGap = false;
  renderFeed();
  el.body.dataset.hasHistory = 'false';
  el.latest.hidden=true;
  savedReading={following:true};
}
function nearBottom(){return el.tlist.scrollHeight-el.tlist.scrollTop-el.tlist.clientHeight < 64;}
function readingPosition(){
  if (currentView!=='conversation') return null;
  const {top,bottom}=el.tlist.getBoundingClientRect();
  const selected=window.getSelection()?.anchorNode;
  const selectedElement=selected?.nodeType===1?selected:selected?.parentElement;
  const visible=element=>element && el.tlist.contains(element) && element.getBoundingClientRect().bottom>top && element.getBoundingClientRect().top<bottom;
  // Prefer what the reader selected; an enclosing exchange can grow above it.
  const anchor=visible(selectedElement)?selectedElement:Array.from(el.tlist.querySelectorAll('[data-kind],summary')).find(child=>visible(child)&&child.getBoundingClientRect().top>=top)
    || Array.from(el.tlist.children).find(visible);
  return {following:nearBottom(),anchor,offset:anchor?anchor.getBoundingClientRect().top-top:0};
}
function restoreReading(position){
  if (!position || currentView!=='conversation') return;
  if (position.following) el.tlist.scrollTop=el.tlist.scrollHeight;
  else if (position.anchor?.isConnected) el.tlist.scrollTop+=position.anchor.getBoundingClientRect().top-el.tlist.getBoundingClientRect().top-position.offset;
}
el.latest.addEventListener('click',()=>{el.tlist.scrollTop=el.tlist.scrollHeight;});
el.transcript.addEventListener('click',event=>{
  if (!event.target.closest('summary')) return;
  const reading=readingPosition();
  requestAnimationFrame(()=>restoreReading(reading));
});
function exchangeNode(id, order){
  if (!exchangeNodes.has(id)){
    const element = node('section','exchange');
    element.dataset.exchange = id.startsWith('exchange:') ? id.slice(9) : id;
    const status = node('div','exchange-status');
    const content = node('div','exchange-content');
    const activity = node('div','activity');
    const details = node('details','measurements');
    const summary = node('div','metrics-summary');
    const debugSummary = node('summary',undefined,'Debug details');
    const values = node('div');
    const note = node('p','source-note');
    details.append(debugSummary,values,note);
    details.hidden=true;
    element.append(status,content,summary,activity,details);
    exchangeNodes.set(id,{element,status,content,activity,details,summary,values,note});
    ordered(id==='call-details'||id==='unassigned'?el.diagnosticList:el.tlist,element,order);
  }
  return exchangeNodes.get(id);
}
function renderExchange(id){
  const view = exchangeNodes.get(id);
  if (!view) return;
  const record = records.get(id), data = record?.exchange;
  if (record) ordered(el.tlist,view.element,record.order);
  let state = data?.state || 'unknown';
  if (locallyEnded && state === 'open') state = 'incomplete';
  const assistant = data?.role === 'response' || !!view.content.querySelector('[data-speaker="assistant"]');
  const labels = {open:'generating',ended:'text complete',interrupted:'interrupted',incomplete:'incomplete'};
  let label = ['unknown','open','ended'].includes(state) ? '' : state;
  if (assistant) label = ['generated',labels[state],data?.playback && data.playback!=='unknown' ? 'audio '+data.playback.replaceAll('_',' ') : ''].filter(Boolean).join(' · ');
  if ((!feedFresh||historyGap) && state==='open' && label) label='last known: '+label;
  setText(view.status,label);
  view.status.hidden = !label;
  view.element.dataset.state = state;
}

function renderFeed(){
  const label=(feedFresh?'Live data connected':'Live data reconnecting')+(historyGap?' · incomplete history':'');
  if (el.feed.textContent===label) return;
  const reading=readingPosition();
  setText(el.feed,label);
  for (const id of exchangeNodes.keys()) renderExchange(id);
  renderData();
  restoreReading(reading);
}

// Namespace native IDs separately from display-only groups. IDs are opaque.
function operationGroup(data){return data.exchange_id ? 'exchange:'+data.exchange_id : 'unassigned';}
function measurementGroup(data){
  if (data.scope==='call') return 'call-details';
  const exchangeID=data.exchange_id || records.get('operation:'+data.operation_id)?.operation.exchange_id;
  return exchangeID ? 'exchange:'+exchangeID : 'unassigned';
}
function operationLabel(record){
  const data=record.operation;
  if (data.type!=='llm') return data.type.toUpperCase()+' · '+data.name;
  const peers=Array.from(records.values()).filter(r=>r.operation?.type==='llm' && operationGroup(r.operation)===operationGroup(data)).sort((a,b)=>a.order-b.order);
  return 'LLM '+(peers.findIndex(r=>r.id===record.id)+1);
}
function metricLabel(data, operation){
  if (data.metric==='first_response'){
    if (operation?.type==='tts' || data.source.includes('ttfb')) return 'TTFB';
    if (data.source.includes('ttft')) return 'TTFT';
  }
  return data.metric.replaceAll('_',' ');
}
function renderData(){
  // ponytail: scan retained call snapshots; index per group if long-call replay gets slow.
  const all=Array.from(records.values());
  const focused=document.activeElement;
  const focusedDiagnostics=el.diagnostics.contains(focused);
  let movedFocus=null;
  // Build operation rows before attaching their measurements, even on late association.
  for (const record of all.filter(r=>r.operation).concat(all.filter(r=>r.measurement))){
    const key=record.kind+':'+record.id, data=record[record.kind];
    if (record.measurement && data.state!=='measured'){
      recordNodes.get(key)?.remove();
      continue;
    }
    const groupID=record.operation ? operationGroup(data) : measurementGroup(data);
    const view=exchangeNode(groupID,record.order);
    let row=recordNodes.get(key);
    if (!row){
      row=node('div',record.measurement?'measurement':'operation');
      row.dataset.kind=record.kind;row.dataset.id=record.id;
      row.append(node('span','measurement-label'),node('span',record.operation?'operation-metrics':'measurement-note'));
      recordNodes.set(key,row);
    }
    const previousDetails=row.closest('section')?.querySelector('details');
    if (previousDetails && previousDetails!==view.details){
      if (previousDetails.open) view.details.open=true;
      if (focused===previousDetails.querySelector('summary') ||
          (focused===el.diagnostics.firstElementChild && el.diagnosticList.contains(row))) movedFocus=view.details.querySelector('summary');
    }
    if (record.operation){
      const terminal=locallyEnded || ['ended','interrupted','incomplete'].includes(records.get(groupID)?.exchange.state);
      const state=data.state==='running' ? terminal?'incomplete (last seen running)':(!feedFresh||historyGap)?'last seen running':data.state : data.state;
      row.dataset.state=state;
      setText(row.firstChild,operationLabel(record)+' · '+state);
      ordered(view.activity,row,record.order);
    } else {
      const operation=records.get('operation:'+data.operation_id);
      const label=operation ? operationLabel(operation) : data.source.includes('llm_node_ttft')?'LLM node':data.source.includes('tts_node_ttfb')?'TTS node':({call:'Call',input:'Input',response:'Reply-level',operation:'Operation',unassigned:'Unassigned'})[data.scope];
      const primary=operation && operationGroup(operation.operation)===groupID && (data.metric==='first_response' ||
        (operation.operation.type==='llm' && data.metric==='request_duration') || data.metric==='tool_duration');
      setText(row.firstChild,(primary?'':label+' · ')+metricLabel(data,operation?.operation)+' '+secs(data.value));
      setText(row.lastChild,primary?'':[data.source,data.model,data.provider].filter(value=>value && value!=='unknown').join(' · '));
      row.lastChild.hidden=primary;
      ordered(primary?recordNodes.get('operation:'+operation.id).lastChild:view.values,row,record.order);
    }
  }
  const call=all.find(r=>r.call)?.call;
  for (const [id,view] of exchangeNodes){
    const exchange=records.get(id)?.exchange;
    const operations=all.filter(r=>r.operation && operationGroup(r.operation)===id);
    const measurements=all.filter(r=>r.measurement?.state==='measured' && measurementGroup(r.measurement)===id);
    const response=exchange?.role==='response';
    view.details.hidden=!(operations.length||measurements.length);
    if (response){
      const models=operations.filter(r=>r.operation.type==='llm');
      const complete=locallyEnded||exchange.state!=='open';
      const latency=measurements.find(r=>r.measurement.metric==='reply_latency');
      const count=models.length ? models.length+' model call'+(models.length===1?'':'s')+(historyGap||call?.model_calls!=='known'?' observed':complete?'':' so far') : '';
      setText(view.summary,[latency?'Reply latency '+secs(latency.measurement.value):'',count].filter(Boolean).join(' · ') || 'Response measurements');
    } else setText(view.summary,id==='call-details'?'Call measurements':id==='unassigned'?'Unassigned activity and measurements':'Input measurements');
    view.summary.hidden=!(operations.length||measurements.length);
    view.element.hidden=!(view.content.querySelector('.segment:not([hidden])') || operations.length || measurements.length || (response && exchange.state==='open'));
    setText(view.note,operations.map(r=>[operationLabel(r),r.operation.name,r.operation.model,r.operation.provider,r.operation.source_request_id].filter(value=>value && value!=='unknown').join(' · '))
      .concat(measurements.filter(r=>r.measurement.operation_id).map(r=>{
        const m=r.measurement,op=records.get('operation:'+m.operation_id);
        return [op?operationLabel(op):'',metricLabel(m,op?.operation),m.source,m.model,m.provider].filter(value=>value && value!=='unknown').join(' · ');
      })).join('\n'));
    view.note.hidden=!view.note.textContent;
  }
  for (const [id,view] of exchangeNodes)
    if (!view.content.childNodes.length && !view.activity.childNodes.length && !view.values.childNodes.length && !records.has(id)){
      view.element.remove();exchangeNodes.delete(id);
    }
  el.diagnostics.hidden=!el.diagnosticList.childNodes.length;
  if ((!focused.isConnected || !focused.checkVisibility()) && (movedFocus || focusedDiagnostics))
    (movedFocus || el.connect).focus({preventScroll:true});
}
function renderText(record){
  const data = record.text;
  // ponytail: scan this call's snapshots; index messages if long-call replay makes this hot.
  const siblings = Array.from(records.values()).filter(r => r.text?.message_id === data.message_id && r.text.speaker === data.speaker);
  const parents = new Set(siblings.map(r => r.text.exchange_id).filter(Boolean));
  const exchangeID = data.exchange_id || (parents.size === 1 ? parents.values().next().value : null);
  const groupID = exchangeID ? 'exchange:'+exchangeID : 'unassigned:'+JSON.stringify([data.speaker,data.message_id]);
  const group = exchangeNode(groupID,record.order);
  const messageKey = JSON.stringify([data.speaker,data.message_id,parents.size > 1 ? groupID : '']);
  let message = messageNodes.get(messageKey);
  if (!message){
    const element=node('div','turn '+(data.speaker==='user'?'you':'bot'));
    element.dataset.speaker = data.speaker;
    element.dataset.message = data.message_id;
    const said=node('div','said');
    element.append(node('span','who',data.speaker==='user'?'you':AGENT),said);
    message={element,said,order:record.order};
    messageNodes.set(messageKey,message);
  }
  message.order = Math.min(message.order, record.order);
  ordered(group.content,message.element,message.order);
  let span=recordNodes.get('text:'+record.id);
  if (!span){
    span=node('span','segment');
    span.dataset.kind='text';span.dataset.id=record.id;
    recordNodes.set('text:'+record.id,span);
  }
  span.dataset.state=locallyEnded && data.state==='provisional'?'incomplete':data.state;
  span.hidden = data.text.length === 0;
  setText(span,data.separator_before+data.text);
  ordered(message.said,span,record.order);
  renderExchange(groupID);
}
function attachRecord(record){
  if (!record || record.version!==2 || record.call_id!==selectedCallID) return;
  const key=record.kind+':'+record.id, prior=records.get(key);
  if (prior && record.revision<=prior.revision) return;
  if (prior?.text?.state==='final' && record.text?.state==='provisional') return;
  const reading=readingPosition();
  const selection=window.getSelection();
  const selected=selection && !selection.isCollapsed && el.transcript.contains(selection.anchorNode) && el.transcript.contains(selection.focusNode)
    ? [selection.anchorNode,selection.anchorOffset,selection.focusNode,selection.focusOffset] : null;
  const focused=document.activeElement;
  records.set(key,record);
  if (record.kind==='text'){
    // A proven link on one segment applies to the shared message, even when
    // another segment's later correction has no new association information.
    for (const sibling of records.values())
      if (sibling.text?.message_id === record.text.message_id && sibling.text.speaker === record.text.speaker) renderText(sibling);
    for (const [id,message] of messageNodes) if (!message.said.childNodes.length){message.element.remove();messageNodes.delete(id);}
    for (const [id,view] of exchangeNodes) if (!view.content.childNodes.length && !view.activity.childNodes.length && !view.values.childNodes.length && !records.has(id)){view.element.remove();exchangeNodes.delete(id);}
  }
  else if (record.kind==='exchange'){
    exchangeNode(key,record.order);
    renderExchange(key);
  }
  else if (record.kind==='call'){
    if (record.call.state!=='open') endConversation();
    for (const id of exchangeNodes.keys()) renderExchange(id);
  }
  renderData();
  if (focused.isConnected && focused.checkVisibility() && document.activeElement!==focused) focused.focus({preventScroll:true});
  if (selected && selected[0].isConnected && selected[2].isConnected) selection.setBaseAndExtent(...selected);
  el.body.dataset.hasHistory=String(exchangeNodes.size>0);
  el.latest.hidden=exchangeNodes.size===0;
  restoreReading(reading);
}
function endConversation(){
  const reading=readingPosition();
  locallyEnded=true;
  for (const record of records.values()) if (record.kind==='text') renderText(record);
  for (const id of exchangeNodes.keys()) renderExchange(id);
  renderData();
  restoreReading(reading);
}
function currentConnection(session){return session.generation===connectionGeneration && session.call_id===selectedCallID;}

// ── meters: one mixed (mic + agent) for the stage, one mic-only for the control ──
// Two analysers off one context. The stage meter answers "is anything happening",
// the level inside the microphone control answers "is it hearing me", and those
// are different questions — a mixed reading rises when the agent talks.
function ensureAudio(){
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 64;
  micAnalyser = audioCtx.createAnalyser();
  micAnalyser.fftSize = 64;
  const freq = new Uint8Array(analyser.frequencyBinCount);
  const micFreq = new Uint8Array(micAnalyser.frequencyBinCount);
  const tick = () => {
    analyser.getByteFrequencyData(freq);
    for (let i = 0; i < BARS; i++){
      const v = (freq[Math.floor(i * freq.length / BARS)] || 0) / 255;
      bars[i].style.transform = `scaleY(${Math.max(0.08, v)})`;
    }
    if (micNode && micState === "live"){
      micAnalyser.getByteFrequencyData(micFreq);
      let peak = 0;
      for (const v of micFreq) if (v > peak) peak = v;
      el.micLevel.style.transform = `scaleX(${Math.min(1, (peak / 255) * 1.6)})`;
    }
    raf = requestAnimationFrame(tick);
  };
  tick();
}
function startMeter(remoteStream){
  ensureAudio();
  if (remoteNode) { try { remoteNode.disconnect(); } catch {} }
  remoteNode = audioCtx.createMediaStreamSource(remoteStream);
  remoteNode.connect(analyser);                       // agent voice
  if (mic) reconnectMic(mic);                         // your voice, if it is already up
}
// Called on both transports. On livekit `mic` is a MediaStream wrapped around the
// published track, so the level works there too rather than only on pipecat.
function reconnectMic(stream){
  ensureAudio();
  if (micNode) { try { micNode.disconnect(); } catch {} }
  micNode = audioCtx.createMediaStreamSource(stream);
  micNode.connect(analyser);                          // analyser only — never to destination (no feedback)
  micNode.connect(micAnalyser);
}
function stopMeter(){
  cancelAnimationFrame(raf); raf = 0;
  if (audioCtx) audioCtx.close();
  audioCtx = analyser = micAnalyser = micNode = remoteNode = null;
  setBars(0.08);
  el.micLevel.style.transform = "scaleX(0)";
}

// ── shared teardown (either transport) ──────────────────
function teardown(state, hint){
  ++connectionGeneration;
  connecting = false;
  endConversation();
  stopMeter();
  clearInterval(clientReadyTimer); clientReadyTimer = 0;
  const oldChannel = dc, oldPeer = pc, oldRoom = room;
  dc = pc = room = null;
  if (oldChannel){ try { oldChannel.close(); } catch {} }
  if (oldPeer) oldPeer.close();
  if (oldRoom){ try { oldRoom.disconnect(); } catch {} }
  pcId = null;
  if (mic){ mic.getTracks().forEach(t => t.stop()); mic = null; }
  el.remote.srcObject = null;
  setMicUnavailable();
  el.connect.textContent = "connect";
  el.connect.disabled = !ready;
  transport = null;
  setState(state, state === "error" ? "error" : "ready",
    state === "error" ? hint : "press connect and talk to your agent");
}

// ── microphone: the control names the state, styling carries the affordance ──
const MIC_LABEL = {unavailable:"MIC —", live:"MIC LIVE", muted:"MIC MUTED"};
function renderMic(){
  el.mute.dataset.mic = micState;
  el.mute.disabled = micState === "unavailable";
  el.micText.textContent = MIC_LABEL[micState];
  el.micGlyph.textContent = micState === "live" ? "●" : "○";
  el.body.classList.toggle("muted", micState === "muted");
  if (micState !== "live") el.micLevel.style.transform = "scaleX(0)";
}
function setMuted(v){
  muted = v;
  micState = v ? "muted" : "live";
  renderMic();
  if (mic) mic.getAudioTracks().forEach(t => t.enabled = !muted);        // pipecat
  if (room) { try { room.localParticipant.setMicrophoneEnabled(!muted); } catch {} } // livekit
}
function setMicUnavailable(){
  muted = false; micState = "unavailable"; holding = false;
  renderMic();
}
function toggleMute(){
  if (micState === "unavailable") return;             // inert, not silently ignored elsewhere
  setMuted(!muted);
}

// ── keyboard: toggle key and hold-to-talk ────────────────
// Push-to-talk is the only way to test barge-in deliberately instead of by
// talking over yourself, so SPACE has to reach here even when a button holds
// focus — otherwise it activates that button and ends the call.
function typingTarget(t){
  if (!t) return false;
  if (t.closest?.('.transcript summary,.transcript button')) return true;
  const tag = (t.tagName || "").toLowerCase();
  return tag === "a" || tag === "input" || tag === "textarea" || tag === "select" || t.isContentEditable;
}
document.addEventListener("keydown", (e) => {
  if (typingTarget(e.target) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "m" || e.key === "M"){
    e.preventDefault();
    if (e.repeat) return;
    toggleMute();
  } else if (e.key === " "){
    e.preventDefault();                               // stops button activation and page scroll
    if (e.repeat || holding || micState === "unavailable") return;
    holding = true; heldWasMuted = muted;
    if (muted) setMuted(false);                       // reads exactly as a latched MIC LIVE
  }
});
document.addEventListener("keyup", (e) => {
  if (e.key !== " " || !holding) return;
  e.preventDefault();
  holding = false;
  if (heldWasMuted && micState !== "unavailable") setMuted(true);
});

// ── bootstrap: ask the CLI which transport this target uses ──
async function connect(){
  if (DEMO) return simulate();
  if (transport || connecting) return;
  clearTranscript();
  connecting = true;
  const generation = ++connectionGeneration;
  el.connect.textContent = 'cancel';
  setState('connecting','connecting','reaching the agent');
  try {
    const res = await fetch('/api/session');
    if (!res.ok) throw new Error('session '+res.status);
    const session = await res.json();
    if (generation !== connectionGeneration) return;
    if (session.ready === false){
      teardown('idle');
      el.hint.textContent = 'the agent is not running yet; see the output';
      if (!viewPinned) showView('logs');
      return;
    }
    if (session.dev_events_version !== 2 || !session.call_id) throw new Error('streaming session identity unavailable');
    selectedCallID = session.call_id;
    session.generation = generation;
    transport = session.kind;
    if (session.kind === 'livekit') await connectLivekit(session);
    else await connectPipecat(session);
  } catch (err){
    if (generation === connectionGeneration) teardown('error', String(err.message || err));
  }
}

// ── pipecat transport: WebRTC offer → containerized bot ──
async function refreshMics(){
  let devices;
  if (DEMO){
    devices = [{deviceId:"builtin",label:"MacBook Pro Microphone"},
               {deviceId:"usb",label:"Shure MV7 (USB)"}];
  } else {
    try { devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "audioinput"); }
    catch { devices = []; }
  }
  el.micsel.innerHTML = "";
  devices.forEach((d, i) => {
    const o = document.createElement("option");
    o.value = d.deviceId;
    o.textContent = d.label || `Microphone ${i + 1}`;
    if (d.deviceId === selectedDeviceId) o.selected = true;
    el.micsel.appendChild(o);
  });
  el.microw.hidden = devices.length < 2;              // only offer a choice when there is one
}

el.micsel.addEventListener("change", async () => {
  selectedDeviceId = el.micsel.value || null;
  if (DEMO || el.body.dataset.state !== "connected") return;
  if (transport === "webrtc-offer") await swapMic();
  else if (room) await swapMicLivekit();
});

async function swapMic(){
  try {
    const next = await navigator.mediaDevices.getUserMedia({ audio: audioConstraint() });
    const track = next.getAudioTracks()[0];
    track.enabled = !muted;
    const sender = pc.getSenders().find(s => s.track && s.track.kind === "audio");
    if (sender) await sender.replaceTrack(track);     // hot-swap, no renegotiation
    mic.getTracks().forEach(t => t.stop());
    mic = next;
    reconnectMic(next);                               // re-tap into the meter
  } catch { /* keep the existing mic on failure */ }
}

async function waitForIce(pc){
  if (pc.iceGatheringState === "complete") return;
  await new Promise(res => {
    const check = () => { if (pc.iceGatheringState === "complete"){ pc.removeEventListener("icegatheringstatechange", check); res(); } };
    pc.addEventListener("icegatheringstatechange", check);
  });
}

async function waitForPeer(pc){
  if (pc.connectionState === "connected") return;
  await new Promise((resolve, reject) => {
    const timeout = setTimeout(() => finish(new Error("WebRTC connection timed out")), 15000);
    const check = () => {
      if (pc.connectionState === "connected") finish();
      else if (["failed","disconnected","closed"].includes(pc.connectionState))
        finish(new Error("WebRTC connection " + pc.connectionState));
    };
    const finish = (err) => {
      clearTimeout(timeout);
      pc.removeEventListener("connectionstatechange", check);
      err ? reject(err) : resolve();
    };
    pc.addEventListener("connectionstatechange", check);
    check();
  });
}

// RTVI only acknowledges readiness; identified dev events own the transcript.
function handleRtvi(msg){
  if (msg.type === "bot-ready"){
    clearInterval(clientReadyTimer); clientReadyTimer = 0;
  }
}

let clientReadyTimer = 0;
function sendClientReady(){
  if (!dc || dc.readyState !== "open") return;
  dc.send(JSON.stringify({
    label:"rtvi-ai", type:"client-ready", id:"unmute-dev-ready",
    data:{version:"2.0.0", about:{library:"unmute-dev", platform:"web"}},
  }));
}

async function connectPipecat(session){
  const offerUrl = session.offerUrl || '/api/offer';
  setState('connecting','connecting','requesting microphone');
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:audioConstraint()});
    if (!currentConnection(session)){stream.getTracks().forEach(t=>t.stop());return;}
    if (!selectedDeviceId){
      selectedDeviceId = stream.getAudioTracks()[0].getSettings().deviceId || null;
      if (selectedDeviceId){
        stream.getTracks().forEach(t=>t.stop());
        stream = await navigator.mediaDevices.getUserMedia({audio:audioConstraint()});
        if (!currentConnection(session)){stream.getTracks().forEach(t=>t.stop());return;}
      }
    }
    mic = stream;
    await refreshMics();
    if (!currentConnection(session)) return;
  } catch {
    if (currentConnection(session)) teardown('error','microphone permission denied');
    return;
  }
  const peer = new RTCPeerConnection();
  pc = peer;
  try {
    stream.getTracks().forEach(t=>peer.addTrack(t,stream));
    peer.addEventListener('track',e=>{
      if (!currentConnection(session)) return;
      el.remote.srcObject=e.streams[0];startMeter(e.streams[0]);
    });
    peer.addEventListener('connectionstatechange',()=>{
      if (currentConnection(session) && ['failed','disconnected','closed'].includes(peer.connectionState)) teardown('error','connection lost');
    });
    const channel = peer.createDataChannel('chat',{ordered:true});
    dc = channel;
    channel.addEventListener('open',()=>{
      if (!currentConnection(session)) return;
      sendClientReady();clientReadyTimer=setInterval(sendClientReady,500);
    });
    channel.addEventListener('message',e=>{
      if (!currentConnection(session)) return;
      try {const msg=JSON.parse(e.data);if(msg?.label==='rtvi-ai')handleRtvi(msg);}catch{}
    });
    const offer=await peer.createOffer();
    if (!currentConnection(session)) return;
    await peer.setLocalDescription(offer);
    await waitForIce(peer);
    if (!currentConnection(session)) return;
    setState('connecting','connecting','negotiating with agent');
    const res=await fetch(offerUrl,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sdp:peer.localDescription.sdp,type:peer.localDescription.type,pc_id:pcId,request_data:{unmute_dev_call_id:session.call_id}}),
    });
    if (!currentConnection(session)) return;
    if (!res.ok) throw new Error('offer rejected ('+res.status+')');
    const answer=await res.json();
    if (!currentConnection(session)) return;
    pcId=answer.pc_id || pcId;
    await peer.setRemoteDescription(answer);
    await waitForPeer(peer);
    if (!currentConnection(session)) return;
    connecting=false;
    setMuted(false);
    el.connect.textContent = "end call";
    setState('connected','live','talk to your agent');
  } catch(err){if(currentConnection(session))teardown('error',String(err.message || err));}
}

// ── livekit transport: join a room with the vendored JS SDK ──
function loadLiveKit(){
  if (window.LivekitClient) return Promise.resolve(window.LivekitClient);
  return new Promise((resolve) => {
    const s = document.createElement("script");
    s.src = "/livekit-client.umd.js";
    s.onload = () => resolve(window.LivekitClient || null);
    s.onerror = () => resolve(null);
    document.head.appendChild(s);
  });
}

// The publication holds the track the SDK is actually sending. Wrapping its
// mediaStreamTrack feeds the same analyser path both transports use, so the input
// level is not a pipecat-only feature.
function attachLocalMic(){
  const LK = window.LivekitClient;
  if (!room || !LK) return;
  try {
    const pub = room.localParticipant.getTrackPublication(LK.Track.Source.Microphone);
    const track = pub && pub.track && pub.track.mediaStreamTrack;
    if (track) reconnectMic(new MediaStream([track]));
  } catch { /* the level is a nicety; never break a call for it */ }
}

async function swapMicLivekit(){
  try {
    await room.switchActiveDevice("audioinput", selectedDeviceId);
    attachLocalMic();                                 // the underlying track changed
  } catch { /* keep the existing input on failure */ }
}

async function connectLivekit(session){
  setState('connecting','connecting','loading the livekit client');
  const LK=await loadLiveKit();
  if (!currentConnection(session)) return;
  if (!LK) return teardown('error','could not load the livekit client');
  const nextRoom=new LK.Room({adaptiveStream:true,dynacast:true});
  room=nextRoom;
  nextRoom.on(LK.RoomEvent.TrackSubscribed,track=>{
    if (!currentConnection(session)) return;
    if(track.kind===LK.Track.Kind.Audio){
      const stream=new MediaStream([track.mediaStreamTrack]);
      el.remote.srcObject=stream;startMeter(stream);
    }
  });
  nextRoom.on(LK.RoomEvent.TrackUnsubscribed,()=>{if(currentConnection(session))el.remote.srcObject=null;});
  nextRoom.on(LK.RoomEvent.LocalTrackPublished,pub=>{
    if(currentConnection(session) && pub?.kind===LK.Track.Kind.Audio)attachLocalMic();
  });
  nextRoom.on(LK.RoomEvent.Disconnected,()=>{if(currentConnection(session))teardown('idle');});
  nextRoom.on(LK.RoomEvent.ParticipantConnected,p=>{
    if(currentConnection(session))setState('connected','live','talking to '+p.identity);
  });
  try {
    await nextRoom.connect(session.url,session.token);
    if (!currentConnection(session)){nextRoom.disconnect();return;}
    connecting=false;
    setState('connected','live','talk to your agent');
    el.connect.textContent = "end call";
  } catch(err){if(currentConnection(session))teardown('error',String(err.message || err));return;}
  try {
    await nextRoom.localParticipant.setMicrophoneEnabled(true);
    if (!currentConnection(session)) return;
    setMuted(false);attachLocalMic();await refreshMics();
  } catch {
    if (!currentConnection(session)) return;
    setMicUnavailable();
    el.state.textContent='live — microphone blocked; allow access and reconnect';
  }
}


// Keep native focus; the keyboard handler owns push-to-talk.
el.connect.addEventListener("click", () => {
  (connecting || el.body.dataset.state === "connected") ? teardown("idle") : connect();
});
el.mute.addEventListener("click", () => { toggleMute(); });
if (!DEMO && navigator.mediaDevices && navigator.mediaDevices.addEventListener)
  navigator.mediaDevices.addEventListener("devicechange", () => { if (transport) refreshMics(); });

// ── demo-only visual preview (DEMO=true builds) ──────────
function simulate(){
  clearTranscript();
  selectedCallID = "demo";
  setMuted(false);
  el.connect.textContent = "end call";
  setState("connected", "live", "talk to your agent");
  attachRecord({version:2,kind:"exchange",call_id:"demo",id:"greeting",revision:1,order:1,
    exchange:{role:"response",state:"ended",link_status:"unavailable",playback:"unknown"}});
  attachRecord({version:2,kind:"text",call_id:"demo",id:"hello",revision:1,order:2,
    text:{exchange_id:"greeting",message_id:"hello",speaker:"assistant",text:"Hi! How can I help?",state:"final",origin:"generated",separator_before:""}});
}

setBars(0.08);
renderMic();
setState("idle", "ready");
// Nothing to call until the stream says otherwise. In DEMO builds there is no
// stream, so the button stays live for the visual preview.
if (!DEMO) el.connect.disabled = true;
startEventStream();
</script>
</body>
