<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>unmute dev</title>
<style>
  /* The SLNG studio's tokens (slng-ai/unmute-beat, studio/web/src/styles/tokens.css),
     one to one, plus the few literals the studio writes inline. Dark ground, one
     yellow, square corners, 1 px rules. Each signal colour means one thing. Saans
     is licensed and the page ships inside the binary, so sans falls back to the
     system face; Geist Mono is used when it is installed. */
  :root{
    --sunk:#0f0d0a;
    --ground:#15120d;
    --aside:#17150f;
    --panel:#1a1814;
    --hover:#1e1c18;
    --raised:#252320;
    --rule-faint:#211f1b;     /* rows inside a table or card */
    --rule-soft:#26241f;
    --rule:#333230;
    --rule-strong:#3a3833;
    --faint:#6e6c66;
    --dim:#8a8882;
    --muted:#a0a09b;
    --soft:#d9d7d1;
    --text:#f5f4f1;
    --yellow:#fbe566;         /* brand yellow: the current view, something running, slow */
    --yellow-hover:#fff1a3;
    --yellow-dim:#7a6f35;
    --yellow-ground:#221f14;
    --caller:#5aa9f0;         /* the caller's words and voice */
    --bot:#f0a36e;            /* what the agent said or is saying */
    --ok:#9bd39b;
    --ok-rule:#5e8f5e;
    --bad:#f07b6e;            /* failed, over the limit */
    --bad-rule:#8f4a42;
    --bad-ground:#2a1714;
    --bad-line:#5a2a24;
    --sans:system-ui,-apple-system,sans-serif;
    --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
    --bar:56px;               /* top bar height */
    --control:40px;           /* button height */
    --who:132px;              /* transcript speaker column */
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--ground);color:var(--text);
    font-family:var(--sans);font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
  kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--rule-strong);padding:1px 5px;color:var(--soft)}
  .mono{font-family:var(--mono)}
  .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .dim{color:var(--dim)}
  .hint{font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.5}
  .empty{font-family:var(--mono);font-size:12px;color:var(--dim);line-height:1.6;margin:0}
  .tag{
    font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    padding:2px 6px;border:1px solid var(--rule-strong);color:var(--muted);white-space:nowrap;
  }
  .tag[hidden]{display:none}
  .tag-bad{border-color:var(--bad-rule);color:var(--bad)}
  /* A number's level against its limit: the studio's LEVEL_COLOR. */
  .lv-ok{color:var(--muted)}
  .lv-slow{color:var(--yellow)}
  .lv-bad{color:var(--bad)}
  .pulse{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes blink{to{visibility:hidden}}

  /* ── buttons: studio .btn, .btn-y, .btn-q ─────────────────── */
  .btn,#connect,.metrics-guide{
    font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    height:var(--control);padding:0 14px;border:1px solid var(--rule-strong);border-radius:0;
    background:transparent;color:var(--muted);cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap;
  }
  .btn:hover,.metrics-guide:hover{background:var(--raised);color:var(--text)}
  /* connect is the yellow action; cancel and end call are the quiet one */
  #connect{background:var(--yellow);border-color:var(--yellow);color:var(--ground)}
  #connect:hover{background:var(--yellow-hover);border-color:var(--yellow-hover)}
  #connect:focus-visible{outline-color:var(--text)}
  body[data-state="connecting"] #connect:focus-visible,body[data-state="connected"] #connect:focus-visible{outline-color:var(--yellow)}
  body[data-state="connecting"] #connect,body[data-state="connected"] #connect{
    background:transparent;border-color:var(--rule-strong);color:var(--muted);
  }
  body[data-state="connecting"] #connect:hover,body[data-state="connected"] #connect:hover{background:var(--raised);color:var(--text)}
  /* Nothing to connect to yet: the page is served before the runtime exists. */
  #connect[disabled],#connect[disabled]:hover{
    background:transparent;border:1px dashed var(--rule-strong);color:var(--faint);cursor:not-allowed;
  }

  /* ── page frame ─────────────────────────────────────────── */
  .app{height:100%;display:flex;flex-direction:column;min-height:0}

  /* ── top bar: studio Shell ──────────────────────────────────
     The mark, the three views, then the run's own cells. At phone width it stays
     one row: everything after the views scrolls sideways, so nothing is dropped. */
  .bar{display:flex;align-items:stretch;min-height:var(--bar);border-bottom:1px solid var(--rule-soft);flex:none}
  .brand{display:flex;align-items:center;gap:10px;padding:0 20px;color:var(--text);flex:none}
  .brand-mark{width:18px;height:18px;background:var(--yellow);flex:none}
  .brand-name{font-weight:800;font-size:18px;letter-spacing:-.01em}
  .brand-sub{font-family:var(--mono);font-size:13px;color:var(--dim)}
  /* Views are state, never navigation: tearing the page down would end the call. */
  .nav{display:flex;flex:none}
  .vtab{
    font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);background:transparent;border:0;border-left:1px solid var(--rule-soft);border-radius:0;
    height:var(--bar);display:flex;align-items:center;gap:8px;padding:0 16px;cursor:pointer;
  }
  .vtab:hover{color:var(--text)}
  .vtab[aria-selected="true"]{background:var(--yellow);color:var(--ground)}
  .vtab:focus-visible{outline-offset:-2px}
  .vtab[aria-selected="true"]:focus-visible{outline-color:var(--text)}
  /* the problem count rides the Logs cell, so it is visible from every view */
  .vtab .tag{background:var(--ground)}
  .bar-scroll{display:contents}
  .bar-fill{flex:1 1 200px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:8px 20px;border-left:1px solid var(--rule-soft);min-width:0}
  .bar-agent{font-family:var(--mono);font-size:13px;font-weight:400}
  [id="feed-status"]{font-family:var(--mono);font-size:12px;color:var(--dim);overflow-wrap:anywhere}
  .bar-cell{display:flex;align-items:center;gap:8px;padding:8px 16px;border-left:1px solid var(--rule-soft)}
  /* one tag for where the session is: ready, connecting, live, error */
  .runtag{border-color:var(--ok-rule);color:var(--ok)}
  body[data-state="connecting"] .runtag{border-color:var(--yellow);color:var(--yellow);animation:pulse 1.4s ease-in-out infinite}
  body[data-state="connected"] .runtag{border-color:var(--yellow);color:var(--yellow)}
  body[data-state="error"] .runtag{border-color:var(--bad-rule);color:var(--bad)}

  /* ── controls: studio .callbar ─────────────────────────────
     Above every view: a control that disappears when you switch view is the same
     defect as a control labelled with its action. */
  .controls{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;flex:none;
    padding:12px 20px;border-bottom:1px solid var(--rule-soft);background:var(--aside);
  }
  .callbar-level{display:flex;flex-direction:column;gap:6px;min-width:0}
  .controls-gap{flex:1 1 auto}

  /* microphone: a state readout, not a verb. The label beside it names the state;
     the button's fill carries it (caller blue when live, dashed when there is none). */
  #mute{
    position:relative;overflow:hidden;
    width:56px;height:56px;flex:0 0 56px;border-radius:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--caller);background:transparent;color:var(--caller);
  }
  #mute[data-mic="live"]{background:var(--caller);color:var(--ground)}
  #mute[data-mic="muted"]{border-color:var(--rule-strong);color:var(--dim)}
  #mute[data-mic="unavailable"]{border:1px dashed var(--rule-strong);color:var(--faint);cursor:not-allowed}
  .mic-text{color:var(--faint)}
  #mute[data-mic="live"] + .callbar-level .mic-text{color:var(--caller)}
  #mute[data-mic="muted"] + .callbar-level .mic-text{color:var(--muted)}
  /* input level, inside the control it describes */
  .mic-level{position:absolute;left:0;right:0;bottom:0;height:3px;pointer-events:none}
  .mic-level i{
    display:block;height:100%;width:100%;background:var(--ground);opacity:.6;
    transform:scaleX(0);transform-origin:left;transition:transform .07s linear;
  }
  /* The level is driven by an inline transform, which outranks any rule here, so
     renderMic() zeroes it on leaving `live` rather than a selector doing it. */

  /* meter: live conversation level (mic + agent) */
  .meter{display:flex;align-items:flex-end;gap:3px;height:18px}
  .meter i{
    display:block;width:5px;height:100%;background:var(--rule-strong);
    transform:scaleY(.08);transform-origin:bottom;transition:transform .09s linear;
  }
  body[data-state="connected"] .meter i{background:var(--caller)}
  body.muted[data-state="connected"] .meter i{opacity:.5}

  /* mic selector, shown only when two or more inputs exist */
  .microw{display:flex;align-items:center;gap:10px;min-width:0}
  .microw[hidden]{display:none}
  #micsel{
    max-width:280px;min-width:0;background:var(--sunk);border:1px solid var(--rule-strong);border-radius:0;
    color:var(--text);padding:9px 10px;font-size:14px;cursor:pointer;text-overflow:ellipsis;
  }
  #micsel:focus{outline:none;border-color:var(--yellow)}

  /* ── views ─────────────────────────────────────────────── */
  .views{flex:1;min-height:0;display:flex;flex-direction:column}
  .view{flex:1;min-height:0;display:none;flex-direction:column}
  .view[data-active="true"]{display:flex}

  /* ── conversation: stage ──────────────────────────────────
     The big "ready" while there is nothing to read; one line once there is. */
  .stage{flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:12px;padding:48px 24px}
  .state{font-size:32px;font-weight:800;line-height:1.2;color:var(--text)}
  .state .cursor{color:var(--yellow);font-weight:400;animation:blink 1s steps(2,start) infinite}
  [id="hint"]{margin:0}
  body[data-state="connecting"] .state{color:var(--yellow)}
  body[data-state="error"] .state{color:var(--bad)}
  body[data-state="connected"] .stage,body[data-has-history="true"] .stage{
    flex:none;flex-direction:row;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 20px 10px;
    border-bottom:1px solid var(--rule-soft);
  }
  body[data-state="connected"] .state,body[data-has-history="true"] .state{
    font-family:var(--mono);font-size:12px;font-weight:400;letter-spacing:.04em;
  }
  body[data-state="connected"] .state{color:var(--yellow)}
  body[data-state="connected"] [id="hint"],body[data-has-history="true"] [id="hint"]{display:none}

  /* ── conversation: transcript and inspector ─────────────── */
  .transcript{flex:1;min-height:0;display:none;position:relative}
  body[data-state="connected"] .transcript,
  body[data-has-history="true"] .transcript{display:flex}
  .conversation-scroll{position:relative;flex:999 1 600px;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .tlist{
    flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;overflow-anchor:none;
    padding:14px 20px 56px;display:flex;flex-direction:column;gap:16px;
    scrollbar-width:thin;scrollbar-color:var(--rule-strong) transparent;
  }
  #latest{position:absolute;right:20px;bottom:12px;height:32px;z-index:1;background:var(--ground)}
  #latest[hidden]{display:none}

  .exchange{flex:none;min-width:0;display:flex;flex-direction:column;gap:8px;position:relative}
  /* a rule between exchanges, drawn outside the box so it adds no height */
  .tlist > .exchange:not(:first-child)::before{content:"";position:absolute;left:0;right:0;top:-9px;border-top:1px solid var(--rule-soft)}
  .exchange[hidden],.exchange-content:empty{display:none}
  .exchange-content{display:flex;flex-direction:column;gap:8px}
  .turn{display:grid;grid-template-columns:var(--who) minmax(0,1fr);gap:10px;align-items:baseline}
  .who{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;overflow-wrap:anywhere}
  .turn.you .who{color:var(--caller)}
  .turn.bot .who{color:var(--bot)}
  .said{font-size:15px;line-height:1.45;color:var(--soft);white-space:pre-wrap;overflow-wrap:anywhere}
  .segment[data-state="provisional"]{color:var(--dim)}
  .segment[data-state="provisional"]::after{content:" …";color:var(--faint)}
  .segment[data-state="incomplete"]{text-decoration:underline dotted var(--dim);text-underline-offset:4px}
  /* the exchange's status: studio .said-mark, under the text it describes */
  .exchange-status{font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:calc(var(--who) + 10px);overflow-wrap:anywhere}
  .exchange[data-state="open"] .exchange-status{color:var(--yellow)}

  /* one reply's measurements: studio .request card */
  .request{border:1px solid var(--rule-soft);background:var(--panel);margin-left:calc(var(--who) + 10px);min-width:0}
  .request[hidden]{display:none}
  .metrics-summary{display:flex;flex-wrap:wrap;gap:0 8px;padding:6px 10px;font-family:var(--mono);font-size:11px;color:var(--muted);border-bottom:1px solid var(--rule-faint)}
  .metrics-summary:last-child{border-bottom:0}
  .activity{display:flex;flex-direction:column}
  .activity:empty{display:none}
  .operation{padding:5px 10px;font-family:var(--mono);font-size:12px;color:var(--dim);overflow-wrap:anywhere;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px}
  .operation[data-state="running"]{color:var(--yellow);animation:pulse 1.4s ease-in-out infinite}
  .operation[data-state="failed"],.operation[data-state="timed_out"]{color:var(--bad)}
  .operation-metrics{display:flex;flex-wrap:wrap;gap:2px 14px}
  .operation-metrics .measurement{padding:0}
  .measurements{padding:5px 10px;font-family:var(--mono);font-size:12px;color:var(--dim);overflow-wrap:anywhere}
  .measurements[hidden]{display:none}
  .measurements > summary{cursor:pointer;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .measurement{padding:4px 0;display:flex;flex-direction:column;gap:2px}
  .measurement-label{color:var(--soft)}
  .operation .measurement-label{color:inherit}
  .measurement-note,.source-note{font-size:11px;color:var(--dim)}
  .source-note{white-space:pre-line;margin:6px 0 0}

  /* ── inspector: studio .inspector and Section ────────────── */
  .inspector{
    flex:1 1 380px;max-width:100%;min-width:0;min-height:0;overflow-y:auto;
    background:var(--aside);border-left:1px solid var(--rule-soft);
  }
  .inspector[hidden]{display:none}
  .inspector:not([open]){flex:0 0 auto}
  .inspector > summary{
    display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--rule-soft);
    cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  }
  .inspector > summary:hover{background:var(--hover)}
  .inspector > summary::-webkit-details-marker{display:none}
  .inspector > summary::before{content:"▸";width:10px;color:var(--dim)}
  .inspector[open] > summary::before{content:"▾"}
  .inspector > summary:focus-visible{outline-offset:-2px}
  [id="diagnostic-list"]{display:flex;flex-direction:column}
  [id="diagnostic-list"] .exchange{gap:0;border-bottom:1px solid var(--rule-soft);padding-bottom:12px}
  [id="diagnostic-list"] .exchange-status{display:none}
  [id="diagnostic-list"] .request{margin:0;border:0;background:transparent;display:flex;flex-direction:column;gap:10px}
  [id="diagnostic-list"] .metrics-summary{
    height:44px;align-items:center;padding:0 16px;border:0;
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);
  }
  [id="diagnostic-list"] .activity,[id="diagnostic-list"] .measurements{margin:0 16px}
  [id="diagnostic-list"] .activity{border:1px solid var(--rule-soft)}
  [id="diagnostic-list"] .activity:has(> .breakdown){border:0;gap:10px}
  [id="diagnostic-list"] .operation{border-bottom:1px solid var(--rule-faint)}
  [id="diagnostic-list"] .measurements{padding:0}
  /* One reply's time, split into the parts that make it up: a studio .kv. The
     durations are in a column of their own so the long one is findable by eye. */
  .breakdown{border:1px solid var(--rule-soft);font-family:var(--mono);font-size:12px}
  .breakdown > div{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;padding:7px 10px;border-bottom:1px solid var(--rule-faint)}
  .breakdown > div:last-child{border-bottom:0}
  .breakdown > .measurement-label{display:block;color:var(--text)}
  .breakdown-duration{color:var(--text);font-variant-numeric:tabular-nums}
  .breakdown-owner{color:var(--dim)}

  /* ── metrics view: studio Metrics page ──────────────────── */
  .metrics{flex:1;min-height:0;overflow-y:auto}
  .metrics-head{padding:20px 24px 16px;border-bottom:1px solid var(--rule-soft)}
  .metrics-head h1{margin:8px 0 0;font-size:32px;font-weight:800;line-height:1.2}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));border-bottom:1px solid var(--rule-soft)}
  .tile{padding:14px 18px;border-right:1px solid var(--rule-soft);display:flex;flex-direction:column;gap:6px;min-width:0}
  .tile .lbl{font-size:10px}
  .tile-value{font-family:var(--mono);font-size:26px}
  .tile-note{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .metrics-body{display:flex;flex-wrap:wrap;align-items:flex-start}
  .metrics-main{flex:999 1 640px;min-width:0;padding-bottom:24px}
  .metrics-main > .lbl{padding:18px 16px 10px}
  .metrics-main > .lbl:first-child{padding-top:14px}
  .metrics-main > .empty,.metrics-main > .hint{padding:0 16px}
  .moves{overflow-x:auto;padding:0 16px}
  .moves table{border-collapse:collapse;min-width:640px;width:100%;border:1px solid var(--rule-soft);background:var(--aside)}
  .moves th,.moves td{border:1px solid var(--rule-faint);height:44px;padding:4px 8px;text-align:center;font-family:var(--mono);font-size:14px;color:var(--muted);font-weight:400}
  .moves thead th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);background:var(--ground)}
  .moves tbody th{text-align:left;padding:0 12px}
  .moves .left{text-align:left;padding:6px 10px}
  .moves .flags{text-align:left;padding:6px 10px;font-family:var(--sans);font-size:13px}
  .moves .small{font-size:12px}
  .rules{flex:1 1 320px;max-width:100%;margin:14px 16px;border:1px solid var(--rule-soft);background:var(--aside)}
  .rules > .lbl{padding:10px 12px;border-bottom:1px solid var(--rule-soft)}
  .rule{display:grid;grid-template-columns:minmax(0,1fr) 70px 70px;gap:8px;padding:8px 12px;border-bottom:1px solid var(--rule-faint);align-items:baseline;font-size:13px;color:var(--soft)}
  .rule .mono{font-size:11px;text-align:right}
  .rules-note{font-family:var(--mono);font-size:10px;color:var(--faint);padding:8px 12px}

  /* ── logs view: studio .toolbar, .segs, .panel ──────────── */
  .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex:none;padding:10px 20px;border-bottom:1px solid var(--rule-soft)}
  #logfilter{
    flex:1 1 260px;min-width:0;background:var(--sunk);border:1px solid var(--rule-strong);border-radius:0;
    color:var(--text);padding:9px 10px;font-size:14px;font-family:var(--mono);
  }
  #logfilter::placeholder{color:var(--faint)}
  #logfilter:focus{outline:none;border-color:var(--yellow)}
  .segs{display:flex}
  .kind{
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    height:32px;padding:0 12px;background:transparent;border:1px solid var(--rule-strong);border-radius:0;
    color:var(--muted);cursor:pointer;
  }
  .kind + .kind{border-left:0}
  .kind[aria-pressed="true"]{background:var(--text);color:var(--ground);border-color:var(--text)}
  .kind[aria-pressed="true"]:focus-visible{outline-color:var(--text)}
  .logmain{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:20px}
  .problem{font-family:var(--mono);font-size:12px;color:var(--bad);border-left:2px solid var(--bad);padding:4px 10px;background:var(--bad-ground);overflow-wrap:anywhere;flex:none}
  .problem[hidden]{display:none}
  .logpane{flex:1;min-height:0;display:flex;border:1px solid var(--rule-soft);background:var(--aside)}
  .loglist{
    flex:1;overflow:auto;overscroll-behavior:contain;padding:10px 14px;background:var(--sunk);
    font-family:var(--mono);font-size:12px;line-height:1.6;color:var(--muted);
    scrollbar-width:thin;scrollbar-color:var(--rule-strong) transparent;
  }
  .logrow{display:block;white-space:pre-wrap;overflow-wrap:anywhere}
  .logrow.flagged{color:var(--bad)}
  .logrow.metric{color:var(--yellow)}
  .logempty{color:var(--dim)}

  /* ── phone width ─────────────────────────────────────────── */
  @media (max-width:720px){
    :root{--bar:48px}
    .brand{padding:0 15px}
    .brand-name,.brand-sub{display:none}
    .brand-mark{width:16px;height:16px}
    .vtab{padding:0 10px;font-size:11px;letter-spacing:.06em}
    .bar-scroll{display:flex;flex:1 1 0;min-width:0;overflow-x:auto;scrollbar-width:none;border-left:1px solid var(--rule-soft)}
    .bar-scroll > *{flex:0 0 auto}
    .bar-fill{flex-wrap:nowrap;padding:0 10px;border-left:0}
    .bar-fill > *{flex:0 0 auto;white-space:nowrap}
    .bar-cell{padding:4px 10px}
    .controls{gap:10px 12px;padding:10px 16px}
    #mute{width:48px;height:48px;flex-basis:48px}
    /* one row for the call: mic, level, connect; the input picker under it */
    .callbar-level{flex:1 1 0}
    .controls-gap{display:none}
    .microw{order:1;flex:1 1 100%}
    #micsel{flex:1;max-width:none}
    .meter{gap:2px}
    .meter i{width:4px}
    .transcript{flex-direction:column}
    .conversation-scroll{flex:1 1 auto}
    .inspector{flex:none;max-height:45%;border-left:0;border-top:1px solid var(--rule-soft)}
    .inspector:not([open]){flex:none}
    .tlist{padding:12px 16px 56px}
    .turn{grid-template-columns:1fr;gap:2px}
    .exchange-status,.request{margin-left:0}
    .stage{padding:32px 16px}
    body[data-state="connected"] .stage,body[data-has-history="true"] .stage{padding:10px 16px 8px}
    .toolbar{padding:10px 16px}
    .logmain{padding:16px}
    .metrics-head{padding:16px}
    .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  }

  @media (prefers-reduced-motion:reduce){
    .pulse,.state .cursor,.runtag,.operation[data-state="running"]{animation:none!important}
    .meter i,.mic-level i{transition:none}
  }
</style>
</head>
<body data-state="idle">
  <div class="app">

      </button>
      <div class="callbar-level">

          <div class="conversation-scroll">
            <div class="tlist" id="tlist"></div>
            <button id="latest" class="btn" type="button" hidden>Latest</button>

            <button class="kind" type="button" data-kind="output" aria-pressed="false">Output</button>
            <button class="kind" type="button" data-kind="metric" aria-pressed="false">Metrics</button>
            <button class="kind" type="button" data-kind="flagged" aria-pressed="false">Problems</button>
          </div>
        </div>
        <div class="logmain">
          <div class="problem" id="logproblem" hidden>the agent did not start; see the output</div>
          <section class="logpane" aria-label="Run output">
            <div class="loglist" id="loglist"></div>
          </section>
        </div>
      </div>
    </div>
  </div>
  <audio id="remote" autoplay></audio>

<script>
"use strict";
// One page, two transports. `GET /api/session` returns {kind}: the CLI picks
// pipecat (WebRTC offer proxied to the containerized bot) or livekit (join a
// room with the JS SDK). Everything below the transport adapter is shared UI.
//
// Visual-preview switch: build flips this to true for the standalone mockup so
// the connected UI is viewable without a running agent. Shipped client = false.
// ponytail: one constant + one simulate() branch — the alternative is a second file.
const DEMO = false;

const q = new URLSearchParams(location.search);
const AGENT = q.get("agent") || "agent";
const BARS = 24;

const el = {
  body: document.body,
  state: document.getElementById("state"),
  hint: document.getElementById("hint"),
  connect: document.getElementById("connect"),
  mute: document.getElementById("mute"),
  meter: document.getElementById("meter"),
  remote: document.getElementById("remote"),
  agent: document.getElementById("agent"),
  microw: document.getElementById("microw"),
  micsel: document.getElementById("micsel"),
  micText: document.querySelector(".controls .mic-text"),
  micLevel: document.getElementById("miclevel"),
  tlist: document.getElementById("tlist"),
  transcript: document.querySelector('.transcript'),
  diagnostics: document.getElementById('diagnostics'),
  diagnosticList: document.getElementById('diagnostic-list'),
  loglist: document.getElementById("loglist"),
  logfilter: document.getElementById("logfilter"),
  flagcount: document.getElementById("flagcount"),
  runtag: document.getElementById("runtag"),
  logproblem: document.getElementById("logproblem"),
  metrics: document.getElementById("metrics"),
  feed: document.getElementById('feed-status'),
  latest: document.getElementById('latest'),
};
el.agent.textContent = AGENT;

const bars = Array.from({length: BARS}, () => {
  const i = document.createElement("i");
  el.meter.appendChild(i);
  return i;
});

let transport = null;                 // "webrtc-offer" | "livekit" while connected
let pc = null, mic = null, pcId = null, dc = null;   // pipecat transport
let room = null;                                     // livekit transport
let audioCtx = null, analyser = null, micNode = null, remoteNode = null, raf = 0;
let micAnalyser = null;                               // mic-only tap, drives the level in the control
let muted = false, selectedDeviceId = null;
let micState = "unavailable";                         // "unavailable" | "live" | "muted"
let holding = false, heldWasMuted = false;            // hold-to-talk
// ── views ───────────────────────────────────────────────
// State, not navigation: tearing the page down would end the call, so there is
// no router and no second document. The session controls live outside every view.
let currentView = "conversation";
let viewPinned = false;              // the author chose; stop moving it for them
let savedReading = null;
const tabs = Array.from(document.querySelectorAll(".vtab"));

function showView(name, byUser){
  if (byUser) viewPinned = true;
  if (currentView==='conversation' && name!=='conversation') savedReading=readingPosition();
  currentView = name;
  for (const view of document.querySelectorAll(".view"))
    view.dataset.active = String(view.dataset.view === name);
  for (const tab of tabs)
    tab.setAttribute("aria-selected", String(tab.dataset.view === name));
  if (name === "logs") renderLog();
  else if (name === "metrics") renderMetrics();
  else restoreReading(savedReading);
}
for (const tab of tabs)
  tab.addEventListener("click", () => { showView(tab.dataset.view, true); });

// ── run output ──────────────────────────────────────────
// The run's lifecycle drives what is in front, because the first thing worth
// looking at before a runtime exists is the reason it does not exist yet.
const LOG_MAX = 2000;
const logRows = [];                  // {kind:"output"|"metric", text, flagged}
let flagged = 0;
let ready = false;

function setRunState(state){
  el.connect.disabled = !transport && !connecting && !ready && state !== "ready";
  el.logproblem.hidden = state !== "failed" || !!transport;
  if (state === "ready"){
    ready = true;
    el.connect.disabled = false;
    // Move to the conversation once there is one to have, unless something went
    // wrong on the way up, in which case the output is the more useful view.
    if (!viewPinned && !flagged) showView("conversation");
  } else if (state === "failed"){
    ready = false;
    connectionLost = false;
    el.connect.disabled = !transport && !connecting;
    if (!transport) setState("error", "error", "the agent did not start; see the output");
    if (!viewPinned) showView("logs");
  } else if (!viewPinned && currentView !== "logs"){
    showView("logs");
  }
}

function pushLogRow(row){
  logRows.push(row);
  if (logRows.length > LOG_MAX) logRows.shift();   // oldest end, as with the server's buffer
  if (row.flagged){
    flagged++;
    el.flagcount.textContent = String(flagged);
    el.flagcount.hidden = false;
  }
  if (currentView === "logs") renderLog();
}

// One compact line per record, so the log view answers "was it slow" without
// leaving it.
function metricText(rec){
  if (!rec) return "";
  if (rec.version === 2){
    const prefix = rec.call_id+' · '+rec.id+' · ';
    if (rec.operation) return prefix+[rec.operation.type,rec.operation.name,rec.operation.state,rec.operation.model,rec.operation.provider,rec.operation.source_request_id].filter(Boolean).join(' · ');
    if (rec.measurement){
      const m=rec.measurement;
      if (m.state!=='measured') return '';
      return prefix+m.scope+' · '+m.metric.replaceAll('_',' ')+' '+secs(m.value)+' · '+
        [m.source,m.model,m.provider,m.operation_id,m.exchange_id,m.reason].filter(Boolean).join(' · ');
    }
    if (rec.breakdown){
      const b=rec.breakdown;
      return prefix+'reply time '+secs(b.total_secs)+' · '+b.parts.map(p=>p.label+' '+secs(p.duration_secs)).join(' · ');
    }
    if (rec.call) return prefix+[rec.call.state,rec.call.reason].filter(Boolean).join(' · ');
    return ''; // raw transcript snapshots remain in dev.log, not repeated here
  }
  if (rec.kind === "session")
    return "session · first speech " + secs(rec.first_speech);
  const parts = ["turn " + (rec.seq || "?")];
  if (rec.e2e != null) parts.push("e2e " + secs(rec.e2e));
  for (const stage of rec.stages || []){
    // This line is about time, so a stage that reported none is left out of it.
    // Which model was in use belongs beside the turn, not here.
    if (stage.ttfb == null && stage.total == null) continue;
    const bits = [stage.kind];
    if (stage.ttfb != null) bits.push(secs(stage.ttfb));
    if (stage.total != null) bits.push("total " + secs(stage.total));
    parts.push(bits.join(" "));
  }
  for (const tool of rec.tools || []) parts.push(tool.name + " " + secs(tool.seconds));
  if (rec.interrupted) parts.push("interrupted");
  return parts.join("  ·  ");
}
function secs(v){
  if (v == null) return 'not reported';
  if (v === 0) return '0ms';
  if (v < .001) return '<1ms';
  const ms=Math.round(v*1000);
  return ms < 1000 ? ms+'ms' : v.toFixed(2)+'s';
}

function logMatches(row, needle, kind){
  if (kind === "output" && row.kind !== "output") return false;
  if (kind === "metric" && row.kind !== "metric") return false;
  if (kind === "flagged" && !row.flagged) return false;
  return !needle || row.text.toLowerCase().includes(needle);
}

function renderLog(){
  const needle = el.logfilter.value.trim().toLowerCase();
  const kind = document.querySelector(".kind[aria-pressed='true']").dataset.kind;
  const atBottom = el.loglist.scrollHeight - el.loglist.scrollTop - el.loglist.clientHeight < 80;
  const frag = document.createDocumentFragment();
  let shown = 0;
  for (const row of logRows){
    if (!logMatches(row, needle, kind)) continue;
    const line = document.createElement("span");
    line.className = "logrow" + (row.flagged ? " flagged" : "") + (row.kind === "metric" ? " metric" : "");
    line.textContent = row.text;
    frag.appendChild(line);
    shown++;
  }
  el.loglist.replaceChildren(frag);
  if (!shown){
    const empty = document.createElement("div");
    empty.className = "logempty";
    empty.textContent = logRows.length ? "nothing matches that filter" : "waiting for output…";
    el.loglist.appendChild(empty);
  }
  if (atBottom) el.loglist.scrollTop = el.loglist.scrollHeight;
}

el.logfilter.addEventListener("input", renderLog);
for (const button of document.querySelectorAll(".kind")){
  button.addEventListener("click", () => {
    for (const other of document.querySelectorAll(".kind"))
      other.setAttribute("aria-pressed", String(other === button));
    renderLog();
  });
}

// EventSource, not a WebSocket: it reconnects on its own and replays with
// Last-Event-ID, which is exactly the behaviour the server's buffer expects.
function startEventStream(){
  if (DEMO || !window.EventSource) return;
  const es = new EventSource("/api/events");
  es.addEventListener('open',()=>{feedFresh=true;renderFeed();});
  es.addEventListener('error',()=>{feedFresh=false;renderFeed();});
  es.addEventListener("message", (e) => {
    let ev;
    try { ev = JSON.parse(e.data); } catch { historyGap=true;renderFeed();return; }
    if (ev.stream_id && ev.stream_id!==feedStream){
      if (feedStream && selectedCallID) historyGap=true;
      feedStream=ev.stream_id;feedSequence=0;
    }
    if (ev.seq){
      if (ev.seq<=feedSequence) return;
      if (feedSequence && ev.seq!==feedSequence+1) historyGap=true;
      feedSequence=ev.seq;
    }
    if (ev.t==='gap' || ev.reason) historyGap=true;
    feedFresh=true;
    renderFeed();
    if (ev.t === "state") setRunState(ev.state);
    else if (ev.t === "log") pushLogRow({kind:"output", text: ev.text || "", flagged: !!ev.flagged});
    else if (ev.t === "metric"){
      const text=metricText(ev.record);
      if (text) pushLogRow({kind:"metric", text, flagged:false});
      attachRecord(ev.record);
    }
  });
}

const RUN_TAG = {idle:"ready", connecting:"connecting", connected:"live", error:"error"};
function setState(s, label, hint){
  el.body.dataset.state = s;
  el.runtag.textContent = RUN_TAG[s];
  el.state.innerHTML = label + (s === "idle" ? ' <span class="cursor">▍</span>' : "");
  if (hint !== undefined) el.hint.textContent = hint;
}
function setBars(v){ for (const b of bars) b.style.transform = `scaleY(${Math.max(0.08, v)})`; }
function audioConstraint(){ return selectedDeviceId ? { deviceId: { exact: selectedDeviceId } } : true; }

// Identified snapshots are the sole dev conversation source. Audio callbacks
// retain connection and playback duties; they never guess which row owns text.
let selectedCallID = null, connectionGeneration = 0, connecting = false;
let locallyEnded = false, connectionLost = false;
let feedFresh=false, historyGap=false, feedStream=null, feedSequence=0;
const records = new Map(), recordNodes = new Map(), exchangeNodes = new Map(), messageNodes = new Map();

function node(tag, className, text){
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text !== undefined) element.textContent = text;
  return element;
}
function setText(element, text){
  if (element.textContent !== text) element.textContent = text;
}
function ordered(parent, element, order, tie=0){
  element.dataset.order = String(order);
  element.dataset.tie = String(tie);
  const before = Array.from(parent.children).find(child => child !== element &&
    (Number(child.dataset.order) > order || (Number(child.dataset.order) === order && Number(child.dataset.tie || 0) > tie))) || null;
  if (element.parentNode !== parent || element.nextElementSibling !== before) parent.insertBefore(element, before);
}
function clearTranscript(){
  el.tlist.replaceChildren();
  el.diagnosticList.replaceChildren();
  el.diagnostics.open=false;
  el.diagnostics.hidden=true;
  records.clear(); recordNodes.clear(); exchangeNodes.clear(); messageNodes.clear();
  selectedCallID = null;
  locallyEnded = false;
  connectionLost = false;
  historyGap = false;
  renderFeed();
  el.body.dataset.hasHistory = 'false';
  el.latest.hidden=true;
  savedReading={following:true};
  if (currentView==='metrics') renderMetrics();
}
function nearBottom(){return el.tlist.scrollHeight-el.tlist.scrollTop-el.tlist.clientHeight < 64;}
function readingPosition(){
  if (currentView!=='conversation') return null;
  const {top,bottom}=el.tlist.getBoundingClientRect();
  const selected=window.getSelection()?.anchorNode;
  const selectedElement=selected?.nodeType===1?selected:selected?.parentElement;
  const visible=element=>element && el.tlist.contains(element) && element.getBoundingClientRect().bottom>top && element.getBoundingClientRect().top<bottom;
  // Prefer what the reader selected; an enclosing exchange can grow above it.
  const anchor=visible(selectedElement)?selectedElement:Array.from(el.tlist.querySelectorAll('[data-kind],summary')).find(child=>visible(child)&&child.getBoundingClientRect().top>=top)
    || Array.from(el.tlist.children).find(visible);
  return {following:nearBottom(),anchor,offset:anchor?anchor.getBoundingClientRect().top-top:0};
}
function restoreReading(position){
  if (!position || currentView!=='conversation') return;
  if (position.following) el.tlist.scrollTop=el.tlist.scrollHeight;
  else if (position.anchor?.isConnected) el.tlist.scrollTop+=position.anchor.getBoundingClientRect().top-el.tlist.getBoundingClientRect().top-position.offset;
}
el.latest.addEventListener('click',()=>{el.tlist.scrollTop=el.tlist.scrollHeight;});
el.transcript.addEventListener('click',event=>{
  if (!event.target.closest('summary')) return;
  const reading=readingPosition();
  requestAnimationFrame(()=>restoreReading(reading));
});
// Display-only groups in the inspector. Exchange groups are 'exchange:'+id, so
// a native ID can never collide with these.
const DIAGNOSTIC_GROUPS = ['reply-time','call-details','unassigned'];
function exchangeNode(id, order){
  if (!exchangeNodes.has(id)){
    const element = node('section','exchange');
    element.dataset.exchange = id.startsWith('exchange:') ? id.slice(9) : id;
    const status = node('div','exchange-status');
    const content = node('div','exchange-content');
    const activity = node('div','activity');
    const details = node('details','measurements');
    const summary = node('div','metrics-summary');
    const debugSummary = node('summary',undefined,'Debug details');
    const values = node('div');
    const note = node('p','source-note');
    // The reply's measurements read as one card under its text: the summary line,
    // a row per operation, and the debug details folded inside.
    const card = node('div','request');
    details.append(debugSummary,values,note);
    details.hidden=true;
    card.append(summary,activity,details);
    card.hidden=true;
    element.append(content,status,card);
    exchangeNodes.set(id,{element,status,content,card,activity,details,summary,values,note});
    ordered(DIAGNOSTIC_GROUPS.includes(id)?el.diagnosticList:el.tlist,element,order);
  }
  return exchangeNodes.get(id);
}
function renderExchange(id){
  const view = exchangeNodes.get(id);
  if (!view) return;
  const record = records.get(id), data = record?.exchange;
  if (record){
    const input=data?.role==='response' && data.link_status==='known' ? records.get('exchange:'+data.input_id) : null;
    // Speech can be created before its input commits. A proven link places it
    // after that input; source order keeps multiple replies to one input stable.
    const linked=input?.exchange.role==='input';
    ordered(el.tlist,view.element,linked?input.order:record.order,linked?record.order:0);
  }
  let state = data?.state || 'unknown';
  if (locallyEnded && state === 'open') state = 'incomplete';
  const assistant = data?.role === 'response' || !!view.content.querySelector('[data-speaker="assistant"]');
  const labels = {open:'generating',ended:'text complete',interrupted:'interrupted',incomplete:'incomplete'};
  let label = ['unknown','open','ended'].includes(state) ? '' : state;
  if (assistant) label = ['generated',labels[state],data?.playback && data.playback!=='unknown' ? 'audio '+data.playback.replaceAll('_',' ') : ''].filter(Boolean).join(' · ');
  if ((!feedFresh||historyGap) && state==='open' && label) label='last known: '+label;
  setText(view.status,label);
  view.status.hidden = !label;
  view.element.dataset.state = state;
}

function renderFeed(){
  const label=(feedFresh?'Live data connected':'Live data reconnecting')+(historyGap?' · incomplete history':'');
  if (el.feed.textContent===label) return;
  const reading=readingPosition();
  setText(el.feed,label);
  for (const id of exchangeNodes.keys()) renderExchange(id);
  renderData();
  restoreReading(reading);
}

// Namespace native IDs separately from display-only groups. IDs are opaque.
function operationGroup(data){return data.exchange_id ? 'exchange:'+data.exchange_id : 'unassigned';}
function measurementGroup(data){
  if (data.scope==='call') return 'call-details';
  const exchangeID=data.exchange_id || records.get('operation:'+data.operation_id)?.operation.exchange_id;
  return exchangeID ? 'exchange:'+exchangeID : 'unassigned';
}
function operationLabel(record){
  const data=record.operation;
  if (data.type!=='llm') return data.type.toUpperCase()+' · '+data.name;
  const peers=Array.from(records.values()).filter(r=>r.operation?.type==='llm' && operationGroup(r.operation)===operationGroup(data)).sort((a,b)=>a.order-b.order);
  return 'LLM '+(peers.findIndex(r=>r.id===record.id)+1);
}
function metricLabel(data, operation){
  if (data.metric==='first_response'){
    if (operation?.type==='tts' || data.source.includes('ttfb')) return 'TTFB';
    if (data.source.includes('ttft')) return 'TTFT';
  }
  return data.metric.replaceAll('_',' ');
}
function renderData(){
  // ponytail: scan retained call snapshots; index per group if long-call replay gets slow.
  const all=Array.from(records.values());
  const focused=document.activeElement;
  const focusedDiagnostics=el.diagnostics.contains(focused);
  let movedFocus=null;
  // Build operation rows before attaching their measurements, even on late association.
  for (const record of all.filter(r=>r.operation).concat(all.filter(r=>r.measurement))){
    const key=record.kind+':'+record.id, data=record[record.kind];
    if (record.measurement && data.state!=='measured'){
      recordNodes.get(key)?.remove();
      continue;
    }
    const groupID=record.operation ? operationGroup(data) : measurementGroup(data);
    const view=exchangeNode(groupID,record.order);
    let row=recordNodes.get(key);
    if (!row){
      row=node('div',record.measurement?'measurement':'operation');
      row.dataset.kind=record.kind;row.dataset.id=record.id;
      row.append(node('span','measurement-label'),node('span',record.operation?'operation-metrics':'measurement-note'));
      recordNodes.set(key,row);
    }
    const previousDetails=row.closest('section')?.querySelector('details');
    if (previousDetails && previousDetails!==view.details){
      if (previousDetails.open) view.details.open=true;
      if (focused===previousDetails.querySelector('summary') ||

      const state=data.state==='running' ? terminal?'incomplete (last seen running)':(!feedFresh||historyGap)?'last seen running':data.state : data.state;
      row.dataset.state=state;

      // and each carries the text that explains it.
      setText(row.firstChild,operationLabel(record)+' · '+state.replaceAll('_',' ')+(data.reason?' · '+data.reason:''));

      const primary=operation && operationGroup(operation.operation)===groupID && (data.metric==='first_response' ||
        (operation.operation.type==='llm' && data.metric==='request_duration') || data.metric==='tool_duration');
      setText(row.firstChild,(primary?'':label+' · ')+metricLabel(data,operation?.operation)+' '+secs(data.value));
      setText(row.lastChild,primary?'':[data.source,data.model,data.provider].filter(value=>value && value!=='unknown').join(' · '));

    } else setText(view.summary,id==='reply-time'?'Reply time':id==='call-details'?'Call measurements':id==='unassigned'?'Unassigned activity and measurements':'Input measurements');
    view.card.hidden=view.summary.hidden=!(operations.length||measurements.length||breakdowns||callError);
    view.element.hidden=!(view.content.querySelector('.segment:not([hidden])') || operations.length || measurements.length || breakdowns || callError || (response && exchange.state==='open'));
    setText(view.note,operations.map(r=>[operationLabel(r),r.operation.name,r.operation.model,r.operation.provider,r.operation.source_request_id].filter(value=>value && value!=='unknown').join(' · '))
      .concat(measurements.filter(r=>r.measurement.operation_id).map(r=>{
        const m=r.measurement,op=records.get('operation:'+m.operation_id);
        return [op?operationLabel(op):'',metricLabel(m,op?.operation),m.source,m.model,m.provider].filter(value=>value && value!=='unknown').join(' · ');
      })).join('\n'));

  }
  for (const [id,view] of exchangeNodes)
    if (!view.content.childNodes.length && !view.activity.childNodes.length && !view.values.childNodes.length && !records.has(id)){
      view.element.remove();exchangeNodes.delete(id);
    }

  if (currentView==='metrics') renderMetrics();

    (movedFocus || el.connect).focus({preventScroll:true});
}
// ── metrics view ────────────────────────────────────────
// The studio's Metrics page, built only from this call's records: nothing here
// is measured twice or kept anywhere else.
//
// What counts as slow, in milliseconds except LLM requests per reply, which is
// a count. These are the studio's defaults, Limits in slng-ai/unmute-beat
// studio/src/studio/metrics/models.py: change them there and here together.
const LIMITS = {
  reply_latency:      {slow:1000, bad:1500, what:'Reply latency'},
  llm_first_token:    {slow:600,  bad:700,  what:'LLM first token'},
  llm_request:        {slow:1000, bad:1500, what:'LLM request that did not stream'},
  tts_first_byte:     {slow:300,  bad:400,  what:'TTS first audio'},
  requests_per_reply: {slow:1,    bad:2,    what:'LLM requests in one reply', count:true},

const FAILED = ['failed','timed_out'];

function level(value, key){
  if (value == null) return 'ok';
  const limit=LIMITS[key], v=limit.count ? value : value*1000;
  return v>limit.bad ? 'bad' : v>limit.slow ? 'slow' : 'ok';
}
function over(value, key){
  const limit=LIMITS[key], lv=level(value,key);
  return limit.what+' over '+(lv==='bad'?limit.bad:limit.slow)+(limit.count?'':'ms');

// The 90th percentile, inclusive, the number a studio tile shows.
function p90(values){

  return low+1<sorted.length ? sorted[low]+(sorted[low+1]-sorted[low])*(at-low) : sorted[low];
}
// Which first byte a measurement is, by its request, or by its source when it
// has none. Sources name the service, not only the clock: Pipecat's STT first
// byte is pipecat-stt-ttfb, so "ttfb" alone does not mean speech output.
function firstKind(m){
  if (m.metric!=='first_response') return '';
  const op=records.get('operation:'+m.operation_id)?.operation;
  if (op) return op.type;
  const source=m.source.toLowerCase();
  return source.includes('stt') ? 'stt' : source.includes('tts') ? 'tts' : source.includes('llm') || source.includes('ttft') ? 'llm' : '';

function h(tag, className, ...children){

}
function none(){ return h('span','dim','—'); }
function table(label, heads, rows){

    h('thead',undefined,h('tr',undefined,...heads.map(head=>h('th','lbl',head)))),
    h('tbody',undefined,...rows)));

}
function renderMetrics(){
  const all=Array.from(records.values()).sort((a,b)=>a.order-b.order);
  const measured=all.filter(r=>r.measurement?.state==='measured').map(r=>r.measurement);
  const operations=all.filter(r=>r.operation);
  const byOperation=(id,metric)=>measured.find(m=>m.operation_id===id && m.metric===metric)?.value;
  // LiveKit reports a first byte twice: on its request, and again as a node

  // names no request counts only where no request of that kind reported one.
  const firsts=type=>{
    const own=measured.filter(m=>m.operation_id && firstKind(m)===type);
    const covered=new Set(own.map(m=>measurementGroup(m)));
    return own.concat(measured.filter(m=>!m.operation_id && firstKind(m)===type && !covered.has(measurementGroup(m)))).map(m=>m.value);
  };

  const replies=all.filter(r=>r.exchange?.role==='response' &&

    h('span','tile-value'+(value==null?' dim':key?' lv-'+level(value,key):''),value==null?'—':secs(value)),h('span','tile-note',note));
  const target=key=>'target ≤ '+LIMITS[key].slow+'ms';
  const main=h('section','metrics-main');

  main.append(h('div','lbl','Replies, in order'));
  if (!replies.length) main.append(h('p','empty','No timed replies yet. Connect and talk to your agent; each reply shows here as its timings arrive.'));
  else main.append(table('Replies, in order',['Reply','Reply latency','LLM','TTS','Tools','Flags'],replies.map((r,i)=>{
    const group='exchange:'+r.id, flags=[];
    const ops=operations.filter(o=>operationGroup(o.operation)===group);
    const latency=measured.find(m=>m.metric==='reply_latency' && measurementGroup(m)===group)?.value;
    if (level(latency,'reply_latency')!=='ok') flags.push([over(latency,'reply_latency'),level(latency,'reply_latency')]);
    // One line per request: its first byte, or for an LLM that did not stream,
    // its duration, coloured by the limit it is judged by.
    const cell=type=>{
      const lines=ops.filter(o=>o.operation.type===type).map(o=>{
        const op=o.operation, first=byOperation(o.id,'first_response'), duration=byOperation(o.id,'request_duration');
        if (FAILED.includes(op.state)){ flags.push([operationLabel(o)+' '+op.state.replaceAll('_',' '),'bad']); return h('div','lv-bad',op.state.replaceAll('_',' ')); }
        if (first!=null){
          const key=type==='llm'?'llm_first_token':'tts_first_byte', lv=level(first,key);
          if (lv!=='ok') flags.push([over(first,key),lv]);
          return h('div','lv-'+lv,secs(first));
        }
        if (op.state==='cancelled') return h('div','dim','cancelled'+(duration!=null?' · '+secs(duration):''));
        if (type==='llm' && duration!=null){
          const lv=level(duration,'llm_request');
          if (lv!=='ok') flags.push([over(duration,'llm_request'),lv]);
          return h('div','lv-'+lv,h('span','dim','— · '),secs(duration));
        }

      }).filter(Boolean);
      // A first byte that names no request belongs to the reply, unless a
      // request of that kind already reported its own: then it is the same
      // moment measured twice, and counting it would double the line.
      const own=ops.some(o=>o.operation.type===type && byOperation(o.id,'first_response')!=null);

    const models=ops.filter(o=>o.operation.type==='llm').length;
    if (level(models,'requests_per_reply')!=='ok') flags.push([models+' LLM requests in one reply',level(models,'requests_per_reply')]);
    const tools=ops.filter(o=>o.operation.type==='tool').map(o=>{
      const duration=byOperation(o.id,'tool_duration'), state=o.operation.state;
      if (FAILED.includes(state)) flags.push([operationLabel(o)+' '+state.replaceAll('_',' '),'bad']);
      return h('div',FAILED.includes(state)?'lv-bad':undefined,o.operation.name+' '+(duration!=null?secs(duration):state.replaceAll('_',' ')));
    });
    const seen=new Set(), shown=flags.filter(([what])=>!seen.has(what) && seen.add(what));
    return h('tr',undefined,
      h('th','mono','R'+(i+1)+(r.exchange.state==='interrupted'?' ⤺':'')),
      h('td',latency!=null?'lv-'+level(latency,'reply_latency'):undefined,latency!=null?secs(latency):none()),
      h('td',undefined,...llm),h('td',undefined,...tts),
      h('td','small',...(tools.length?tools:[none()])),
      h('td','flags',...(shown.length?shown.map(([what,lv])=>h('div','lv-'+lv,what)):[none()])));
  })));
  if (replies.length && measured.some(m=>m.metric==='reply_latency' && measurementGroup(m)==='unassigned'))
    main.append(h('p','hint','Some reply latencies name no reply, as on Pipecat. They count in the tiles and are split part by part below, not matched to a row here.'));

  // Reply time, part by part. A breakdown names no reply, so its rows are in
  // the order they arrived and are not matched to the replies above.
  const breakdowns=all.filter(r=>r.breakdown).map(r=>r.breakdown);
  if (breakdowns.length){
    const parts=[], owners=new Set();
    for (const b of breakdowns) for (const part of b.parts){
      if (!parts.some(p=>p.key===part.key)) parts.push(part);
      owners.add(part.label+': '+part.owner);
    }
    main.append(h('div','lbl','Reply time, part by part · the parts add up to the total'),
      table('Reply time, part by part',['In order','Total',...parts.map(p=>p.label),'Measured from'],breakdowns.map((b,i)=>h('tr',undefined,
        h('th','mono',String(i+1)),
        h('td','lv-'+level(b.total_secs,'reply_latency'),secs(b.total_secs)),
        ...parts.map(p=>{const part=b.parts.find(x=>x.key===p.key);return h('td',undefined,part?secs(part.duration_secs):none());}),
        h('td','dim small',b.measured_from==='client_connected'?'client connecting':'caller falling silent')))),
      h('p','hint','owners · '+Array.from(owners).join(' · ')+'. A breakdown carries no reply id, so these rows are in arrival order.'));
  }

  // Latency by model: each model on its own row, so a swap mid-call is two rows.
  const kinds={stt:'STT',llm:'LLM',tts:'TTS'}, groups=new Map();
  for (const o of operations.filter(o=>kinds[o.operation.type])){
    const op=o.operation, key=JSON.stringify([op.type,op.model||'',op.provider||'']);
    if (!groups.has(key)) groups.set(key,{op,requests:[]});
    groups.get(key).requests.push(o);
  }
  if (groups.size){
    main.append(h('div','lbl','Latency by model'),table('Latency by model',
      ['Kind','Model','Provider','Requests','First byte p90','Total p90','Errors','Share over the limit'],
      Array.from(groups.values()).map(({op,requests})=>{
        const firsts=requests.map(o=>byOperation(o.id,'first_response')).filter(v=>v!=null);
        const totals=requests.map(o=>byOperation(o.id,'request_duration')).filter(v=>v!=null);
        const failed=requests.filter(o=>FAILED.includes(o.operation.state)).length;
        // A request is judged by its first byte, or for an LLM that did not stream, its duration.
        const judged=requests.map(o=>{

        return h('tr',undefined,h('th','mono',kinds[op.type]),

  const rules=h('aside','rules',h('div','lbl','What counts as slow'),
    ...Object.values(LIMITS).map(limit=>h('div','rule',h('span',undefined,limit.what),
      h('span','mono lv-slow','> '+limit.slow+(limit.count?'':'ms')),h('span','mono lv-bad','> '+limit.bad+(limit.count?'':'ms')))),
    h('div','rules-note','slow · over the limit · defaults for every agent · tiles are p90'));

  el.metrics.replaceChildren(
    h('div','metrics-head',h('div','lbl','this call · '+AGENT+' · from the live data feed'),h('h1',undefined,'Timings')),

        h('span','tile-note',replies.length+' repl'+(replies.length===1?'y':'ies')+' · '+(selectedCallID?'1 call':'no call yet')))),

function renderText(record){
  const data = record.text;
  // ponytail: scan this call's snapshots; index messages if long-call replay makes this hot.
  const siblings = Array.from(records.values()).filter(r => r.text?.message_id === data.message_id && r.text.speaker === data.speaker);
  const parents = new Set(siblings.map(r => r.text.exchange_id).filter(Boolean));
  const exchangeID = data.exchange_id || (parents.size === 1 ? parents.values().next().value : null);
  const groupID = exchangeID ? 'exchange:'+exchangeID : 'unassigned:'+JSON.stringify([data.speaker,data.message_id]);
  const group = exchangeNode(groupID,record.order);
  const messageKey = JSON.stringify([data.speaker,data.message_id,parents.size > 1 ? groupID : '']);
  let message = messageNodes.get(messageKey);
  if (!message){
    const element=node('div','turn '+(data.speaker==='user'?'you':'bot'));
    element.dataset.speaker = data.speaker;
    element.dataset.message = data.message_id;
    const said=node('div','said');
    element.append(node('span','who',data.speaker==='user'?'you':AGENT),said);
    message={element,said,order:record.order};
    messageNodes.set(messageKey,message);
  }
  message.order = Math.min(message.order, record.order);
  ordered(group.content,message.element,message.order);

  if (!span){
    span=node('span','segment');
    span.dataset.kind='text';span.dataset.id=record.id;
    recordNodes.set('text:'+record.id,span);
  }
  span.dataset.state=locallyEnded && data.state==='provisional'?'incomplete':data.state;
  span.hidden = data.text.length === 0;
  setText(span,data.separator_before+data.text);
  ordered(message.said,span,record.order);
  renderExchange(groupID);
}
function attachRecord(record){
  if (!record || record.version!==2 || record.call_id!==selectedCallID) return;
  const key=record.kind+':'+record.id, prior=records.get(key);
  if (prior && record.revision<=prior.revision) return;
  if (prior?.text?.state==='final' && record.text?.state==='provisional') return;
  const reading=readingPosition();
  const selection=window.getSelection();
  const selected=selection && !selection.isCollapsed && el.transcript.contains(selection.anchorNode) && el.transcript.contains(selection.focusNode)
    ? [selection.anchorNode,selection.anchorOffset,selection.focusNode,selection.focusOffset] : null;
  const focused=document.activeElement;
  records.set(key,record);
  if (record.kind==='text'){
    // A proven link on one segment applies to the shared message, even when
    // another segment's later correction has no new association information.
    for (const sibling of records.values())
      if (sibling.text?.message_id === record.text.message_id && sibling.text.speaker === record.text.speaker) renderText(sibling);
    for (const [id,message] of messageNodes) if (!message.said.childNodes.length){message.element.remove();messageNodes.delete(id);}
    for (const [id,view] of exchangeNodes) if (!view.content.childNodes.length && !view.activity.childNodes.length && !view.values.childNodes.length && !records.has(id)){view.element.remove();exchangeNodes.delete(id);}
  }
  else if (record.kind==='exchange'){
    exchangeNode(key,record.order);
    for (const id of exchangeNodes.keys()) renderExchange(id);
  }
  else if (record.kind==='call'){
    if (record.call.state!=='open') endConversation();
    // The final runtime snapshot can arrive after WebRTC has disconnected.
    if (connectionLost && ready && record.call.state==='ended'){
      connectionLost=false;
      setState('idle','ready','press connect and talk to your agent');
    }
    for (const id of exchangeNodes.keys()) renderExchange(id);
  }
  renderData();
  if (focused.isConnected && focused.checkVisibility() && document.activeElement!==focused) focused.focus({preventScroll:true});
  if (selected && selected[0].isConnected && selected[2].isConnected) selection.setBaseAndExtent(...selected);
  el.body.dataset.hasHistory=String(exchangeNodes.size>0);
  el.latest.hidden=exchangeNodes.size===0;
  restoreReading(reading);
}
function endConversation(){
  const reading=readingPosition();
  locallyEnded=true;
  for (const record of records.values()) if (record.kind==='text') renderText(record);
  for (const id of exchangeNodes.keys()) renderExchange(id);
  renderData();
  restoreReading(reading);
}
function currentConnection(session){return session.generation===connectionGeneration && session.call_id===selectedCallID;}

// ── meters: one mixed (mic + agent) for the stage, one mic-only for the control ──
// Two analysers off one context. The stage meter answers "is anything happening",
// the level inside the microphone control answers "is it hearing me", and those
// are different questions — a mixed reading rises when the agent talks.
function ensureAudio(){
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 64;
  micAnalyser = audioCtx.createAnalyser();
  micAnalyser.fftSize = 64;
  const freq = new Uint8Array(analyser.frequencyBinCount);
  const micFreq = new Uint8Array(micAnalyser.frequencyBinCount);
  const tick = () => {
    analyser.getByteFrequencyData(freq);
    for (let i = 0; i < BARS; i++){
      const v = (freq[Math.floor(i * freq.length / BARS)] || 0) / 255;
      bars[i].style.transform = `scaleY(${Math.max(0.08, v)})`;
    }
    if (micNode && micState === "live"){
      micAnalyser.getByteFrequencyData(micFreq);
      let peak = 0;
      for (const v of micFreq) if (v > peak) peak = v;
      el.micLevel.style.transform = `scaleX(${Math.min(1, (peak / 255) * 1.6)})`;
    }
    raf = requestAnimationFrame(tick);
  };
  tick();
}
function startMeter(remoteStream){
  ensureAudio();
  if (remoteNode) { try { remoteNode.disconnect(); } catch {} }
  remoteNode = audioCtx.createMediaStreamSource(remoteStream);
  remoteNode.connect(analyser);                       // agent voice
  if (mic) reconnectMic(mic);                         // your voice, if it is already up
}
// Called on both transports. On livekit `mic` is a MediaStream wrapped around the
// published track, so the level works there too rather than only on pipecat.
function reconnectMic(stream){
  ensureAudio();
  if (micNode) { try { micNode.disconnect(); } catch {} }
  micNode = audioCtx.createMediaStreamSource(stream);
  micNode.connect(analyser);                          // analyser only — never to destination (no feedback)
  micNode.connect(micAnalyser);
}
function stopMeter(){
  cancelAnimationFrame(raf); raf = 0;
  if (audioCtx) audioCtx.close();
  audioCtx = analyser = micAnalyser = micNode = remoteNode = null;
  setBars(0.08);
  el.micLevel.style.transform = "scaleX(0)";
}

// ── shared teardown (either transport) ──────────────────
function teardown(state, hint){
  ++connectionGeneration;
  connecting = false;
  connectionLost = state === 'disconnected';
  if (connectionLost){
    state = ready && records.get('call:call')?.call.state === 'ended' ? 'idle' : 'error';
    hint = 'connection lost';
  }
  endConversation();
  stopMeter();
  clearInterval(clientReadyTimer); clientReadyTimer = 0;
  const oldChannel = dc, oldPeer = pc, oldRoom = room;
  dc = pc = room = null;
  if (oldChannel){ try { oldChannel.close(); } catch {} }
  if (oldPeer) oldPeer.close();
  if (oldRoom){ try { oldRoom.disconnect(); } catch {} }
  pcId = null;
  if (mic){ mic.getTracks().forEach(t => t.stop()); mic = null; }
  el.remote.srcObject = null;
  setMicUnavailable();
  el.connect.textContent = "connect";
  el.connect.disabled = !ready;
  transport = null;
  setState(state, state === "error" ? "error" : "ready",
    state === "error" ? hint : "press connect and talk to your agent");
}

// ── microphone: the control names the state, styling carries the affordance ──
const MIC_LABEL = {unavailable:"MIC —", live:"MIC LIVE", muted:"MIC MUTED"};
function renderMic(){
  el.mute.dataset.mic = micState;
  el.mute.disabled = micState === "unavailable";
  el.micText.textContent = MIC_LABEL[micState];
  el.mute.setAttribute("aria-label", MIC_LABEL[micState]);
  el.body.classList.toggle("muted", micState === "muted");
  if (micState !== "live") el.micLevel.style.transform = "scaleX(0)";
}
function setMuted(v){
  muted = v;
  micState = v ? "muted" : "live";
  renderMic();
  if (mic) mic.getAudioTracks().forEach(t => t.enabled = !muted);        // pipecat
  if (room) { try { room.localParticipant.setMicrophoneEnabled(!muted); } catch {} } // livekit
}
function setMicUnavailable(){
  muted = false; micState = "unavailable"; holding = false;
  renderMic();
}
function toggleMute(){
  if (micState === "unavailable") return;             // inert, not silently ignored elsewhere
  setMuted(!muted);
}

// ── keyboard: toggle key and hold-to-talk ────────────────
// Push-to-talk is the only way to test barge-in deliberately instead of by
// talking over yourself, so SPACE has to reach here even when a button holds
// focus — otherwise it activates that button and ends the call.
function typingTarget(t){
  if (!t) return false;
  if (t.closest?.('.transcript summary,.transcript button')) return true;
  const tag = (t.tagName || "").toLowerCase();
  return tag === "a" || tag === "input" || tag === "textarea" || tag === "select" || t.isContentEditable;
}
document.addEventListener("keydown", (e) => {
  if (typingTarget(e.target) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "m" || e.key === "M"){
    e.preventDefault();
    if (e.repeat) return;
    toggleMute();
  } else if (e.key === " "){
    e.preventDefault();                               // stops button activation and page scroll
    if (e.repeat || holding || micState === "unavailable") return;
    holding = true; heldWasMuted = muted;
    if (muted) setMuted(false);                       // reads exactly as a latched MIC LIVE
  }
});
document.addEventListener("keyup", (e) => {
  if (e.key !== " " || !holding) return;
  e.preventDefault();
  holding = false;
  if (heldWasMuted && micState !== "unavailable") setMuted(true);
});

// ── bootstrap: ask the CLI which transport this target uses ──
async function connect(){
  if (DEMO) return simulate();
  if (transport || connecting) return;
  clearTranscript();
  connecting = true;
  const generation = ++connectionGeneration;
  el.connect.textContent = 'cancel';
  setState('connecting','connecting','reaching the agent');
  try {
    const res = await fetch('/api/session');
    if (!res.ok) throw new Error('session '+res.status);
    const session = await res.json();
    if (generation !== connectionGeneration) return;
    if (session.ready === false){
      teardown('idle');
      el.hint.textContent = 'the agent is not running yet; see the output';
      if (!viewPinned) showView('logs');
      return;
    }
    if (session.dev_events_version !== 2 || !session.call_id) throw new Error('streaming session identity unavailable');
    selectedCallID = session.call_id;
    session.generation = generation;
    transport = session.kind;
    if (session.kind === 'livekit') await connectLivekit(session);
    else await connectPipecat(session);
  } catch (err){
    if (generation === connectionGeneration) teardown('error', String(err.message || err));
  }
}

// ── pipecat transport: WebRTC offer → containerized bot ──
async function refreshMics(){
  let devices;
  if (DEMO){
    devices = [{deviceId:"builtin",label:"MacBook Pro Microphone"},
               {deviceId:"usb",label:"Shure MV7 (USB)"}];
  } else {
    try { devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "audioinput"); }
    catch { devices = []; }
  }
  el.micsel.innerHTML = "";
  devices.forEach((d, i) => {
    const o = document.createElement("option");
    o.value = d.deviceId;
    o.textContent = d.label || `Microphone ${i + 1}`;
    if (d.deviceId === selectedDeviceId) o.selected = true;
    el.micsel.appendChild(o);
  });
  el.microw.hidden = devices.length < 2;              // only offer a choice when there is one
}

el.micsel.addEventListener("change", async () => {
  selectedDeviceId = el.micsel.value || null;
  if (DEMO || el.body.dataset.state !== "connected") return;
  if (transport === "webrtc-offer") await swapMic();
  else if (room) await swapMicLivekit();
});

async function swapMic(){
  try {
    const next = await navigator.mediaDevices.getUserMedia({ audio: audioConstraint() });
    const track = next.getAudioTracks()[0];
    track.enabled = !muted;
    const sender = pc.getSenders().find(s => s.track && s.track.kind === "audio");
    if (sender) await sender.replaceTrack(track);     // hot-swap, no renegotiation
    mic.getTracks().forEach(t => t.stop());
    mic = next;
    reconnectMic(next);                               // re-tap into the meter
  } catch { /* keep the existing mic on failure */ }
}

async function waitForIce(pc){
  if (pc.iceGatheringState === "complete") return;
  await new Promise(res => {
    const check = () => { if (pc.iceGatheringState === "complete"){ pc.removeEventListener("icegatheringstatechange", check); res(); } };
    pc.addEventListener("icegatheringstatechange", check);
  });
}

async function waitForPeer(pc){
  if (pc.connectionState === "connected") return;
  await new Promise((resolve, reject) => {
    const timeout = setTimeout(() => finish(new Error("WebRTC connection timed out")), 15000);
    const check = () => {
      if (pc.connectionState === "connected") finish();
      else if (["failed","disconnected","closed"].includes(pc.connectionState))
        finish(new Error("WebRTC connection " + pc.connectionState));
    };
    const finish = (err) => {
      clearTimeout(timeout);
      pc.removeEventListener("connectionstatechange", check);
      err ? reject(err) : resolve();
    };
    pc.addEventListener("connectionstatechange", check);
    check();
  });
}

// RTVI only acknowledges readiness; identified dev events own the transcript.
function handleRtvi(msg){
  if (msg.type === "bot-ready"){
    clearInterval(clientReadyTimer); clientReadyTimer = 0;
  }
}

let clientReadyTimer = 0;
function sendClientReady(){
  if (!dc || dc.readyState !== "open") return;
  dc.send(JSON.stringify({
    label:"rtvi-ai", type:"client-ready", id:"unmute-dev-ready",
    data:{version:"2.0.0", about:{library:"unmute-dev", platform:"web"}},
  }));
}

async function connectPipecat(session){
  const offerUrl = session.offerUrl || '/api/offer';
  setState('connecting','connecting','requesting microphone');
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:audioConstraint()});
    if (!currentConnection(session)){stream.getTracks().forEach(t=>t.stop());return;}
    if (!selectedDeviceId){
      selectedDeviceId = stream.getAudioTracks()[0].getSettings().deviceId || null;
      if (selectedDeviceId){
        stream.getTracks().forEach(t=>t.stop());
        stream = await navigator.mediaDevices.getUserMedia({audio:audioConstraint()});
        if (!currentConnection(session)){stream.getTracks().forEach(t=>t.stop());return;}
      }
    }
    mic = stream;
    await refreshMics();
    if (!currentConnection(session)) return;
  } catch {
    if (currentConnection(session)) teardown('error','microphone permission denied');
    return;
  }
  const peer = new RTCPeerConnection();
  pc = peer;
  try {
    stream.getTracks().forEach(t=>peer.addTrack(t,stream));
    peer.addEventListener('track',e=>{
      if (!currentConnection(session)) return;
      el.remote.srcObject=e.streams[0];startMeter(e.streams[0]);
    });
    peer.addEventListener('connectionstatechange',()=>{
      if (currentConnection(session) && ['failed','disconnected','closed'].includes(peer.connectionState)) teardown('disconnected');
    });
    const channel = peer.createDataChannel('chat',{ordered:true});
    dc = channel;
    channel.addEventListener('open',()=>{
      if (!currentConnection(session)) return;
      sendClientReady();clientReadyTimer=setInterval(sendClientReady,500);
    });
    channel.addEventListener('message',e=>{
      if (!currentConnection(session)) return;
      try {const msg=JSON.parse(e.data);if(msg?.label==='rtvi-ai')handleRtvi(msg);}catch{}
    });
    const offer=await peer.createOffer();
    if (!currentConnection(session)) return;
    await peer.setLocalDescription(offer);
    await waitForIce(peer);
    if (!currentConnection(session)) return;
    setState('connecting','connecting','negotiating with agent');
    const res=await fetch(offerUrl,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sdp:peer.localDescription.sdp,type:peer.localDescription.type,pc_id:pcId,request_data:{unmute_dev_call_id:session.call_id}}),
    });
    if (!currentConnection(session)) return;
    if (!res.ok) throw new Error('offer rejected ('+res.status+')');
    const answer=await res.json();
    if (!currentConnection(session)) return;
    pcId=answer.pc_id || pcId;
    await peer.setRemoteDescription(answer);
    await waitForPeer(peer);
    if (!currentConnection(session)) return;
    connecting=false;
    setMuted(false);
    el.connect.textContent = "end call";
    setState('connected','live','talk to your agent');
  } catch(err){if(currentConnection(session))teardown('error',String(err.message || err));}
}

// ── livekit transport: join a room with the vendored JS SDK ──
function loadLiveKit(){
  if (window.LivekitClient) return Promise.resolve(window.LivekitClient);
  return new Promise((resolve) => {
    const s = document.createElement("script");
    s.src = "/livekit-client.umd.js";
    s.onload = () => resolve(window.LivekitClient || null);
    s.onerror = () => resolve(null);
    document.head.appendChild(s);
  });
}

// The publication holds the track the SDK is actually sending. Wrapping its
// mediaStreamTrack feeds the same analyser path both transports use, so the input
// level is not a pipecat-only feature.
function attachLocalMic(){
  const LK = window.LivekitClient;
  if (!room || !LK) return;
  try {
    const pub = room.localParticipant.getTrackPublication(LK.Track.Source.Microphone);
    const track = pub && pub.track && pub.track.mediaStreamTrack;
    if (track) reconnectMic(new MediaStream([track]));
  } catch { /* the level is a nicety; never break a call for it */ }
}

async function swapMicLivekit(){
  try {
    await room.switchActiveDevice("audioinput", selectedDeviceId);
    attachLocalMic();                                 // the underlying track changed
  } catch { /* keep the existing input on failure */ }
}

async function connectLivekit(session){
  setState('connecting','connecting','loading the livekit client');
  const LK=await loadLiveKit();
  if (!currentConnection(session)) return;
  if (!LK) return teardown('error','could not load the livekit client');
  const nextRoom=new LK.Room({adaptiveStream:true,dynacast:true});
  room=nextRoom;
  nextRoom.on(LK.RoomEvent.TrackSubscribed,track=>{
    if (!currentConnection(session)) return;
    if(track.kind===LK.Track.Kind.Audio){
      const stream=new MediaStream([track.mediaStreamTrack]);
      el.remote.srcObject=stream;startMeter(stream);
    }
  });
  nextRoom.on(LK.RoomEvent.TrackUnsubscribed,()=>{if(currentConnection(session))el.remote.srcObject=null;});
  nextRoom.on(LK.RoomEvent.LocalTrackPublished,pub=>{
    if(currentConnection(session) && pub?.kind===LK.Track.Kind.Audio)attachLocalMic();
  });
  nextRoom.on(LK.RoomEvent.Disconnected,()=>{if(currentConnection(session))teardown('idle');});
  nextRoom.on(LK.RoomEvent.ParticipantConnected,p=>{
    if(currentConnection(session))setState('connected','live','talking to '+p.identity);
  });
  try {
    await nextRoom.connect(session.url,session.token);
    if (!currentConnection(session)){nextRoom.disconnect();return;}
    connecting=false;
    setState('connected','live','talk to your agent');
    el.connect.textContent = "end call";
  } catch(err){if(currentConnection(session))teardown('error',String(err.message || err));return;}
  try {
    await nextRoom.localParticipant.setMicrophoneEnabled(true);
    if (!currentConnection(session)) return;
    setMuted(false);attachLocalMic();await refreshMics();
  } catch {
    if (!currentConnection(session)) return;
    setMicUnavailable();
    el.state.textContent='live — microphone blocked; allow access and reconnect';
  }
}


// Keep native focus; the keyboard handler owns push-to-talk.
el.connect.addEventListener("click", () => {
  (connecting || el.body.dataset.state === "connected") ? teardown("idle") : connect();
});
el.mute.addEventListener("click", () => { toggleMute(); });
if (!DEMO && navigator.mediaDevices && navigator.mediaDevices.addEventListener)
  navigator.mediaDevices.addEventListener("devicechange", () => { if (transport) refreshMics(); });

// ── demo-only visual preview (DEMO=true builds) ──────────
function simulate(){
  clearTranscript();
  selectedCallID = "demo";
  setMuted(false);
  el.connect.textContent = "end call";
  setState("connected", "live", "talk to your agent");
  attachRecord({version:2,kind:"exchange",call_id:"demo",id:"greeting",revision:1,order:1,
    exchange:{role:"response",state:"ended",link_status:"unavailable",playback:"unknown"}});
  attachRecord({version:2,kind:"text",call_id:"demo",id:"hello",revision:1,order:2,
    text:{exchange_id:"greeting",message_id:"hello",speaker:"assistant",text:"Hi! How can I help?",state:"final",origin:"generated",separator_before:""}});
}

setBars(0.08);
renderMic();
setState("idle", "ready");
// Nothing to call until the stream says otherwise. In DEMO builds there is no
// stream, so the button stays live for the visual preview.
if (!DEMO) el.connect.disabled = true;
startEventStream();
</script>
</body>
</html>
