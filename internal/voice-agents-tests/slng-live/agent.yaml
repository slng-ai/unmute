# The slng target's live package: compiled, deployed to SLNG with the real key,
# and called over audio by internal/e2e (make e2e-slng). It holds what a real
# managed agent uses: a Python tool deploy publishes as a code tool, an API
# request tool SLNG hosts, end_call, a task with its own when:, a step only a
# group runs, a skipped group step, and one tool that finishes a step.
version: 2
name: slng-live-test
entry_agent: desk

models:
  think:
    reasoning:
      description: answers the caller
      provider: gemini
      model: "gemini/google/gemini-3.1-flash-lite:latest"
  speak:
    front_desk:
      description: warm, concise
      provider: slng
      model: "cartesia/sonic:3"
      voice: "39d518b7-fd0b-4676-9b8b-29d64ff31e12"
  listen:
    transcriber:
      description: default STT
      provider: slng
      model: "soniox/speech-ai:rt-v5"
      language: en

agents:
  desk:
    instructions: instructions.md
    think: reasoning
    speak: front_desk
    tools:
      - search_places
      - end_call
    tasks:
      - name: verify_identity
        when: The caller needs to confirm who they are before a booking is made.
        instructions: tasks/verify.md
        assign:
          - phone_number: result.phone_number
        context:
          history: messages

      # No when: on purpose. The book group is the only way in.
      - name: take_booking
        instructions: tasks/booking.md
        announce: Let me have a look.
        tools:
          - find_free_slots
          - book_slot
        # One tool ends the step, as SLNG runs today.
        finish:
          - tool: book_slot
            success:
              - status: booked
            say:
              - "Thanks for having us. You're booked for {{state.booking.time}} on {{state.booking.day}}."
        assign:
          - booking: result.booking
        context:
          history: messages
    task_groups:
      - book

task_groups:
  book:
    when: The caller wants to book an appointment.
    steps:
      - task: verify_identity
        skip_when_confirmed: phone_number
      - take_booking
    context_scope: shared
    then: return

variables:
  - name: phone_number
    confirm: verify_identity

tools:
  - find_free_slots
  - book_slot
  - search_places
  - end_call

conversation:
  greeting:
    speaks_first: agent
    text: "Hi, you have reached Sage and Stone. How can I help?"
  interruption:
    enabled: true

channels:
  web:
    kind: realtime_audio
