version: 1

name: salon-concierge-v2

entry_agent: concierge

agents:
  concierge:
    instructions: instructions.md
    think: reasoning
    speak: voice
    tools:
      - look_up_salon_info
    tasks:
      - name: verify_customer
        when: >-
          Confirm who the caller is before any specialist handoff. The task reads
          the phone number back and needs a yes before it looks anyone up.
        instructions: tasks/verify-customer.md
        tools:
          - find_or_create_customer
        assign:
          - customer_phone: result.customer_phone
          - customer: result.customer?
        # This step records no reason, and that is what `history: reset` costs.
        # A reset step never receives the caller's triggering utterance, so a
        # `reason` field here could only be filled by asking, and it asked on
        # every call: the caller said "a booking for a haircut tomorrow", the
        # step read the number back, and then asked what they were calling
        # about. The steps that act read the conversation and record it instead.
        context:
          history: reset

      - name: manage_booking
        when: The caller wants to create, modify, or cancel a booking.
        instructions: tasks/booking.md
        tools:
          - list_bookings
          - check_availability
          - create_booking
          - modify_booking
          - cancel_booking
        handoffs:
          - to_complaints
        assign:
          - appointments+: result.appointment
          # The step that did the thing records why the caller rang. This one
          # runs on `history: messages`, so the caller's own words are in front
          # of it and it never has to ask.
          - caller_reason+: result.reason
        context:
          history: messages
    handoffs:
      - to_complaints
    escalations:
      - to_manager

  complaint_specialist:
    instructions: agents/complaint-specialist.md
    think: reasoning
    speak: voice
    # `record_complaint` is deliberately NOT here. A tool on the agent as well
    # as on its step is a step the model never enters: it took the short route,
    # recorded the complaint itself, and `complaints` stayed empty on a call
    # that recorded one (trace 9aa92e09, 2026-09-04). The prompt already said
    # to run the step; the tool being in reach beat the prompt.
    tools:
      - look_up_refund_policy
    # The concierge defines verify_customer. A bare name runs the same task from
    # here, so there is one definition and both agents can offer it.
    tasks:
      - verify_customer

      - name: handle_complaint
        when: The verified caller is unhappy about something and wants it recorded.
        instructions: tasks/complaint.md
        # The policy lookup stays on the agent rather than on this step: the
        # Pipecat driver cannot scope a knowledge tool to a task, so a step
        # holding one compiles on one target and not the other. The specialist
        # reads the policy and decides what to offer, and this step records it.
        tools:
          - record_complaint
        assign:
          - complaints+: result.complaint
          # The second entry on the same list, written by a different step. A
          # caller who books and also complains rang for two reasons, and the
          # state holds both: this is the case the spec separates from a change
          # of mind, where one step replaces its own value instead.
          - caller_reason+: result.reason
        context:
          history: messages
    handoffs:
      - to_concierge
    escalations:
      - to_manager

handoffs:
  to_complaints:
    to: complaint_specialist
    when: The verified caller has a complaint or service problem.
    context:
      history: messages

  to_concierge:
    to: concierge
    when: The caller changes to a request owned by another specialist.
    context:
      history: messages

escalations:
  to_manager:
    when: The caller explicitly asks for a manager or is clearly and strongly frustrated.
    cold:
      destination: manager_line
      ring_timeout: 30s
      on_unavailable: hangup

# How the values on State in state.py behave: where one comes from, and
# which step confirms it. A value needs an entry only for one of those.
variables:
  - name: customer_phone
    confirm: verify_customer


prefetch:
  - name: today
    clock: now
    # The zone this entry reads its clock in, and the reason it sits here rather
    # than on the package: the key belongs beside the reading it governs, and two
    # entries could honestly want two zones. Not the container's clock, which is
    # UTC and would name the wrong day for anybody who is not on it.
    timezone: Europe/Madrid
    assign:
      - booking_date: result.date

  - name: caller
    source: from_number
    assign:
      - customer_phone: result.value

  - name: profile
    tool: look_up_customer
    # Does running this unasked, on every call including wrong numbers, change
    # anything? No: look_up_customer reads. Its twin find_or_create_customer
    # would answer true, which is why this entry points at this one.
    writes: false
    args:
      - phone: "{{state.customer_phone}}"
    assign:
      - customer_name: result.name

secrets:
  - OPENAI_API_KEY
  - SLNG_API_KEY
  - LANGFUSE_SECRET_KEY
  - LANGFUSE_PUBLIC_KEY
  - LANGFUSE_BASE_URL
  - MANAGER_PHONE_NUMBER
  - TWILIO_ACCOUNT_SID
  - TWILIO_AUTH_TOKEN
  - TWILIO_PHONE_NUMBER
  - SIP_TRUNK_HOSTNAME
  - SIP_AUTH_USERNAME
  - SIP_AUTH_PASSWORD
  - SIP_FROM_NUMBER

destinations:
  manager_line: MANAGER_PHONE_NUMBER

knowledge:
  refunds:
    documents: knowledge/refunds
  services:
    documents: knowledge/services
    chunk_size: 220
    chunk_overlap: 40

models:
  think:
    reasoning:
      provider: openai
      model: gpt-5.6-luna
      params:
        reasoning_effort: "none"
  speak:
    voice:
      provider: slng
      model: "cartesia/sonic:3.5"
      voice: "62ae83ad-4f6a-430b-af41-a9bede9286ca"
      language: en
      params:
        world_part: eu-west
        warm_standby_enabled: true
  listen:
    transcriber:
      provider: slng
      model: "soniox/speech-ai:rt-v5"
      language: en
      params:
        world_part: eu-west
  turn:
    detector:
      provider: local
      model: silero
      pace: balanced
      endpointing_delay: 400ms

tools:
  - find_or_create_customer
  - look_up_customer
  - look_up_refund_policy
  - look_up_salon_info
  - list_bookings
  - check_availability
  - create_booking
  - modify_booking
  - cancel_booking
  - record_complaint

conversation:
  greeting:
    speaks_first: agent
    text: "Hi, you've reached Sage and Stone. Robin speaking, what can I do for you?"
  interruption:
    enabled: true
  inactivity:
    nudge_after: 15s
    end_after: 45s
  max_duration: 15m

tracing:
  provider: langfuse

channels:
  web:
    kind: realtime_audio
  phone:
    kind: telephony
    inbound: true
    outbound: false

capacity:
  peak_sessions: 5
  max_sessions: 10
  peak_starts_per_second: 1
  avg_session_duration: 5m
