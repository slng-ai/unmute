description: >-
  Look up a customer by phone number. Reads only: it never creates a record and
  never touches one. Returns an empty name when the number is not on file.

  This is the twin of find_or_create_customer, and the split is deliberate.
  A pre-fetch runs unasked on every inbound call, so the entry that runs one
  before the greeting declares `writes: false`, and only a tool that really
  writes nothing can honestly carry that. Creating a customer record for every
  wrong number that ever rang is exactly the outcome the declaration exists to
  make somebody think about, so the shipped example does not model it.

input:
  type: object
  properties:
    phone:
      type: string
      description: The caller's phone number, in any shape
  required:
    - phone

output:
  type: object
  properties:
    name:
      type: string
      description: The name on the record, or empty when the number is not on file
    status:
      type: string
      description: existing or unknown

local:
  handler: tools/salon.py

interruption: provider_default
effect: returns_data
