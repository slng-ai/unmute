# Kestrel: an inbound motor claim, ported from unmute-core's examples/kestrel.
#
# One agent, Sam, and one task group, `claim`, that runs two steps:
# 1. find_policy: code reads the policy number and date of birth back, and looks
#    the policy up on the caller's yes.
# 2. take_report: code asks each question of the report in a fixed order, the
#    model only notes the answers, and code reads the whole claim back before it
#    is filed.
#
# Every line the caller hears in the flow is code's. The scenarios in
# scenarios/ are unmute-core's, word for word: the same lines and the same
# model request counts must hold when Unmute compiles this package.

name: kestrel

entry_agent: sam

agents:
  - name: sam
    prompt: instructions.md
    think: reasoning
    speak: voice
    tools:
      - coverage_guide
      - end_call
    flows:
      - name: claim
        when: >-
          The caller gives a policy number or a date of birth, or wants to report an
          accident or damage to their car.
        steps:
          - find_policy
          - take_report
        fills:
          - policy_number
          - birth_date
    tasks:
      - name: find_policy
        prompt: tasks/find-policy.md
        tools:
          - name: lookup_policy
            confirm:
              - >-
                Is your policy number {{state.policy_number}}, with a date of
                birth of {{state.birth_date}}?
            outcomes:
              - if:
                  - found:
                      - true
                say:
                  - "Thank you, {{state.policy.first_name}}, I have your policy."
                then: done
              - if:
                  - found:
                      - false
                  - status:
                      - looked_up
                say:
                  - >-
                    I'm sorry, I can't find a policy with that number and date of
                    birth. Could you check the number on your policy documents?
        start:
          call: lookup_policy
          with:
            - policy_number: state.policy_number
            - birth_date: state.birth_date
        save:
          - policy: result.policy
          - policy_number: input.policy_number
          - birth_date: input.birth_date

      - name: take_report
        prompt: tasks/take-report.md
        tools:
          - note_facts
          - name: file_claim
            confirm:
              - "{{state.read_back}}"
            outcomes:
              - if:
                  - filed:
                      - true
                say:
                  - >-
                    Your claim is filed. Your claim number is {{state.claim_number}}.
                    A claims handler will call you within one working day. Is there
                    anything else I can help with?
                then: done
        start:
          call: note_facts
        save:
          - claim_number: result.claim_number

prefetch:
  - name: today
    clock: now
    timezone: Europe/London
    save:
      - today: result.date
      - weekday: result.day_of_week

secrets:
  - GOOGLE_API_KEY
  - SLNG_API_KEY

models:
  think:
    reasoning:
      provider: google
      model: gemini-3.1-flash-lite
      params:
        vertexai: true
        location: eu
        thinking_config:
          thinking_level: MINIMAL
  speak:
    voice:
      provider: slng
      model: "slng/fish/tts:s2.1-pro"
      # Fish Audio's "Oliver": a calm English voice.
      voice: "8d8aec63a56c460cb7def795bdf754fa"
      language: en
      params:
        world_part: eu-north
  listen:
    transcriber:
      provider: slng
      model: "soniox/speech-ai:rt-v5"
      language: en
      params:
        world_part: eu-north
  turn:
    detector:
      provider: local
      model: silero
      pace: patient

tools:
  - name: lookup_policy
    start:
      say:
        - Let me find that.
        - One moment.

# A number that is not KP and six digits is refused before it is read back.
    outcomes:
      - if:
          - status:
              - not_a_number
        say:
          - A policy number is KP and six digits. Could you read me yours again?
  - name: note_facts
    hidden:
      - report
      - read_back

# Saved as soon as it returns, so the next answer merges into the report.
    save:
      - report: result.report
      - read_back: result.read_back
      - next_question: result.next_question
    outcomes:
      - if:
          - status:
              - future_day
        say:
          - That day hasn't happened yet. On which day did it happen?
      - if:
          - complete:
              - false
        say:
          - "{{state.next_question}}"
  - name: file_claim
    start:
      say:
        - Filing that now.

conversation:
  greeting:
    speaks_first: agent
    say: >-
      Thanks for calling Kestrel Insurance claims, this is Sam. Can I take your
      policy number, please?
  inactivity:
    nudge_after: 15s
    end_after: 50s
    nudge_text: Are you still there? Take your time.
    end_text: I'll let you go for now. Call us back any time. Goodbye.
  max_duration: 15m
