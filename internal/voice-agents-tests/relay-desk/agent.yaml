# The twilio target acceptance package. One agent, one inbound phone
# channel, one read-only tool and end_call: the whole first-release surface of
# the twilio target, and nothing it refuses.
version: 2

name: relay-desk

architecture: cascade

entry_agent: desk

models:
  think:
    reasoning:
      provider: openai
      model: gpt-5.6-luna
      params:
        # Measured 2026-09-25: this model returns 400 on tool calls through
        # Chat Completions unless reasoning_effort is none.
        reasoning_effort: none
        parallel_tool_calls: false
  listen:
    transcriber:
      provider: deepgram
      model: nova-3-general
      language: en-US
      params:
        # ConversationRelay's hints and deepgramSmartFormat attributes.
        hints:
          - relay desk
          - opening hours
        deepgramSmartFormat: true
  speak:
    voice:
      provider: elevenlabs
      model: flash_v2_5
      voice: UgBBYS2sOqTuMpoF3BR0
      language: en-US
      params:
        elevenlabsTextNormalization: auto
  turn:
    relay:
      params:
        speechTimeout: 800
        interruptSensitivity: medium
        ignoreBackchannel: true

agents:
  - name: desk
    prompt: instructions.md
    think: reasoning
    speak: voice
    tools:
      - opening_hours
      - end_call

conversation:
  greeting:
    speaks_first: agent
    say: "Hello, how can I help with the desk today?"
  interruption:
    enabled: true

secrets:
  - OPENAI_API_KEY
  - SLNG_API_KEY
  - GOOGLE_API_KEY
  - TWILIO_ACCOUNT_SID
  - TWILIO_AUTH_TOKEN
  - TWILIO_PHONE_NUMBER_SID
  - TWILIO_PUBLIC_URL
