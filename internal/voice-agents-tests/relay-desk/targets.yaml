targets:
  twilio-openai:
    provider: twilio
    sdk_language: python
    connection: twilio_relay

  # The same agent thinking on Gemini through Vertex AI in the EU, the path the
  # repository's GOOGLE_API_KEY reaches. Without vertexai the binding would use
  # the Gemini Developer API, which has no real-key evidence yet.
  twilio-gemini:
    provider: twilio
    sdk_language: python
    connection: twilio_relay
    models:
      reasoning:
        provider: google
        model: gemini-3.1-flash-lite
        params:
          vertexai: true
          location: eu
          thinking_config:
            thinking_level: MINIMAL

  # The same agent thinking through the SLNG Context Router, which calls
  # gpt-5.6-luna on OpenAI for it and answers repeated turns from its cache.
  twilio-slng:
    provider: twilio
    sdk_language: python
    connection: twilio_relay
    models:
      reasoning:
        provider: slng
        model: gpt-5.6-luna
        agent_id: relay-desk-v1
        upstream:
          provider: openai
        params:
          world_part: eu-west
          reasoning_effort: none
          parallel_tool_calls: false
