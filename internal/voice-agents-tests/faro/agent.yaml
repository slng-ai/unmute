# Faro: a bilingual language tutor, ported from unmute-core's examples/faro.
#
# Two agents, one per explanation language, built from one prompt: faro_en and
# faro_es. A known caller is greeted by the agent of their own language, picked
# before the greeting from their number. A learner who asks to switch language
# is handed to the other agent.
#
# The model grades and code teaches. The lesson needs no task: continue_lesson,
# grade_answer, give_hint, read_progress and remember are agent tools, and each
# result's `said` is saved to state and spoken by a reply. Two tasks read back
# before code acts: a number the caller says (other_number) and a new profile
# (sign_up). They are written once per agent because their lines are in the
# agent's language, and a task name is one name across the package, so the
# Spanish agent's are other_number_es and sign_up_es.
#
# The scenarios in scenarios/ are unmute-core's, word for word. Progress is kept
# in SQLite (FARO_DB, see README.md).
version: 2

name: faro

entry_agent: faro_en

# The call starts on the agent of the caller's own language, which the
# prefetch reads from their profile. A new caller starts in English.
entry_by:
  value: explanation
  agents:
    - EN: faro_en
    - ES: faro_es

agents:
  faro_en:
    instructions: instructions.md
    think: reasoning
    speak: voice_en
    tools:
      - use_this_number
      - continue_lesson
      - grade_answer
      - give_hint
      - read_progress
      - remember
      - end_call
    handoffs:
      - to_spanish
    tasks:
      - name: other_number
        when: >-
          The caller says the number read back is wrong, or there was no number
          to read back.
        instructions: tasks/other-number.md
        start:
          say:
            - What is your full phone number, starting with plus thirty-four?
          listen: true
          call: check_number
          with:
            - phone: state.phone
        arguments:
          - phone
        tools:
          - name: check_number
            confirm:
              - "Let me check: is your number {{input.phone}}?"
            outcomes:
              - if:
                  - status:
                      - known
                      - new
                say:
                  - "{{result.said}}"
                then: done
        save:
          - phone: input.phone
          - learner_id: result.learner_id?
          - learner_name: result.learner_name?
          - notes: result.notes?

      - name: sign_up
        when: A caller with no profile agrees to create one.
        instructions: tasks/sign-up.md
        start:
          say:
            - Great. What would you like me to call you?
          listen: true
        tools:
          - name: create_profile
            confirm:
              - >-
                Shall I create your profile as {{input.name}}, learning
                {{input.learn}} for {{input.goal}}, at level
                {{input.level}}?
            outcomes:
              - if:
                  - status:
                      - created
                say:
                  - "{{result.said}}"
                then: done
        save:
          - learner_id: result.learner_id?
          - learner_name: result.learner_name?
          - notes: result.notes?

  faro_es:
    instructions: instructions-es.md
    think: reasoning
    speak: voice_es
    tools:
      - use_this_number
      - continue_lesson
      - grade_answer
      - give_hint
      - read_progress
      - remember
      - end_call
    handoffs:
      - to_english
    tasks:
      - name: other_number_es
        when: >-
          The caller says the number read back is wrong, or there was no number
          to read back.
        instructions: tasks/other-number.md
        start:
          say:
            - ¿Me dices tu número de teléfono completo, empezando por más treinta y cuatro?
          listen: true
          call: check_number
          with:
            - phone: state.phone
        arguments:
          - phone
        tools:
          - name: check_number
            confirm:
              - "A ver si lo tengo bien: ¿tu número es {{input.phone}}?"
            outcomes:
              - if:
                  - status:
                      - known
                      - new
                say:
                  - "{{result.said}}"
                then: done
        save:
          - phone: input.phone
          - learner_id: result.learner_id?
          - learner_name: result.learner_name?
          - notes: result.notes?

      - name: sign_up_es
        when: A caller with no profile agrees to create one.
        instructions: tasks/sign-up.md
        start:
          say:
            - Genial. ¿Cómo quieres que te llame?
          listen: true
        tools:
          - name: create_profile
            confirm:
              - >-
                ¿Creo tu perfil como {{input.name}}, con nivel
                {{input.level}}?
            outcomes:
              - if:
                  - status:
                      - created
                say:
                  - "{{result.said}}"
                then: done
        save:
          - learner_id: result.learner_id?
          - learner_name: result.learner_name?
          - notes: result.notes?

handoffs:
  # Each switch saves the language code speaks in, then re-reads the exercise
  # waiting in that language, with no model request.
  to_spanish:
    to: faro_es
    when: The caller asks you to explain in Spanish, or keeps speaking Spanish to you.
    saves:
      - explanation: ES
    start:
      call: continue_lesson
  to_english:
    to: faro_en
    when: The caller asks you to explain in English, or keeps speaking English to you.
    saves:
      - explanation: EN
    start:
      call: continue_lesson
prefetch:
  - name: caller
    source: from_number
    assign:
      - phone: result.value
  # Before the greeting: which language to greet this number in, and the
  # number read back. Nothing about the learner is said or shown.
  - name: language
    tool: language_of
    writes: false
    needs_confirmed:
      - phone
    assign:
      - explanation: result.explanation
      - phone_spaced: result.phone_spaced
      - number_question: result.number_question

secrets:
  - GOOGLE_API_KEY
  - SLNG_API_KEY

models:
  think:
    reasoning:
      provider: google
      model: gemini-3.1-flash-lite
      params:
        vertexai: true
        location: eu
        thinking_config:
          thinking_level: MINIMAL
  speak:
    # Fish Audio's "Isabella": warm, and clear in both languages. One voice per
    # agent, so a language can take its own voice later.
    voice_en:
      provider: slng
      model: "slng/fish/tts:s2.1-pro"
      voice: "15e288e662ca4072b2276d5c7c962bb2"
      language: en
      params:
        world_part: eu-north
    voice_es:
      provider: slng
      model: "slng/fish/tts:s2.1-pro"
      voice: "15e288e662ca4072b2276d5c7c962bb2"
      language: es
      params:
        world_part: eu-north
  listen:
    transcriber:
      provider: slng
      model: "soniox/speech-ai:rt-v5"
      language: es
      params:
        world_part: eu-north
  turn:
    detector:
      provider: local
      model: silero
      pace: patient

tools:
  - name: use_this_number
    save:
      - learner_id: result.learner_id
      - learner_name: result.learner_name
      - notes: result.notes
    outcomes:
      - else:
        say:
          - "{{result.said}}"
  - name: check_number
    outcomes:
      - if:
          - status:
              - foreign
          - explanation:
              - EN
        say:
          - Faro only takes Spanish numbers, starting with plus thirty-four. What is your Spanish number?
      - if:
          - status:
              - foreign
          - explanation:
              - ES
        say:
          - Faro solo acepta números españoles, que empiezan por más treinta y cuatro. ¿Cuál es tu número español?
  - create_profile
  - name: continue_lesson
    save:
      - waiting: result.waiting
      - helped: result.helped
    outcomes:
      - else:
        say:
          - "{{result.said}}"
  - name: grade_answer
    save:
      - waiting: result.waiting
      - helped: result.helped
    outcomes:
      - else:
        say:
          - "{{result.said}}"
  - name: give_hint
    save:
      - helped: result.helped
    outcomes:
      - else:
        say:
          - "{{result.said}}"
  - name: read_progress
    outcomes:
      - else:
        say:
          - "{{result.said}}"
  - name: remember
    save:
      - notes: result.notes
    outcomes:
      - else:
        say:
          - "{{result.said}}"
  - end_call
  - language_of

conversation:
  greeting:
    speaks_first: agent
    text: >-
      Hi, I'm Faro, your language companion. Si prefieres hablar en español,
      dímelo. {{state.number_question}}
    # With no caller ID there is no number to read back, so the model asks.
    instruction: >-
      Say exactly: "Hi, I'm Faro, your language companion. Si prefieres hablar
      en español, dímelo. What is your full phone number, starting with plus
      thirty-four?"
  max_duration: 20m
