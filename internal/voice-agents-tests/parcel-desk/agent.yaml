# Parcel Desk, ported from unmute-core's examples/parcel-desk: an agent defined as
# data. The State has a shape, the tools are Python with announce and effect, one
# group ends the call, and the model is the SLNG Context Router.
#
# Core has no scenarios for this example. The two in scenarios/ are written from its
# task prompts: a moved delivery and a call-back note.
version: 2

name: parcel-desk

entry_agent: desk

agents:
  - name: desk
    prompt: instructions.md
    think: router
    speak: voice
    tools:
      - end_call
    flows:
      - name: move_delivery
        when: The caller wants a parcel delivered on another day.
        steps:
          - track_parcel
          - change_delivery
      - name: request_callback
        when: The caller wants a person to call them back.
        steps:
          - callback_note
        then: end
    tasks:
      - name: track_parcel
        when: The caller asks where a parcel is.
        prompt: tasks/track-parcel.md
        tools:
          - name: find_parcel
            outcomes:
              - if:
                  - found:
                      - true
                then: done
        save:
          - parcel: result.parcel

      - name: change_delivery
        prompt: tasks/change-delivery.md
        tools:
          - name: reschedule_delivery
            confirm:
              - "Shall I move the delivery to {{state.day}}?"
            outcomes:
              - if:
                  - status:
                      - rescheduled
                say:
                  - "Done, it now arrives on {{state.parcel.delivery_day}}."
                then: done
        save:
          - day: input.day
          - parcel: result.parcel

      - name: callback_note
        prompt: tasks/callback-note.md
        tools:
          - name: save_callback_note
            outcomes:
              - if:
                  - saved:
                      - true
                say:
                  - Thanks, someone will call you back today. Goodbye.
                then: done
        save:
          - callback_note: result.note

prefetch:
  - name: today
    clock: now
    timezone: Europe/London
    save:
      - today: result.date

  - name: caller
    source: from_number
    save:
      - caller_phone: result.value

secrets:
  - SLNG_API_KEY

models:
  think:
    router:
      provider: slng
      # Core asks for slng/auto and leaves the model to the router's stored config.
      # Unmute sends the upstream with each request, so it names an OpenAI model.
      model: gpt-4.1-mini
      agent_id: parcel-desk
      upstream:
        provider: openai
      params:
        world_part: eu-north
  speak:
    voice:
      provider: slng
      model: "slng/fish/tts:s2.1-pro"
      # Fish Audio's "Oliver": a calm English voice.
      voice: "8d8aec63a56c460cb7def795bdf754fa"
      language: en
      params:
        world_part: eu-north
  listen:
    transcriber:
      provider: slng
      model: "soniox/speech-ai:rt-v5"
      language: en
      params:
        world_part: eu-north
  turn:
    detector:
      provider: local
      model: silero
      pace: balanced

tools:
  - name: find_parcel
    start:
      say:
        - Let me look that up.
        - One moment.
  - name: reschedule_delivery
    start:
      say:
        - Let me book that in.

conversation:
  greeting:
    speaks_first: agent
    say: Hi, this is Parcel Desk. How can I help?
  max_duration: 10m
