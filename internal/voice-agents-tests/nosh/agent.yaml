# Nosh: an outbound restaurant and bar finder, ported from unmute-core's examples/nosh.
#
# One agent and no tasks. Four tools do the work. Each tool saves what it returns
# and says code's next line, so a caller turn costs one model request.
#
# The scenarios in scenarios/ are unmute-core's, word for word: the same lines,
# model request counts and final state must hold when Unmute compiles this package.
version: 2

name: nosh

entry_agent: finder

variables:
  # Who asked for the call. A dispatch without a name is refused.
  - name: customer_name
    call_start: required

agents:
  finder:
    instructions: instructions.md
    think: reasoning
    speak: voice
    tools:
      - find_area
      - find_places
      - place_details
      - end_call

secrets:
  - GOOGLE_API_KEY
  - SLNG_API_KEY

models:
  think:
    reasoning:
      provider: google
      model: gemini-3.1-flash-lite
      params:
        vertexai: true
        location: eu
        thinking_config:
          thinking_level: MINIMAL
  speak:
    voice:
      provider: slng
      model: "slng/fish/tts:s2.1-pro"
      # Fish Audio's "Avery": bright and friendly.
      voice: "ba875f2fb2ea4a4e9b175821014984b6"
      language: en
      params:
        world_part: eu-north
  listen:
    transcriber:
      provider: slng
      model: "soniox/speech-ai:rt-v5"
      language: en
      params:
        world_part: eu-north
  turn:
    detector:
      provider: local
      model: silero
      pace: snappy

tools:
  - name: find_area
    start:
      say:
        - Let me see.
        - Hmm, let me look.
# A new area takes back the places on offer and the details said.
    save:
      - spot: result.spot
      - craving: result.craving
      - offer: result.offer
      - details: result.details
    outcomes:
      - if:
          - found:
              - true
          - ask_craving:
              - false
        say:
          - "So that's {{state.spot.formatted_address}}, right?"
      - if:
          - found:
              - true
          - ask_craving:
              - true
        say:
          - "So that's {{state.spot.formatted_address}}. What are you in the mood for? A cuisine, a bar, or no preference?"
      - if:
          - found:
              - false
        say:
          - >-
            Hmm, I couldn't place that. Could you give me a nearby cross street, a
            neighbourhood or the city?
  - name: find_places
    start:
      say:
        - Let me have a look.
        - One sec, let me see what's around.
    hidden:
      - listed
    save:
      - craving: result.craving
      - offer: result.offer
      - details: result.details
      - listed: result.listed
    outcomes:
      - if:
          - ask_craving:
              - true
        say:
          - What are you in the mood for? A cuisine, a bar, or no preference?
      - if:
          - found:
              - true
        say:
          - "I found {{state.listed}}. Do any of those sound good?"
      - if:
          - found:
              - false
        say:
          - >-
            Hmm, I couldn't find anything like that right there. Want me to try a
            bit wider, or a different kind of place?
  - name: place_details
    hidden:
      - spoken
    save:
      - details: result.details
      - spoken: result.spoken
      - place_name: result.name
    outcomes:
      - if:
          - found:
              - true
        say:
          - "{{state.spoken}}"
      - if:
          - found:
              - false
        say:
          - >-
            Sorry, I can't pull up {{state.place_name}}'s details just now. Want to
            hear about another one?
  -

    name: end_call
    start:
      say:
        - Enjoy your meal! Bye for now.
      wait: true
conversation:
  greeting:
    speaks_first: agent
    text: >-
      Hey {{state.customer_name}}, it's Nosh! You wanted a hand finding
      somewhere good. Whereabouts are you looking? An address or an area is fine.
  max_duration: 10m
