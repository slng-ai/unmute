[project]
name = "{{.Name}}-livekit"
version = "0.1.0"
description = "{{.Name}} on LiveKit Agents, on unmute-core. Written by unmute compile."
requires-python = ">=3.12"
dependencies = [
    "unmute-core[livekit]=={{.CorePin}}",
    "livekit-agents[google]>=1.8.7,<1.9",
    "livekit-plugins-silero>=1.8.7",
    "livekit-plugins-slng>=1.8.7",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff==0.15.7", "ty"]

[tool.ruff]
line-length = 100

[tool.ty.environment]
python-version = "3.12"
