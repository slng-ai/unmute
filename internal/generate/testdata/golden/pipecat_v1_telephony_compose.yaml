# Generated local-development topology. Do not use this file as a production deployment model.
services:
  application:
    build:
      context: .
    stop_grace_period: "1260s"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DEEPGRAM_API_KEY
      - GET_INVOICE_URL
      - LOOKUP_CUSTOMER_URL
      - OPENAI_API_KEY
      - SLNG_API_KEY
      - TWILIO_ACCOUNT_SID
      - TWILIO_AUTH_TOKEN
      - TWILIO_PHONE_NUMBER
      - UNMUTE_OUTBOUND_TOKEN
      - UNMUTE_PUBLIC_URL
      # optional: passed through when set on the host; absent otherwise
      - UNMUTE_CALL_START
      # optional: passed through when set on the host; absent otherwise
      - UNMUTE_DEV_METRICS
      # optional: passed through when set on the host; absent otherwise
      - UNMUTE_LOCAL_PLANE
      # optional: passed through when set on the host; absent otherwise
      - UNMUTE_LOG_LEVEL
    ports:
      - "${UNMUTE_TELEPHONY_PORT:-7860}:7860"
    # How the container reaches the machine running it. Used by `unmute dev
    # --telephony`, where the carrier is a stand-in on the host and the agent
    # has to reach its API: a container's own 127.0.0.1 is the container.
    # host-gateway is the portable spelling, and this entry is what creates the
    # name on Linux. Unused in production, where the carrier is the carrier.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/readyz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  redis:
    # Valkey (BSD-3-Clause) is the coordination store: Redis images are
    # source-available (RSALv2/SSPLv1) since 7.4, not open source. The
    # service name and REDIS_URL keep the protocol's name.
    image: valkey/valkey:9.1.1-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  redis_data:
