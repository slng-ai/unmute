# Generated local-development topology. Do not use this file as a production deployment model.
services:
  application:
    build:
      context: .
    stop_grace_period: "1260s"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DEEPGRAM_API_KEY
      - GET_INVOICE_URL
      - LOOKUP_CUSTOMER_URL
      - OPENAI_API_KEY
      - SLNG_API_KEY
      - TWILIO_ACCOUNT_SID
      - TWILIO_AUTH_TOKEN
      - TWILIO_PHONE_NUMBER
      - UNMUTE_OUTBOUND_TOKEN
      - UNMUTE_PUBLIC_URL
    ports:
      - "${UNMUTE_TELEPHONY_PORT:-7860}:7860"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/readyz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7.4.9-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  redis_data:
