# Prefetch fixture: safe_core plus one prefetch block that uses all three
# sources, and one variable that has to be confirmed before anything acts on it.
#
# It exists because no other fixture has all four pieces a prefetch needs: a
# declared variable to land in, a read-only tool to run, a task an agent runs so
# `confirm:` has a step to name, and a clock entry with a timezone to read it in.
#
# Deliberately kept compiling on both code targets, so the byte-identical and
# per-target-warning tests have one package to read rather than two.

version: 1

name: prefetch-fixture

entry_agent: intake

agents:
  intake:
    instructions: instructions.md
    think: fast_reasoning
    speak: front_desk
    tools:
      - get_invoice
    tasks:
      - name: verify_caller
        when: Confirm who you are speaking to.
        announce: One moment while I check.
        instructions: tasks/verify_caller.md
        assign:
          - caller_phone: result.caller_phone
        result:
          caller_phone: string
        context:
          history: full
    handoffs:
      - to_billing

  billing:
    instructions: agents/billing.md
    think: careful_reasoning
    speak: specialist
    tools:
      - get_invoice

handoffs:
  to_billing:
    to: billing
    when: Caller asks about billing, an invoice, or a refund.
    requires:
      - caller_phone
    context:
      history: full
      variables: all

variables:
  customer_id:
    type: string
    default: ""
  verified:
    type: boolean
    default: false
  # All three read once at session start, from one reading of the clock, in the
  # zone the entry below names.
  booking_date:
    type: string
    default: ""
  booking_weekday:
    type: string
    default: ""
  booking_year:
    type: string
    default: ""
  # No source: here on purpose. The prefetch below reads the carrier fact and
  # this variable receives it, which is what keeps the per-route refusal for a
  # variable naming a source its target cannot supply exactly as strict as it is.
  caller_phone:
    type: string
    default: ""
    confirm: verify_caller
  caller_name:
    type: string
    default: ""

# An ordered list. Entries resolve top to bottom, so "caller" has to sit above
# "profile", which reads what it assigns. Written the other way round it is
# refused rather than quietly reordered.
prefetch:
  - name: today
    clock: now
    # The zone sits on the entry that reads it. A container clock is UTC, so
    # without this the agent would name the wrong day for anybody who is not.
    timezone: Europe/Madrid
    assign:
      - booking_date: result.date
      - booking_weekday: result.day_of_week
      - booking_year: result.year

  - name: caller
    source: from_number
    assign:
      - caller_phone: result.value

  - name: profile
    tool: lookup_customer
    # This lookup reads. The key is required either way: the compiler cannot
    # check either answer, so it makes the author state one.
    writes: false
    args:
      - phone: "{{caller_phone}}"
    assign:
      - caller_name: result.name

models:
  think:
    fast_reasoning:
      description: cheap and quick, greeting and routing
      provider: openai
      model: gpt-4o-mini
      temperature: 0.4
    careful_reasoning:
      description: slower and careful, billing work
      provider: openai
      model: gpt-4o
  speak:
    front_desk:
      description: "warm, concise"
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
    specialist:
      description: "slower, more deliberate"
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-orion-en"
  listen:
    transcriber:
      description: default STT; targets that cannot run it override the entry
      provider: deepgram
      model: nova-3
  turn:
    vad:
      description: end-of-turn preference; integrated targets warn and ignore it
      provider: local
      model: silero
      semantic_endpointing: preferred

tools:
  - lookup_customer
  - get_invoice

conversation:
  greeting:
    speaks_first: agent
    text: "Hi, you have reached Acme Support. How can I help you today?"
  interruption:
    enabled: true
    minimum_words: 2
  inactivity:
    nudge_after: 15s
    end_after: 45s
  max_duration: 20m

channels:
  web:
    kind: realtime_audio

capacity:
  peak_sessions: 40
  max_sessions: 60
  peak_starts_per_second: 4
  avg_session_duration: 6m
