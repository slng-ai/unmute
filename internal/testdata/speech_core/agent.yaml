# A version 2 package whose speech is not SLNG's: Deepgram listens, and the
# voices are Cartesia's, ElevenLabs' and Deepgram's. It compiles on both code
# targets and imports offline. It has no scenarios: nothing here runs a call.

name: speech-core

entry_agent: desk

listen: transcriber

agents:
  - name: desk
    prompt: instructions.md
    think: reasoning
    speak: voice
    tools:
      - look_up_order
    handoffs:
      - name: to_eleven
        to: eleven
        when: The caller asks for the second desk.
        context:
          history: messages
      - name: to_aura
        to: aura
        when: The caller asks for the third desk.
        context:
          history: messages

  - name: eleven
    prompt: instructions.md
    think: reasoning
    speak: eleven
    # Its own speech-to-text model: a handoff to this desk switches both.
    listen: nova_two

  - name: aura
    prompt: instructions.md
    think: reasoning
    speak: aura

# Two more agents, so the ElevenLabs and Deepgram voices are in use and compile.
secrets:
  - GOOGLE_API_KEY
  - DEEPGRAM_API_KEY
  - CARTESIA_API_KEY
  - ELEVEN_API_KEY
  - ELEVENLABS_API_KEY
  - ORDERS_API_URL
  - ORDERS_API_TOKEN

models:
  think:
    reasoning:
      provider: google
      model: gemini-3.1-flash-lite
  speak:
    voice:
      provider: cartesia
      model: sonic-3
      voice: "794f9389-aac1-45b6-b726-9d9369183238"
      language: en
    eleven:
      provider: elevenlabs
      model: flash_v2_5
      voice: UgBBYS2sOqTuMpoF3BR0
      language: en
    aura:
      provider: deepgram
      model: aura-2-thalia-en
  listen:
    transcriber:
      provider: deepgram
      model: nova-3
      language: en
    nova_two:
      provider: deepgram
      model: nova-2
      language: en
  turn:
    detector:
      provider: local
      model: silero
      pace: balanced

tools:
  - name: look_up_order
    start:
      say:
        - Let me look that up.
    save:
      - order_status: result.status

conversation:
  greeting:
    speaks_first: agent
    say: Hi, this is the order desk. What's your order number?
