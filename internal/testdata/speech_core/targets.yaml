# The same package compiles to both code targets.

channels:
  - name: web
    kind: realtime_audio

capacity:
  peak_sessions: 2
  max_sessions: 5
  avg_session_duration: 3m

targets:
  livekit:
    provider: livekit
    version: "1.8.8"
    sdk_language: python
    models:
      # LiveKit runs its own turn model rather than Silero.
      detector:
        provider: livekit
        model: turn-detector-mini
        pace: balanced

  pipecat:
    provider: pipecat
    version: "1.12.0"
    models:
      # Pipecat's Deepgram voice names the voice apart from the model; LiveKit's
      # model holds it.
      aura:
        provider: deepgram
        model: aura-2-thalia-en
        voice: aura-2-thalia-en
