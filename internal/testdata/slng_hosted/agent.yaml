# One package naming two SLNG-hosted tools, compiled to all three targets.
# This is the fixture the hosted-tool tests read, and it exists so those tests
# compile a real package rather than a hand-built value.
#
#   check_order        slng: -> a hosted `code` tool. Mirrored module included,
#                              so livekit and pipecat can run it too.
#   search_places_text slng: -> a hosted `api_request` tool. No module: its
#                              mirror carries a url, a method and the name of
#                              the credential it reads.
#   end_call           builtin: -> a curated capability, which needs no mirror
#                                 and is here to prove the two paths coexist.
#
# The two mirrors are committed. Nothing here reaches the network, which is the
# whole point: `make test` has no SLNG credential and never will.
#
# One thing to know before running `unmute pull --force` here: the request
# tool's url was de-identified by hand, the way the captures in
# internal/cli/testdata/voiceai are, and the pin recomputed over the edited
# bytes. So `unmute pull --check` correctly calls this fixture stale against the
# live organisation. Re-pulling would put the real service host back into a
# tracked file. If you do re-pull, de-identify the url and re-pin again.

version: 1

name: slng-hosted-fixture

entry_agent: support

secrets:
  # SLNG_TOOL_RENDER is the credential the hosted request tool reads, and the
  # pull is what put it here: the platform names it in config.auth.secret_name
  # and leaves declared_secrets empty. A name, never a value.
  - SLNG_TOOL_RENDER
  - OPENAI_API_KEY
  - DEEPGRAM_API_KEY
  - SLNG_API_KEY

models:
  think:
    reasoning:
      description: answers the caller
      provider: openai
      model: gpt-4o-mini
      temperature: 0.4
  speak:
    front_desk:
      description: warm, concise
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
  listen:
    transcriber:
      description: default STT
      provider: deepgram
      model: nova-3

agents:
  support:
    instructions: instructions.md
    think: reasoning
    speak: front_desk
    tools:
      - check_order
      - search_places_text
      - end_call

tools:
  - check_order
  - search_places_text
  - end_call

conversation:
  greeting:
    speaks_first: agent
    text: "Hi, you have reached Acme Support. How can I help?"
  interruption:
    enabled: true

channels:
  web:
    kind: realtime_audio

capacity:
  peak_sessions: 10
  max_sessions: 20
  peak_starts_per_second: 2
  avg_session_duration: 4m
