# One slng target. Its sibling fixture slng_hosted_code carries the same two
# hosted tools on livekit and pipecat, and they are two packages rather than one
# because a code target requires a `turn:` binding and the slng target refuses
# one: SLNG owns its own turn taking and its create body has no turn section.
# That is a pre-existing cross-target gap, not something hosted tools introduce.

channels:
  - name: web
    kind: realtime_audio

capacity:
  peak_sessions: 10
  max_sessions: 20
  peak_starts_per_second: 2
  avg_session_duration: 4m

targets:
  slng:
    provider: slng
    deployment_region: eu-north
