# The smallest twilio target package: one agent, one inbound phone channel and
# the builtin end_call. The route gates compile it on (twilio,
# conversation-relay).
version: 2

name: twilio-relay

architecture: cascade

entry_agent: desk

models:
  think:
    reasoning:
      provider: openai
      model: gpt-5.6-luna
      params:
        reasoning_effort: none
  listen:
    transcriber:
      provider: deepgram
      model: nova-3-general
      language: en-US
  speak:
    voice:
      provider: elevenlabs
      model: flash_v2_5
      voice: UgBBYS2sOqTuMpoF3BR0
      language: en-US

agents:
  - name: desk
    prompt: instructions.md
    think: reasoning
    speak: voice
    tools:
      - end_call

conversation:
  greeting:
    speaks_first: agent
    say: 'Hello & welcome, say "desk" to start.'

secrets:
  - OPENAI_API_KEY
  - TWILIO_ACCOUNT_SID
  - TWILIO_AUTH_TOKEN
  - TWILIO_PHONE_NUMBER_SID
  - TWILIO_PUBLIC_URL
