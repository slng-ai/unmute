# The two code targets. Same two hosted tools as slng_hosted, and this is where
# the portability claim is checked: the committed mirror has to be enough to
# build a working tool in a generated project, offline.

channels:
  - name: web
    kind: realtime_audio

capacity:
  peak_sessions: 10
  max_sessions: 20
  peak_starts_per_second: 2
  avg_session_duration: 4m

targets:
  livekit:
    provider: livekit
    version: "1.8.8"
    sdk_language: python
    models:
      vad:
        provider: livekit
        model: turn-detector-mini
        semantic_endpointing: preferred

  pipecat:
    provider: pipecat
    version: "1.12.0"
