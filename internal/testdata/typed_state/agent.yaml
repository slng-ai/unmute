# Typed-state fixture: the smallest package that declares a shape and reads it.
#
# It exists because every other package in the tree declares only primitive
# variables, so before this there was nothing to compile as proof that a shape
# resolves, generates a class, and reaches a prompt. Deliberately small: one
# agent, two steps, one shape.
#
# The variables are one per thing the state block has to get right. A list
# of literals renders as compact JSON and refuses an entry outside the set. A
# list of shapes is what an append writes into. And `caller_phone` carries a
# `confirm:`, so it renders in exactly one prompt and stays unconfirmed until
# the caller has agreed, which the block's own filter has to reproduce.
#
# The last two cover the email types, which are the only ones checked by a
# library rather than a pattern. `reminder_email` is the plain address, so the
# module compiles no regex for it and still has to import the checker.
# `booked_for` is the pair, which is a shape this compiler supplies rather than
# one this file declares, so a path into it proves the seeded catalog resolves
# the same way a declared shape does.
version: 1

name: typed-state

entry_agent: desk

secrets:
  - OPENAI_API_KEY
  - DEEPGRAM_API_KEY
  - SLNG_API_KEY

shapes:
  - name: Appointment
    description: One thing being booked, moved or cancelled.
    fields:
      - scheduled_date: Date
      - name: scheduled_time
        type: Time
        description: The time the caller agreed to.
      - name: appointment_type
        type: Literal["haircut", "dry_cut"]
        description: The service the caller asked for, in the salon's own words.

variables:
  count:
    type: int
  accepted:
    type: bool
  caller_reason:
    type: list[Literal["create_booking", "cancel_booking"]]
    description: Why the caller rang. More than one, because one call can do more than one thing.

  appointments:
    type: list[Appointment]
    description: What this call has booked so far, in the order the caller gave them.

  caller_phone:
    type: Phone
    default: ""
    confirm: confirm_number
    description: The number the caller rang from, once they have agreed it is theirs.

  last_appointment:
    type: Appointment | None
    description: The appointment most recently booked on this call, so a prompt can name one part of it.

  reminder_email:
    type: EmailStr
    default: ""
    description: Where the caller wants the reminder sent, saved only once they have spelled it out.

  booked_for:
    type: NameEmail
    description: Who the appointment is under, with their name and their email address held apart.

agents:
  desk:
    instructions: instructions.md
    think: reasoning
    speak: voice
    tasks:
      - name: confirm_number
        when: Read the caller's number back and get a yes before anything acts on it.
        instructions: tasks/confirm_number.md
        assign:
          - caller_phone: result.caller_phone
        context:
          history: reset

      - name: book
        when: The caller wants an appointment.
        instructions: tasks/book.md
        tools:
          - inspect_state
        assign:
          - caller_reason+: result.reason
          - appointments+: result.appointment
          - last_appointment: result.appointment
        context:
          history: reset

      # Its own step rather than two more fields on `book`, for the reason a
      # real agent would split them: the caller gives an address by spelling it
      # out, which is a turn of its own, and a step whose finish demands every
      # field refuses the whole booking when one of them is missing.
      - name: take_contact
        when: The caller wants the confirmation sent to them.
        instructions: tasks/contact.md
        assign:
          - booked_for: result.booked_for
          - reminder_email: result.booked_for.email
        context:
          history: messages

      - name: record_flags
        when: Record the count and agreement.
        instructions: tasks/flags.md
        assign:
          - count: result.count
          - accepted: result.accepted
        context:
          history: messages
      - name: no_output
        when: Finish a task that saves nothing.
        instructions: tasks/flags.md
        context:
          history: messages

models:
  think:
    # Through the SLNG Context Router, because that is the path the declared
    # state travels on a real call: the block's placeholders are substituted by
    # the router from a snapshot it is given per request, and whether that
    # snapshot is fresh is the one thing the two targets used to differ on.
    reasoning:
      provider: slng
      model: openai/gpt-4o-mini
      agent_id: typed-state-v1
      upstream:
        provider: openai
        key_env: OPENAI_API_KEY
      params:
        world_part_override: eu
        reasoning_effort: "none"
  speak:
    voice:
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
  listen:
    transcriber:
      provider: deepgram
      model: nova-3
  turn:
    vad:
      provider: local
      model: silero

conversation:
  greeting:
    speaks_first: agent
    text: "Hi, this is the salon. How can I help?"

channels:
  web:
    kind: realtime_audio

capacity:
  peak_sessions: 5
  max_sessions: 10
  avg_session_duration: 5m

tools:
  - inspect_state
