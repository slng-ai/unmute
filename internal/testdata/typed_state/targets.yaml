# One instance per code target. The same source compiles to both, which is what
# the typed-state gates compare.

channels:
  - name: web
    kind: realtime_audio

capacity:
  peak_sessions: 5
  max_sessions: 10
  avg_session_duration: 5m

targets:
  livekit:
    provider: livekit
    version: "1.8.8"
    sdk_language: python
    models:
      # LiveKit runs its own turn model rather than Silero.
      vad:
        provider: livekit
        model: turn-detector-mini

  pipecat:
    provider: pipecat
    version: "1.12.0"
