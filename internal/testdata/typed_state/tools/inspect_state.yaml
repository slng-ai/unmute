inject:
  - appointment: "{{state.last_appointment}}"
  - date: "{{state.last_appointment.scheduled_date}}"
  - accepted: "{{state.accepted}}"
  - count: "{{state.count}}"
  - label: "Date {{state.last_appointment.scheduled_date}}"
local:
  handler: tools/inspect_state.py:inspect_state
interruption: provider_default
effect: returns_data
