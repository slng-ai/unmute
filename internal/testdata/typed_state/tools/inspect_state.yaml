description: Return the deliberately selected values for the sharing check.
input:
  type: object
  properties:
    note:
      type: string
  required:
    - note
inject:
  - appointment: "{{state.last_appointment}}"
  - date: "{{state.last_appointment.scheduled_date}}"
  - accepted: "{{state.accepted}}"
  - count: "{{state.count}}"
  - label: "Date {{state.last_appointment.scheduled_date}}"
local:
  handler: tools/inspect_state.py
interruption: provider_default
effect: returns_data
