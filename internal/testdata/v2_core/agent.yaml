# Version 2 fixture: the smallest package that writes every key version 2 adds.
#
# Each key appears once, so the golden IR shows what each one resolves to.
# The tools' types come from tools/salon.py, read by unmute-core's local_tool.
# Every spoken line names values only as {{state.x}}. Where the step fills x
# from the tool's input or result, the compiler reads it from there.

name: v2-core

entry_agent: desk

secrets:
  - OPENAI_API_KEY
  - DEEPGRAM_API_KEY
  - SLNG_API_KEY

variables:
  - name: caller_name
    call_start: required
  - name: caller_phone
    call_start: optional
  - name: account_id
    dependencies:
      - caller_phone

prefetch:
  - name: account
    call: lookup_account
    writes: false
    background: true
    needs_confirmed:
      - caller_phone
    save:
      - account_id: result.account_id

agents:
  - name: desk
    prompt: instructions.md
    think: reasoning
    speak: voice
    flows:
      - name: check_in
        when: The caller is new to the salon.
        steps:
          - take_name
          - note_reason
        context_scope: shared
        then: end
        fills:
          - caller_phone
        non_blocking:
          - note_reason
    tasks:
      - name: manage_booking
        when: The caller wants to book an appointment.
        prompt: tasks/booking.md
        tools:
          # The step's own outcome comes before the tool's: code says the
          # offer here, and the tool's line when nothing is free.
          - name: find_slots
            outcomes:
              - if:
                  - status: free
                say:
                  - "I have {{result.slots}} free. Which suits you?"
          - name: save_booking
            confirm:
              - "Shall I book your {{state.booking.service}} on {{state.booking.day}} at {{state.booking.time}}?"
            outcomes:
              - if:
                  - status: booked
                say:
                  - "You're all set for {{state.appointment.spoken}}."
                then: done
              - if:
                  - status: slot_taken
                say:
                  - That time has just gone. Shall I try another?
        fills:
          - preferred_day
        start:
          call: find_slots
          with:
            - day: state.preferred_day
        save:
          - booking: input.booking
          - appointment: result.appointment
        context:
          history: messages

      - name: take_name
        prompt: tasks/take_name.md
        save:
          - caller_name: result.caller_name
        context:
          history: messages

      - name: note_reason
        prompt: tasks/note_reason.md
        save:
          - reason: result.reason
        context:
          history: messages

models:
  think:
    reasoning:
      provider: slng
      model: openai/gpt-4o-mini
      agent_id: v2-core-v1
      upstream:
        provider: openai
        key_env: OPENAI_API_KEY
      params:
        world_part: eu-west
        reasoning_effort: "none"
  speak:
    voice:
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
      params:
        world_part: eu-north
  listen:
    transcriber:
      provider: deepgram
      model: nova-3
  turn:
    vad:
      provider: local
      model: silero

conversation:
  greeting:
    speaks_first: agent
    say: "Hi {{state.caller_name}}, this is the salon. How can I help?"
    instruction: Greet the caller by name and ask how you can help.
    interruptible: false
  inactivity:
    nudge_after: 15s
    end_after: 45s
    nudge_text: Are you still there?
    end_text: I'll let you go now. Call back any time.

tools:
  - name: find_slots
    hidden:
      - read_back
    save:
      - offered_slots: result.slots
    outcomes:
      - if:
          - status:
              - none_free
              - closed
        say:
          - "Nothing is free on {{state.preferred_day}}. Would another day work?"
          - That day is full, I'm afraid. Shall I try another?
