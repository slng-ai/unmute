# One LiveKit target in two places. The agent, the prompt and every agent
# definition are the same in both; what differs is which model entries each
# region reads, and that is the whole of what a region declares.
#
# `unmute compile` writes build/livekit/us-east/ and build/livekit/eu-central/,
# and each one deploys under its own agent name.

targets:
  livekit:
    provider: livekit
    version: "1.8.1"
    sdk_language: python
    models:
      # override the vad entry: LiveKit runs its own turn model, not Silero
      vad:
        provider: livekit
        model: turn-detector-mini
        semantic_endpointing: preferred
    deployment_region:
      - us-east
      - eu-central:
          - transcriber: transcriber_fr
          - front_desk: front_desk_fr
