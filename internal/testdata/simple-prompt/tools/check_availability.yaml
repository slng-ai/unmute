description: >-
  List Sage and Stone slots for one service and date. Call only after customer
  identification succeeds. This tool accepts only service and date.

input:
  type: object
  properties:
    service:
      type: string
      enum:
        - haircut
        - hair-color
        - blowout
    date:
      type: string
      description: Preferred date in YYYY-MM-DD form
  required:
    - service
    - date

output:
  type: object
  properties:
    slots:
      type: array
      items:
        type: object
        properties:
          slot_id:
            type: string
          start_time:
            type: string
        required:
          - slot_id
          - start_time
  required:
    - slots

local:
  handler: tools/check_availability.py

interruption: provider_default
effect: returns_data
