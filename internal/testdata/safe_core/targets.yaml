# One instance per primary target. The same portable source compiles to all four.
# Each instance carries infrastructure only (provider, version, connection) plus
# a `models:` override map, keyed by model name, for the
# entries this target cannot run as defined in agent.yaml (N15). An override
# replaces the whole entry; overrides are forwarded to the provider as-is and
# never validated (SCHEMA.md, D10); secrets and URLs are env var names only.
# Instances are named after the provider: what you test is what you deploy.

targets:
  livekit:
    provider: livekit
    version: "1.5.2"            # framework pin; the driver checks its range (>=1.5, <2.0)
    sdk_language: python
    models:
      # override the vad entry: LiveKit runs its own turn model, not Silero
      vad:
        provider: livekit
        model: turn-detector-mini
        semantic_endpointing: preferred
      front_desk:
        provider: elevenlabs
        voice: cgSgspJ2msm6clMCkdW9
      specialist:
        provider: elevenlabs
        voice: EXAVITQu4vr4xnSDxMaL

  pipecat:
    provider: pipecat
    version: "1.5.0"
    connection: daily_provisioned   # cold_transfer needs Daily SIP on Pipecat
    # no model overrides: the agent.yaml defaults (SLNG + OpenAI + deepgram STT
    # + local silero VAD) run as defined

  vapi:
    provider: vapi
    models:
      # turn is integrated on Vapi; the vad entry is unused there. Endpointing
      # intent comes from the conversation block, not from a bound model.
      front_desk:
        provider: elevenlabs
        voice: cgSgspJ2msm6clMCkdW9
      specialist:
        provider: elevenlabs
        voice: EXAVITQu4vr4xnSDxMaL

  deepgram:
    provider: deepgram
    version: "1"
    models:
      # turn is integrated into listen on Deepgram: turn thresholds ride the
      # transcriber override's params, because that is where Deepgram puts them.
      transcriber:
        model: flux
        params:
          eot_threshold: 0.7
      # both voices below are Deepgram voices, or a fixed third-party list
      front_desk:
        model: aura-2-thalia-en
      specialist:
        model: aura-2-orion-en
