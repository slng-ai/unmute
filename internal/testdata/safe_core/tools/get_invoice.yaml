# The file name is the tool name: get_invoice (SCHEMA.md, N4).
description: Fetch the most recent invoice for a customer id. Returns the invoice total and status.

input:
  type: object
  properties:
    customer_id: { type: string, description: The customer id from lookup_customer }
  required: [customer_id]

output:
  type: object
  properties:
    invoice_id: { type: string }
    total:      { type: number }
    status:     { type: string }

webhook:
  url_env: GET_INVOICE_URL

interruption: provider_default
effect: returns_data
