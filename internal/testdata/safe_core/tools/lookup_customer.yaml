# The file name is the tool name: lookup_customer (SCHEMA.md, N4).
description: Look up a customer record by phone number or email. Returns the customer id and name.

input:
  type: object
  properties:
    phone: { type: string, description: Caller phone number in E.164 form }
    email: { type: string, description: Caller email address }

# Output schemas are enforced on code targets only (SCHEMA.md, section 5).
output:
  type: object
  properties:
    customer_id: { type: string }
    name:        { type: string }

execution: webhook              # the only execution kind proven on all five
url_env: LOOKUP_CUSTOMER_URL    # env var name, never a value
interruption: provider_default
effect: returns_data
