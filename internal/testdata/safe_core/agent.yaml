# Safe-core example: runs on all four primary targets
# (LiveKit, Pipecat, Vapi, Deepgram) with warnings only,
# no failures. It follows SCHEMA.md section 7 exactly.
#
# What it deliberately avoids, and why:
#   - tasks / task_groups: running a step and returning is unverified on Vapi
#   - history other than `full`: fails on Pipecat
#   - requires:, fallback:, thinking_audio:, human transfer: each fails
#     on at least one of the four
#   - outbound calls: omitted; Deepgram's carrier-conditional lowering warns

version: 1

name: safe-core-fixture

entry_agent: intake

agents:
  intake:
    instructions: instructions.md
    think: fast_reasoning
    speak: front_desk
    tools:
      - lookup_customer
    handoffs:
      - to_billing

  billing:
    instructions: agents/billing.md
    think: careful_reasoning
    speak: specialist
    tools:
      - get_invoice

handoffs:
  to_billing:
    to: billing
    when: Caller asks about billing, an invoice, or a refund.
    context:
      history: full       # the only history value that works on all four
      variables: all      # the only variables value managed targets accept

variables:
  customer_id:
    type: string
  verified:
    type: boolean
    default: false

# Every model is defined once, here, in the central map grouped by kind (N15):
# think (LLM), speak (TTS), listen (STT), turn (VAD). Agents reference think
# and speak by name; listen/turn select themselves when their section has one
# entry. targets.yaml only overrides an entry a target cannot run as-is.
models:
  think:
    fast_reasoning:
      description: cheap and quick, greeting and routing
      provider: openai
      model: gpt-4o-mini
      temperature: 0.4
    careful_reasoning:
      description: slower and careful, billing work
      provider: openai
      model: gpt-4o
  speak:
    front_desk:
      description: "warm, concise"
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
    specialist:
      description: "slower, more deliberate"
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-orion-en"
  listen:
    transcriber:
      description: default STT; targets that cannot run it override the entry
      provider: deepgram
      model: nova-3
  turn:
    vad:
      description: end-of-turn preference; integrated targets warn and ignore it
      provider: local
      model: silero
      semantic_endpointing: preferred

tools:
  - lookup_customer
  - get_invoice

conversation:
  greeting:
    speaks_first: agent
    # Fixed opening: same words every call, works on all four targets.
    # Leave `text` out to let the model write the opening from the prompt;
    # that warns on Deepgram (SCHEMA.md 4.8).
    text: "Hi, you have reached Acme Support. How can I help you today?"
  interruption:
    enabled: true
    minimum_words: 2
    ignore_phrases:   # warns on Deepgram (dropped)
      - okay
      - right
      - uh-huh
  inactivity:
    nudge_after: 15s
    end_after: 45s
  max_duration: 20m

channels:
  web:
    kind: realtime_audio

capacity:
  peak_sessions: 40
  max_sessions: 60
  peak_starts_per_second: 4
  avg_session_duration: 6m
