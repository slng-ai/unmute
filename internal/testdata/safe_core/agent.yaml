# Safe-core example: runs on all five primary targets
# (LiveKit, Pipecat, Vapi, ElevenLabs, Deepgram) with warnings only,
# no failures. It follows SCHEMA.md section 7 exactly.
#
# What it deliberately avoids, and why:
#   - tasks / task_groups: delegate-and-return is unverified on Vapi
#   - history other than `full`: fails on ElevenLabs
#   - requires:, fallback:, thinking_audio:, warm transfer: each fails
#     on at least one of the five
#   - outbound calls: omitted; Deepgram's carrier-conditional lowering warns

version: 1
language: en
entry_agent: intake

# Every model is defined once, here, in the central map grouped by kind (N15):
# think (LLM), speak (TTS), listen (STT), turn (VAD). Agents reference think
# and speak by name; listen/turn select themselves when their section has one
# entry. targets.yaml only overrides an entry a target cannot run as-is.
models:
  think:
    fast_reasoning:
      description: cheap and quick, greeting and routing
      provider: openai
      model: gpt-4o-mini
      temperature: 0.4
    careful_reasoning:
      description: slower and careful, billing work
      provider: openai
      model: gpt-4o
  speak:
    front_desk:
      description: "warm, concise"
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
    specialist:
      description: "slower, more deliberate"
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-orion-en"
  listen:
    transcriber:
      description: default STT; targets that cannot run it override the entry
      provider: deepgram
      model: nova-3
  turn:
    vad:
      description: end-of-turn preference; integrated targets warn and ignore it
      provider: local
      model: silero
      semantic_endpointing: preferred

variables:
  customer_id: { type: string }
  verified:    { type: boolean, default: false }

agents:
  intake:
    instructions: instructions.md
    model: fast_reasoning
    voice: front_desk
    tools: [lookup_customer, to_billing]

  billing:
    instructions: agents/billing.md
    model: careful_reasoning
    voice: specialist
    tools: [get_invoice, to_human]

controls:
  to_billing:
    kind: agent_transfer
    to: billing
    when: Caller asks about billing, an invoice, or a refund.
    context:
      history: full       # the only history value ElevenLabs accepts
      variables: all      # the only variables value managed targets accept

  to_human:
    kind: human_transfer
    destination: billing_line   # resolved per target in targets.yaml
    mode: cold                  # warm is not emitted by every driver yet

tools: [lookup_customer, get_invoice]

conversation:
  greeting:
    speaks_first: agent
    # Fixed opening: same words every call, works on all five targets.
    # Leave `text` out to let the model write the opening from the prompt;
    # that is conditional on ElevenLabs and warns on Deepgram (SCHEMA.md 4.8).
    text: "Hi, you have reached Acme Support. How can I help you today?"
  interruption:
    enabled: true
    minimum_words: 2                        # warns on ElevenLabs (no such knob)
    ignore_phrases: [okay, right, uh-huh]   # warns on Deepgram (dropped)
  inactivity: { nudge_after: 15s, end_after: 45s }
  max_duration: 20m

channels:
  web: { kind: realtime_audio }

capacity:
  peak_sessions: 40
  max_sessions: 60
  peak_starts_per_second: 4
  avg_session_duration: 6m
