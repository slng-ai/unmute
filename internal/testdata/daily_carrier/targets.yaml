channels:
  - name: phone
    kind: telephony
    inbound: true
    outbound: true

capacity:
  peak_sessions: 2
  max_sessions: 4
  peak_starts_per_second: 1
  avg_session_duration: 3m

targets:
  pipecat:
    provider: pipecat
    version: "1.12.0"
    connection: twilio_sip_daily
    deployment_region: us-west
