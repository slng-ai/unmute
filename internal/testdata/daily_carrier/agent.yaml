# The (pipecat, daily-sip, twilio) carrier form, as a fixture.
#
# This package preserves coverage for a route that should not be a public
# recommendation: the route keeps
# its code, its capability rows, and its guards, and stops shipping an example
# that would recommend it over the route with nothing to host. Everything the
# route's tests need is here.
version: 2

name: daily-carrier-fixture

entry_agent: front_desk

agents:
  - name: front_desk
    prompt: instructions.md
    think: reasoning
    speak: voice
    transfers:
      - name: send_to_billing
        to: BILLING_PHONE_NUMBER
        when: The caller asks about an invoice or a refund.

models:
  think:
    reasoning:
      provider: openai
      model: gpt-4o-mini
  speak:
    voice:
      provider: openai
      model: tts-1
      voice: alloy
  listen:
    transcriber:
      provider: openai
      model: whisper-1
  turn:
    detector:
      provider: local
      model: silero

conversation:
  greeting:
    speaks_first: agent
    say: "Front desk on the Daily carrier line. How can I help?"
