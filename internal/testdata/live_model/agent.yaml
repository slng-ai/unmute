# The smallest package on the live architecture: one agent, two tools, a
# greeting the model speaks in its own words, and an idle nudge. The live model
# listens, thinks and speaks; the backend it names runs the tools and the hard
# reasoning at OpenAI. internal/generate/live_test.go reads the emitted bot.
version: 2

name: live-model

architecture: live

entry_agent: desk

secrets:
  - OPENAI_API_KEY

models:
  live:
    - name: voice
      provider: openai
      model: gpt-live-1
      voice: marin
      # Tools and reasoning run here, while the live model keeps talking.
      backend: fast
  think:
    fast:
      provider: openai
      model: gpt-5.6-terra

agents:
  - name: desk
    prompt: instructions.md
    live: voice
    tools:
      - lookup_customer
      - check_availability

conversation:
  greeting:
    speaks_first: agent
    say: "Hi, this is Sage and Stone Salon. How can I help?"
  inactivity:
    nudge_after: 20s
    end_after: 60s
