# The file name is the tool name: send_confirmation (SCHEMA.md, N4).
description: Send the caller a confirmation text for their booking. Call only after the caller has agreed to receive it.

input:
  type: object
  properties:
    name:
      type: string
      description: The name the booking is under
    phone:
      type: string
      description: Caller phone number in E.164 form
    summary:
      type: string
      description: One-line summary of the booking to include
  required:
    - name
    - phone
    - summary

output:
  type: object
  properties:
    sent:
      type: boolean

webhook:
  url_env: SEND_CONFIRMATION_URL

interruption: provider_default
effect: returns_data
