# Remy: a restaurant-group phone concierge. Invented example for the LiveKit
# driver, showing the hybrid pattern: agent handoff for routing, plus task
# groups for guided collection, all on the SLNG Execution Layer.
#
# A greeter (Remy) hands off to a reservations agent or an events agent
# (agent_transfer). Each specialist delegates to a task group that qualifies the
# request, then runs a shared confirm-booking step. Control returns to the
# specialist (then: return), which closes or hands back to the greeter.
#
# Targeted at LiveKit only: task groups and delegate-return are code-target
# features (they fail on Vapi), and this is the LiveKit first-run example.

version: 1
entry_agent: greeter

# Models are defined once, in the central map grouped by kind (N15). Agents
# reference think and speak entries by name; the sole listen and turn entries
# select themselves. targets.yaml carries infrastructure only.
models:
  think:
    reasoning:
      description: greeting, routing, and the booking tasks
      provider: openai
      model: gpt-4o-mini
      temperature: 0.4
  speak:
    host:
      description: "warm, upbeat greeter"
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
    desk:
      description: "calm, precise booking voice"
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-orion-en"
  listen:
    transcriber:
      provider: slng
      model: "slng/deepgram/nova:3-en"
  turn:
    detector:
      provider: livekit
      model: turn-detector-mini

variables:
  caller_phone: { type: string }

agents:
  greeter:
    instructions: instructions.md
    model: reasoning
    voice: host
    tools: [to_reservations, to_events]

  reservations:
    instructions: agents/reservations.md
    model: reasoning
    voice: desk
    tools: [do_reserve, back_to_greeter]

  events:
    instructions: agents/events.md
    model: reasoning
    voice: desk
    tools: [do_event, back_to_greeter]

tasks:
  find_slot:
    instructions: tasks/find_slot.md
    tools: [check_availability]
    result:
      date: string
      time: string
      party_size: integer
    context:
      history: full

  qualify_event:
    instructions: tasks/qualify_event.md
    result:
      occasion: string
      headcount: integer
      date: string
    context:
      history: full

  confirm_booking:
    instructions: tasks/confirm_booking.md
    tools: [send_confirmation]
    result:
      sent: boolean
    context:
      history: full

task_groups:
  reserve_group:
    steps: [find_slot, confirm_booking]
    context_scope: shared      # each step sees the group context; on LiveKit -> TaskGroup (warns, experimental)
    then: return               # control comes back to the reservations agent
    merge: results

  events_group:
    steps: [qualify_event, confirm_booking]
    context_scope: shared
    then: return
    merge: results

controls:
  to_reservations:
    kind: agent_transfer
    to: reservations
    when: Caller wants to book a table for a normal dine-in visit.
    context:
      history: full
      variables: all

  to_events:
    kind: agent_transfer
    to: events
    when: Caller wants to plan a private event, party, or large group booking.
    context:
      history: full
      variables: all

  back_to_greeter:
    kind: agent_transfer
    to: greeter
    when: Caller wants something else, or to start over.
    context:
      history: full
      variables: all

  do_reserve:
    kind: delegate
    group: reserve_group
    when: The caller is ready to book a table; run the reservation flow.

  do_event:
    kind: delegate
    group: events_group
    when: The caller is ready to plan their event; run the events flow.

tools: [check_availability, send_confirmation]

conversation:
  greeting:
    speaks_first: agent
    text: "Hi, this is Remy at Fern and Oak. Are you booking a table, or planning a private event?"
  interruption:
    enabled: true
  inactivity: { nudge_after: 15s, end_after: 45s }
  max_duration: 20m

channels:
  web: { kind: realtime_audio }

capacity:
  peak_sessions: 20
  max_sessions: 40
  avg_session_duration: 4m
