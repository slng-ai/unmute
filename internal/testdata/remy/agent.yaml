# Remy: a restaurant-group phone concierge. Invented example for the LiveKit
# driver, showing the hybrid pattern: agent handoff for routing, plus task
# groups for guided collection, all on the SLNG Execution Layer.
#
# A greeter (Remy) hands off to a reservations agent or an events agent, through
# an entry under `handoffs:`. Each specialist runs a task group that qualifies the
# request, then runs a shared confirm-booking step. Control returns to the
# specialist (then: return), which closes or hands back to the greeter.
#
# Targeted at LiveKit only: task groups and task-return are code-target features
# (they fail on Vapi), and this is the LiveKit first-run example.

name: remy-fixture

entry_agent: greeter

agents:
  - name: greeter
    prompt: instructions.md
    think: reasoning
    speak: host
    handoffs:
      - name: to_reservations
        to: reservations
        when: Caller wants to book a table for a normal dine-in visit.
        context:
          history: full

      - name: to_events
        to: events
        when: Caller wants to plan a private event, party, or large group booking.
        context:
          history: full

  - name: reservations
    prompt: agents/reservations.md
    think: reasoning
    speak: desk
    # Both steps of do_reserve. Neither carries a when:, so neither is something
    # this agent decides to run on its own: the group runs them in order.
    tasks:
      # The only announcing step in this package, and the only one a single
      # group runs, which is what makes it countable: its line has to be emitted
      # exactly once, as the step is entered, and not again where the agent
      # calls it. Alternatives so the chooser is exercised too. It lives here
      # because the shipped example that used to hold this gate,
      # examples/salon-concierge, dropped its task group on 2026-09-16 when
      # groups turned out to produce no speech at all on Pipecat (trace
      # 5a330c65).
      - name: find_slot
        start:
          say:
            - Let me see what is open.
            - One moment, let me look at the book.
        prompt: tasks/find_slot.md
        tools:
          - check_availability
        context:
          history: full

      - name: confirm_booking
        prompt: tasks/confirm_booking.md
        tools:
          - send_confirmation
        context:
          history: full
    flows:
      - name: do_reserve
        when: The caller is ready to book a table; run the reservation flow.
        steps:
          - find_slot
          - confirm_booking
        context_scope: shared  # each step sees the group context; on LiveKit -> TaskGroup (warns, experimental)
        then: return           # control comes back to the reservations agent
        merge: results
    handoffs:
      - name: back_to_greeter
        to: greeter
        when: Caller wants something else, or to start over.
        context:
          history: full

  - name: events
    prompt: agents/events.md
    think: reasoning
    speak: desk
    tasks:
      - name: qualify_event
        prompt: tasks/qualify_event.md
        context:
          history: full
    flows:
      - name: do_event
        when: The caller is ready to plan their event; run the events flow.
        steps:
          - qualify_event
          - confirm_booking
        context_scope: shared
        then: return
        merge: results

# Models are defined once, in the central map grouped by kind (N15). Agents
# reference think and speak entries by name; the sole listen and turn entries
# select themselves. targets.yaml carries infrastructure only.
    handoffs:
      - back_to_greeter

models:
  think:
    reasoning:
      description: greeting, routing, and the booking tasks
      provider: openai
      model: gpt-4o-mini
      temperature: 0.4
  speak:
    host:
      description: "warm, upbeat greeter"
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
      params:
        world_part: eu-north
    desk:
      description: "calm, precise booking voice"
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-orion-en"
      params:
        world_part: eu-north
  listen:
    transcriber:
      provider: slng
      model: "slng/deepgram/nova:3-en"
      params:
        world_part: eu-north
  turn:
    detector:
      provider: livekit
      model: turn-detector-mini

conversation:
  greeting:
    speaks_first: agent
    say: "Hi, this is Remy at Fern and Oak. Are you booking a table, or planning a private event?"
  interruption:
    enabled: true
  inactivity:
    nudge_after: 15s
    end_after: 45s
  max_duration: 20m
