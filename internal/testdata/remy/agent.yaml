# Remy: a restaurant-group phone concierge. Invented example for the LiveKit
# driver, showing the hybrid pattern: agent handoff for routing, plus task
# groups for guided collection, all on the SLNG Execution Layer.
#
# A greeter (Remy) hands off to a reservations agent or an events agent, through
# an entry under `handoffs:`. Each specialist runs a task group that qualifies the
# request, then runs a shared confirm-booking step. Control returns to the
# specialist (then: return), which closes or hands back to the greeter.
#
# Targeted at LiveKit only: task groups and task-return are code-target features
# (they fail on Vapi), and this is the LiveKit first-run example.

version: 1

name: remy-fixture

entry_agent: greeter

agents:
  greeter:
    instructions: instructions.md
    think: reasoning
    speak: host
    handoffs:
      - to_reservations
      - to_events

  reservations:
    instructions: agents/reservations.md
    think: reasoning
    speak: desk
    # Both steps of do_reserve. Neither carries a when:, so neither is something
    # this agent decides to run on its own: the group runs them in order.
    tasks:
      - name: find_slot
        instructions: tasks/find_slot.md
        tools:
          - check_availability
        result:
          date: string
          time: string
          party_size: integer
        context:
          history: full

      - name: confirm_booking
        instructions: tasks/confirm_booking.md
        tools:
          - send_confirmation
        result:
          sent: boolean
        context:
          history: full
    task_groups:
      - do_reserve
    handoffs:
      - back_to_greeter

  events:
    instructions: agents/events.md
    think: reasoning
    speak: desk
    tasks:
      - name: qualify_event
        instructions: tasks/qualify_event.md
        result:
          occasion: string
          headcount: integer
          date: string
        context:
          history: full
    task_groups:
      - do_event
    handoffs:
      - back_to_greeter

handoffs:
  to_reservations:
    to: reservations
    when: Caller wants to book a table for a normal dine-in visit.
    context:
      history: full
      variables: all

  to_events:
    to: events
    when: Caller wants to plan a private event, party, or large group booking.
    context:
      history: full
      variables: all

  back_to_greeter:
    to: greeter
    when: Caller wants something else, or to start over.
    context:
      history: full
      variables: all

task_groups:
  do_reserve:
    when: The caller is ready to book a table; run the reservation flow.
    steps:
      - find_slot
      - confirm_booking
    context_scope: shared      # each step sees the group context; on LiveKit -> TaskGroup (warns, experimental)
    then: return               # control comes back to the reservations agent
    merge: results

  do_event:
    when: The caller is ready to plan their event; run the events flow.
    steps:
      - qualify_event
      - confirm_booking
    context_scope: shared
    then: return
    merge: results

variables:
  caller_phone:
    type: string

# Models are defined once, in the central map grouped by kind (N15). Agents
# reference think and speak entries by name; the sole listen and turn entries
# select themselves. targets.yaml carries infrastructure only.
models:
  think:
    reasoning:
      description: greeting, routing, and the booking tasks
      provider: openai
      model: gpt-4o-mini
      temperature: 0.4
  speak:
    host:
      description: "warm, upbeat greeter"
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-thalia-en"
    desk:
      description: "calm, precise booking voice"
      provider: slng
      model: "slng/deepgram/aura:2-en"
      voice: "aura-2-orion-en"
  listen:
    transcriber:
      provider: slng
      model: "slng/deepgram/nova:3-en"
  turn:
    detector:
      provider: livekit
      model: turn-detector-mini

tools:
  - check_availability
  - send_confirmation

conversation:
  greeting:
    speaks_first: agent
    text: "Hi, this is Remy at Fern and Oak. Are you booking a table, or planning a private event?"
  interruption:
    enabled: true
  inactivity:
    nudge_after: 15s
    end_after: 45s
  max_duration: 20m

channels:
  web:
    kind: realtime_audio

capacity:
  peak_sessions: 20
  max_sessions: 40
  avg_session_duration: 4m
