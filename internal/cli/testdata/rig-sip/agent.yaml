# The rig's package for the self-hosted trunk route, and deliberately the
# smallest thing that can take a call on it.
#
# The providers are OpenAI rather than the project's own, for one reason that
# decides whether this check can exist at all: OPENAI_BASE_URL is read from the
# environment, so a placeholder key plus a dead loopback base URL lets the agent
# be constructed and fail its provider calls locally. The rig asserts nothing
# about conversation, so those calls failing is the intended outcome.
version: 1
entry_agent: reception

secrets:
  - OPENAI_API_KEY
  - SIP_TRUNK_HOSTNAME
  - SIP_AUTH_USERNAME
  - SIP_AUTH_PASSWORD
  - SIP_FROM_NUMBER

models:
  think:
    reasoning:
      provider: openai
      model: gpt-5.6-terra
  speak:
    voice:
      provider: openai
      model: gpt-4o-mini-tts
      voice: alloy
  listen:
    transcriber:
      provider: openai
      model: gpt-4o-transcribe
  turn:
    detector:
      provider: local
      model: silero

agents:
  reception:
    instructions: instructions.md
    model: reasoning
    voice: voice

conversation:
  greeting:
    speaks_first: agent
    text: "Rig here."
  interruption:
    enabled: true

channels:
  phone:
    kind: telephony
    inbound: true
    # Inbound only. This route emits no dial-out path at all, so an outbound
    # direction would declare a capability with no code behind it.
    outbound: false

capacity:
  peak_sessions: 1
  max_sessions: 2
  peak_starts_per_second: 1
  avg_session_duration: 1m
