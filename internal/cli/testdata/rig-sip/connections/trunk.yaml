# The self-hosted trunk route: the operator runs LiveKit Server and LiveKit SIP,
# and locally `unmute dev --telephony` is what runs them. Names only, never
# values.
transport: sip
carrier: twilio
environment:
  sip_address: SIP_TRUNK_HOSTNAME
  sip_username: SIP_AUTH_USERNAME
  sip_password: SIP_AUTH_PASSWORD
  from_number: SIP_FROM_NUMBER
