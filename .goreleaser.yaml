# The whole release, in one file. Pushing a v* tag is the only action a human
# takes; .github/workflows/release.yml runs `goreleaser release --clean` and
# everything below happens once. GoReleaser v2 free tier only, no Pro keys.
#
# Comments marked "Rollout Phase N:" are the only lines that change between
# rollout stages.
version: 2

project_name: unmute

# Rollout Phase 2: uncomment to build through proxy.golang.org and verify
# against sum.golang.org (verifiable builds). Needs the module to be publicly
# fetchable. Tag builds only; snapshots ignore it either way.
# gomod:
#   proxy: true

builds:
  - env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64] # the default adds 386; we ship these 6 pairs
    main: .
    binary: unmute
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}" # no wall clock, so rebuilds match
    ldflags:
      - -s -w
        -X main.version={{.Version}}
        -X main.commit={{.ShortCommit}}
        -X main.date={{.CommitDate}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip] # winget needs zip; LICENSE and README ride along by default

checksum: {} # defaults: unmute_<version>_checksums.txt, sha256

sboms:
  - artifacts: archive # syft writes one <archive>.sbom.json (SPDX) per archive

# Keyless: cosign gets its identity from the workflow's OIDC token, so there is
# no key to store or rotate. Signing the checksums file covers every archive
# through the hashes it lists. The bundle holds certificate and signature in one
# file, which is all `cosign verify-blob --bundle` needs.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]
    artifacts: checksum

changelog:
  use: git # works in local, snapshot and tag runs, and needs no token
  sort: asc
  filters:
    exclude: # git lines are "<sha> <subject>", hence the leading ^.*?
      - '^.*?docs(\([[:word:]]+\))??!?:'
      - '^.*?style(\([[:word:]]+\))??!?:'
      - '^.*?test(\([[:word:]]+\))??!?:'
      - '^.*?chore(\([[:word:]]+\))??!?:'
      # A merge commit is never a user-facing change. Anchoring on the sha
      # (^[0-9a-f]+ Merge) does not match: filtering sees the subject, not the
      # rendered "<sha> <subject>" line (verified 2026-08-14).
      - '^.*?Merge '
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: slng-ai
    name: unmute # spelled out: a local remote may still carry the old repo name
  prerelease: auto # an rc or beta tag becomes a GitHub prerelease
  # What makes re-running a failed run safe. Without it, a re-run against a
  # release that already published its assets dies on every upload with
  # `422 already_exists` and never reaches the publishers — v0.1.2's first
  # re-run proved it on 2026-08-14. With it, GoReleaser deletes the conflicting
  # asset and retries. Builds are reproducible, so the replacement is
  # byte-identical anyway. GitHub only, which is the only place we publish.
  replace_existing_artifacts: true
  # Hand-written release notes, without a second command or a Pro feature: the
  # annotated tag's whole message goes above the generated changelog. Write the
  # notes, `git tag -a --cleanup=verbatim -F notes.md`, push. TagContents, not
  # TagBody: TagBody drops the first line, which is where a heading lives. An
  # unannotated tag falls back to the commit's own message, so always annotate.
  header: |
    {{ .TagContents }}

# macOS only, by design: Homebrew casks are for macOS, so Linux users take the
# archive or `go install` (FR-011).
homebrew_casks:
  - name: unmute
    # Rollout Phase 2, opened 2026-08-14. "auto" uploads stable releases and
    # skips prereleases. Not `false`, which would push an rc to the tap.
    skip_upload: "auto"
    repository:
      owner: slng-ai
      name: homebrew-tap # the cask lands in Casks/, the default
      # The default Actions token cannot write to another repository, so this
      # one credential exists. Only the name appears here, never a value.
      token: "{{ .Env.GH_PAT }}"
    homepage: https://github.com/slng-ai/unmute
    description: Compile a declarative voice-agent package to Pipecat or LiveKit
    # Casks have no license field (FR-017); the archives carry LICENSE instead.
    hooks:
      post:
        # An unsigned binary downloaded by brew is quarantined, and macOS refuses
        # to run it with a dialog that offers no way out. Stripping the attribute
        # at install time is what makes `unmute --version` work right after
        # `brew install`.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/unmute"]
          end

# The Windows channel that works the moment this run finishes: nobody reviews a
# Scoop manifest. Direct push rather than a pull request, because only release
# runs ever write to the bucket, and in PR mode a publish error is only logged
# instead of failing the run. Everything not set here is a default that already
# fits: the manifest is built from the Windows zips above, for both
# architectures, pointing at this release's assets.
scoops:
  - name: unmute
    # Same meaning as the cask: stable releases publish, prereleases skip.
    skip_upload: "auto"
    repository:
      owner: slng-ai
      # The manifest has to land in the repository root; in a subdirectory
      # `scoop bucket list` reports the bucket as empty.
      name: scoop-bucket
      token: "{{ .Env.GH_PAT }}"
    homepage: https://github.com/slng-ai/unmute
    description: Compile a declarative voice-agent package to Pipecat or LiveKit
    license: MIT # unlike a cask, a Scoop manifest carries the license itself

# Open since 2026-08-15. Every stable tag pushes a manifest branch to the org's
# fork of microsoft/winget-pkgs and opens the PR from it. Microsoft reviews every
# manifest, so `winget install slng.unmute` works only after they merge; Scoop
# above is the channel that is live the moment this run finishes. This publisher
# logs its errors instead of failing the run, so read the log after every tag.
winget:
  - publisher: slng
    package_identifier: slng.unmute
    short_description: Compile a declarative voice-agent package to Pipecat or LiveKit
    license: MIT # required by winget, unlike the cask
    publisher_url: https://slng.ai
    publisher_support_url: https://github.com/slng-ai/unmute/issues
    homepage: https://github.com/slng-ai/unmute
    skip_upload: "auto" # same meaning as the cask: stable publishes, rc skips
    repository:
      owner: slng-ai # the org owns the fork, and the maintainer is admin on it
      name: winget-pkgs
      # Its own credential, not GH_PAT: the PR is opened on
      # microsoft/winget-pkgs, and a fine-grained token only ever reaches
      # repositories its owner owns. This one is classic, scoped to public_repo.
      token: "{{ .Env.GH_PAT_WINGET }}"
      pull_request:
        enabled: true # the branch defaults to unmute-<version>
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
